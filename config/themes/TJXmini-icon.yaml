theme:
  name: TJXmini-icon
  version: '2.0'
  description: TJX colors and style — mini-icon calendar only
base:
  font_family: PlaywriteDEGrund-VariableFont_wght
  default_missing_icon: applet-closed
header:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
footer:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
events:
  icon_color: blue
  item_placement_order:
    - priority
durations:
  icon_color: navy
  stroke_dasharray: null
watermark:
  text: null
  color: blue
  font_family: PlaywriteDEGrund-VariableFont_wght
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: 1
colors:
  month_palette: viridis
  fiscal_palette: Greys
  group_palette: Pastel1
  hash_lines: black
  company_holiday:
    opacity: 0.25
    color: gold
  federal_holiday:
    opacity: 0.1
    color: tomato
mini_calendar:
  cell_font: JuliaMono-Regular
  cell_bold_font: Caveat-Bold
  cell_font_size: 48
  title_font: Caveat-Bold
  title_font_size: 18
  title_format: MMMM YYYY
  title_color: navy
  header_font: JuliaMono-Regular
  header_font_size: 12
  header_color: grey
  day_number_glyphs: null
  day_number_digits: null
  day_color: black
  adjacent_month_color: lightgrey
  show_adjacent: false
  holiday_color: red
  nonworkday_fill_color: blood
  milestone_color: navy
  circle_milestones: false
  milestone_stroke_color: navy
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: black
  week_number_font: JuliaMono-Regular
  week_number_font_size: 12
  week_number_color: Blue
  week_number_label_format: W{num}
  grid_lines: true
  grid_line_color: grey
  grid_line_width: 0.4
  grid_line_opacity: 0.7
  grid_line_dasharray: 1,2
  month_outline_color: navy
  month_outline_width: 0.75
  month_outline_opacity: 0.6
  month_outline_dasharray: null
  cell_box_stroke_dasharray: null
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
mini_details:
  title_text: Event Details
  title_font: RobotoCondensed-Bold
  title_font_size: null
  title_color: navy
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_color: grey
  name_text:
    font_name: RobotoCondensed-Light
    font_color: black
  notes_text:
    font_name: RobotoCondensed-LightItalic
    font_color: darkgrey
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 14
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 12
  - name: define text:heading
    define: text
    as: heading
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 14
      color: grey
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: white
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label
    define: text
    as: label
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: Blue
  - name: define text:caption
    define: text
    as: caption
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: black
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: white
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: navy
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: black
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: '#F8F8FF'
      fill_opacity: 0.25
      stroke: none
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:mini_grid
    define: line
    as: mini_grid
    style:
      color: grey
      width: 0.4
      opacity: 0.7
      dasharray: 1,2
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.5
      opacity: 1.0
  - name: define icon:event
    define: icon
    as: event
    style:
      color: yellow
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
  - name: weekly_hash_0
    select:
      nonworkday: false
    apply_to: box:day
    style:
      pattern: stars74
      pattern_color: silver
      pattern_opacity: 0.01
  - name: fedholidays
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      fill: lightblue
      fill_opacity: 1.0
      pattern: app
      pattern_color: tomato
      pattern_opacity: 0.5
element_overrides:
  ec-week-number:
    use: text:label_bold
  ec-today-label:
    use: text:label
    color: grey
  ec-day-box:
    use: box:cell
  ec-grid-line:
    use: line:mini_grid
