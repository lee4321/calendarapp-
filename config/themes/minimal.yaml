theme:
  name: Minimal
  version: '2.0'
  description: Minimal theme — fewest settings possible
style_rules:
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Bold
      color: '#222222'
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Light
      color: navy
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-LightItalic
      color: '#888888'
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      color: '#555555'
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 6
      color: '#999999'
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: '#F5F5F5'
      stroke: '#CCCCCC'
      stroke_width: 0.5
  - name: define line:grid
    define: line
    as: grid
    style:
      color: '#DDDDDD'
      width: 0.5
  - name: define line:axis
    define: line
    as: axis
    style:
      color: '#888888'
      width: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: red
      width: 1.5
  - name: define icon:event
    define: icon
    as: event
    style:
      color: '#333333'
element_overrides:
  ec-day-number:
    use: text:label
  ec-month-title:
    use: text:heading
  ec-week-number:
    use: text:label
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: red
  ec-heading-cell:
    use: box:default
  ec-band-cell:
    use: box:default
  ec-callout-box:
    use: box:default
  ec-vline-fill:
    use: box:default
  ec-day-box:
    use: box:cell
  ec-separator:
    use: line:grid
  ec-duration-marker:
    use: line:axis
  ec-duration-icon:
    use: icon:event
  ec-overflow-icon:
    use: icon:event
  ec-legend-swatch:
    use: line:axis
