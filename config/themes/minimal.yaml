theme:
  name: Minimal
  version: '2.0'
  description: Minimal theme — fewest settings possible
gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  band_row_height: 10.0
  bar_height: 8.0
  indent_per_level: 8.0
  min_day_width: 4.0
  progress_color: black
  float_opacity_scale: 0.4
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  show_dependencies: true
  show_today_line: true
timeline_events:
  box_width: 150
style_rules:
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Bold
      color: '#222222'
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Light
      color: navy
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-LightItalic
      color: '#888888'
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      color: '#555555'
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 6
      color: '#999999'
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: '#F5F5F5'
      stroke: '#CCCCCC'
      stroke_width: 0.5
  - name: define line:grid
    define: line
    as: grid
    style:
      color: '#DDDDDD'
      width: 0.5
  - name: define line:axis
    define: line
    as: axis
    style:
      color: '#888888'
      width: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: red
      width: 1.5
  - name: define icon:event
    define: icon
    as: event
    style:
      color: '#333333'
element_overrides:
  ec-day-number:
    use: text:label
  ec-month-title:
    use: text:heading
  ec-week-number:
    use: text:label
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: red
  ec-heading-cell:
    use: box:default
  ec-band-cell:
    use: box:default
  ec-callout-box:
    use: box:default
  ec-vline-fill:
    use: box:default
  ec-day-box:
    use: box:cell
  ec-separator:
    use: line:grid
  ec-duration-marker:
    use: line:axis
  ec-duration-icon:
    use: icon:event
  ec-overflow-icon:
    use: icon:event
  ec-legend-swatch:
    use: line:axis
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squares
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    # straight perpendicular run at the axis dot
    start_stub: 4.0
    # and at the box
    end_stub: 4.0
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
