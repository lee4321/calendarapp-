theme:
  name: TJXweekly
  version: '2.0'
  description: TJX colors and style — weekly calendar only
base:
  font_family: PlaywriteDEGrund-VariableFont_wght
  default_missing_icon: applet-closed
header:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
footer:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
events:
  icon_color: blue
  item_placement_order:
    - priority
durations:
  icon_color: navy
  stroke_dasharray: null
watermark:
  text: null
  color: blue
  font_family: PlaywriteDEGrund-VariableFont_wght
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: 1
colors:
  month_palette: colorblind1
  fiscal_palette: Greys
  group_palette: Pastel1
  hash_lines: black
  resource_groups:
    a: black
    b: yellow
    c: red
    d: grey
  company_holiday:
    opacity: 0.25
    color: red
  federal_holiday:
    opacity: 0.1
    color: tomato
weekly:
  day_names:
    font_family: PlaywriteDEGrund-VariableFont_wght
    font_color: black
  week_numbers:
    font_family: PlaywriteDEGrund-VariableFont_wght
    label_format: W{num:02d}
    size_rule:
      - font_size: 14
        when:
          papersize:
            - letter
            - ledger
            - tabloid
            - arche
            - archd
            - archc
  day_box:
    stroke_color: black
    stroke_opacity: 0.5
    stroke_width: 1
    stroke_dasharray: null
    fill_color: null
    fill_opacity: 0.25
    number_font: PlaywriteDEGrund-VariableFont_wght
    number_color: '#FF7800'
    icon_color: red
    font_color: black
    hash_pattern_opacity: 0.1
  name_text:
    font_name: PlaywriteDEGrund-VariableFont_wght
    font_color: black
    font_size: 18
  notes_text:
    font_name: AlumniSansPinstripe-Italic
    font_color: grey
    font_size: 14
  overflow:
    icon: animated_overflow
    color: red
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 14
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 12
  - name: define text:heading
    define: text
    as: heading
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 14
      color: grey
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: white
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label
    define: text
    as: label
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: Blue
  - name: define text:caption
    define: text
    as: caption
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: black
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: white
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: navy
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: black
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: '#F8F8FF'
      fill_opacity: 0.25
      stroke: black
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.5
      opacity: 1.0
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 3
      opacity: 0.9
  - name: define icon:event
    define: icon
    as: event
    style:
      color: orange
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: warning
      color: red
  - name: weekends
    select:
      nonworkday: true
    apply_to: box:day
    style:
      fill: silver
      pattern: dingbat29
  - name: fedholidays
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      fill: lightblue
      fill_opacity: 1.0
      pattern: app
      pattern_color: tomato
      pattern_opacity: 0.5
  - name: Marshalls durations (name)
    select:
      task_name:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Marshalls durations (notes)
    select:
      notes:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Maxx durations
    select:
      task_name:
        - Maxx
      event_type: duration
    apply_to: box:duration
    style:
      fill: blue
  - name: Canada durations
    select:
      task_name:
        - Canada
      event_type: duration
    apply_to: box:duration
    style:
      fill: black
element_overrides:
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-today-label:
    use: text:label
    color: grey
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
