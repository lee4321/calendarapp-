text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
timeline:
  background_color: black
  axis_color: white
  axis_opacity: 0.95
  axis_width: 2
  tick_color: darkgrey
  date_format: MMM D
  tick_label_format: MMM YY
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: silver
  today_label_color: silver
  marker_stroke_color: black
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 10.0
  callout_offset_y: 96.0
  duration_offset_y: 44.0
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.0
  duration_bar_fill_opacity: 0.5
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: null
  duration_bracket_stroke_dasharray: null
  top_colors:
    - deeppink
    - gold
    - dodgerblue
    - limegreen
    - darkorange
  bottom_colors:
    - turquoise
    - crimson
    - lightskyblue
    - chartreuse
    - hotpink
  name_text:
    font_name: RobotoCondensed-Light
    font_color: deeppink
  notes_text:
    font_name: Roboto-Bold
    font_color: gold
  date:
    font_family: Roboto-Bold
    font_color: dodgerblue
pit:
  labella:
    layer_gap: 8
    node_height: 24
    density: 0.75
  axis:
    color: "#333333"
    width: 1.5
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 6.0
  tick_color: "#555555"
  tick_unit: month
  date_format: "MMM D"
  date_text:
    color: "#444444"
    font_name: Roboto-Regular
    font_size: 9
    offset: 6.0
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: dodgerblue
  milestone_color: tomato
  event_palette: Set3
  milestone_palette: Set1
  leader:
    color: "#555555"
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: dodgerblue
    marker_end_size: 6.0
  leader_secondary:
    color: darkorange
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    color: tomato
    width: 1.25
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: tomato
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: "#333333"
  label:
    stroke_color: "#333333"
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: lightyellow
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.15
    text_color: "#1b1f24"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
  label_palette: Set3
compact_plan:
  palette:
    - deeppink
    - dodgerblue
    - darkorange
    - limegreen
    - gold
    - mediumpurple
  axis_color: dimgrey
  axis_dasharray: 1.5,5
  text:
    font_color: black
  milestone_color: black
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: darkslategray
  grid_opacity: 0.65
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.16
  band_row_height: 10.0
  fiscal_year_start_month: 10
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Unmatched
  lane_match_mode: first
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_label_color: black
  header_label_opacity: 1.0
  header_label_align_h: left
  header_heading_fill_color: none
  band_font: RobotoCondensed-Bold
  band_font_size: null
  timeband_label_color: darkmagenta
  timeband_label_opacity: 1.0
  timeband_fill_color: none
  timeband_fill_palette: []
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: RobotoCondensed-Bold
  lane_label_font_size: null
  lane_label_color: black
  lane_label_align_h: left
  lane_label_align_v: middle
  lane_label_rotation: 0
  event_show_date: false
  event_date_font: RobotoCondensed-Light
  event_date_font_size: null
  event_date_color: grey
  event_date_format: YYYY-MM-DD
  marker_radius: 2.0
  vertical_line_color: deeppink
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.5
  duration_stroke_opacity: 1.0
  duration_stroke_dasharray: null
  duration_bar_height: 8.0
  name_text:
    font_name: RobotoCondensed-Light
    font_color: deeppink
  palette:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - deeppink
    - orange
  swimlanes:
    - name: Engineering
    - name: Operations
    - name: Quality
  top_bands:
    - fiscal_quarter
    - pi
    - sprint
    - month
    - week_number
    - date
    - dow
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: FY{fy} Q{q}
    show_every: 1
  pi:
    unit: interval
    label: PI
    interval_days: 70
    prefix: 'PI '
    start_index: 1
    show_every: 1
  sprint:
    unit: interval
    label: Sprint
    interval_days: 14
    prefix: 'Sprint '
    start_index: 1
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  week_number:
    unit: week
    label: Week Number
    label_format: Week {week}
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  dow:
    unit: dow
    label: DoW
    date_format: ddd
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 14
  - name: define text:heading
    define: text
    as: heading
    style:
      font: RobotoCondensed-Light
      size: 12
      color: deeppink
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 12
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 10
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Regular
      size: 10
      color: black
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-Italic
      size: 8
      color: dimgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      size: 8
      color: dimgrey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: RobotoCondensed-Bold
      size: 8
      color: darkorange
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 7
      color: dimgrey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: RobotoCondensed-Light
      size: 12
      color: orange
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 10
      color: darkorange
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: white
      fill_opacity: 0.4
      stroke: slategrey
      stroke_width: 2
      stroke_opacity: 0.3
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: Set3
      fill_colors:
        - deepskyblue
        - gold
        - tomato
        - springgreen
        - deeppink
        - orange
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lavenderblush
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.3
      stroke: slategrey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: slategrey
      width: 0.5
      opacity: 0.3
  - name: define line:axis
    define: line
    as: axis
    style:
      color: white
      width: 2
      opacity: 0.95
  - name: define line:separator
    define: line
    as: separator
    style:
      color: darkslategray
      width: 1.0
      opacity: 0.65
  - name: define line:today
    define: line
    as: today
    style:
      color: silver
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: slategrey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: deeppink
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: darkorange
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: crimson
  - name: define line:tick
    define: line
    as: tick
    style:
      color: darkgrey
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: silver
  - name: band fiscal_quarter — segment
    apply_to: box:band
    select:
      band: fiscal_quarter
    style:
      fill: none
  - name: band pi — segment
    apply_to: box:band
    select:
      band: pi
    style:
      fill: none
  - name: band sprint — segment
    apply_to: box:band
    select:
      band: sprint
    style:
      fill: none
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill: none
  - name: band week_number — segment
    apply_to: box:band
    select:
      band: week_number
    style:
      fill: none
  - name: band date — segment
    apply_to: box:band
    select:
      band: date
    style:
      fill: none
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: none
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: weekly_hash_0
    select:
      milestone: true
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.15
  - name: weekly_hash_1
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      pattern: cash
      pattern_color: crimson
      pattern_opacity: 0.12
  - name: weekly_hash_2
    select:
      nonworkday: true
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: plum
      pattern_opacity: 0.1
  - name: weekly_hash_3
    select:
      task_name:
        - API
      event_type: event
    apply_to: box:day
    style:
      pattern: squares-in-squares
      pattern_color: cyan
      pattern_opacity: 0.7
  - name: weekly_hash_4
    select:
      task_name: []
      event_type: duration
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: dodgerblue
      pattern_opacity: 0.08
  - name: weekly_hash_5
    select:
      percent_complete:
        min: 100
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: limegreen
      pattern_opacity: 0.12
  - name: weekly_hash_6
    select:
      notes:
        - urgent
        - blocker
    apply_to: box:day
    style:
      pattern: cash
      pattern_color: hotpink
      pattern_opacity: 0.14
  - name: weekly_hash_7
    select:
      wbs: '1.'
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names:
        - Alice
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: mediumpurple
      pattern_opacity: 0.1
  - name: weekly_hash_9
    select:
      resource_group:
        - dev
    apply_to: box:day
    style:
      pattern: squares-in-squares
      pattern_color: dodgerblue
      pattern_opacity: 0.15
  - name: blockplan_vline_0
    apply_to: box:vline
    select:
      band: Sprint
      repeat: true
    style:
      align: end
      fill:
        - '#fff0f5'
        - '#f0fff4'
  - name: Route Engineering
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
    style:
      swimlane: Engineering
  - name: Route Operations
    apply_to: lane
    select:
      resource_group:
        - operations
        - ops
    style:
      swimlane: Operations
  - name: Route Quality
    apply_to: lane
    select:
      resource_group:
        - quality
        - qa
    style:
      swimlane: Quality
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-tick-label:
    use: text:caption
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: silver
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
  ec-connector:
    use: line:connector
  ec-duration-marker:
    use: line:axis
  ec-legend-swatch:
    use: line:axis
