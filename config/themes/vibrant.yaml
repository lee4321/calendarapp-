# vibrant: every value not listed here comes from 'corporate'.
# See USER_GUIDE.md, "Theme inheritance".  Rewritten by tools/derive_theme.py.
extends: corporate
unset: [candybar.month_shade_colors]
theme:
  name: Vibrant
  description: Colorful high-contrast theme with seasonal month colors
base: {font_family: SairaExtraCondensed-Regular}
events:
  icon_color: deeppink
  item_placement_order: [milestones, events, alphabetical]
watermark:
  font_family: SairaExtraCondensed-Regular
  opacity: 0.5
  rotation_angle: 45.0
colors:
  month_palette: paired
  fiscal_palette: reds
  group_palette: pastel1
  hash_lines: slategrey
  federal_holiday: {color: crimson, opacity: 0.3}
  company_holiday: {color: limegreen, opacity: 0.3}
weekly:
  day_box: {hash_pattern_opacity: 0.12}
mini_calendar:
  cell_bold_font: SairaExtraCondensed-Bold
  cell_font_size: 12
  title_format: MMMM
  adjacent_month_color: grey
  show_adjacent: false
  holiday_color: crimson
  nonworkday_fill_color: plum
  milestone_color: chocolate
  circle_milestones: false
  milestone_stroke_color: chocolate
  current_day_color: darkgoldenrod
  week_number_font_size: 9
  week_number_label_format: '{num}'
candybar:
  grid_line_color: grey
  weekend_fill: null
  month_shading: false
  month: {font: SairaExtraCondensed-Bold, color: crimson}
  month_box: {fill: null, stroke: chocolate}
timeline:
  tick_label_format: MMM DD
  today_line_color: crimson
  marker_stroke_color: black
  top_colors: [deeppink, gold, dodgerblue, limegreen, darkorange]
  bottom_colors: [turquoise, crimson, lightskyblue, chartreuse, hotpink]
timeline_events: {box_width: 115}
pit:
  labella: {layer_gap: 16, node_height: 32, density: 0.6}
  axis: {color: black, marker_end_size: 10}
  tick_color: black
  # Two tick rows: bold month labels over a light weekly grid.
  ticks:
    - unit: month
      label_format: MMM
      label_side: below
      tick_length: 9.0
      tick_color: black
      label_color: black
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above
      label_color: dimgrey
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: grey
      tick_opacity: 0.9
  date_format: MM/DD
  name_text: {font_name: SairaExtraCondensed-Regular}
  notes_text: {font_name: SairaExtraCondensed-Regular}
  date_text:
    color: '#444444'
    font_name: SairaExtraCondensed-Regular
    font_size: 5
    offset: 4
  dot_color: dodgerblue
  milestone_color: orangered
  leader: {color: '#555555'}
  leader_primary: {color: dodgerblue}
  leader_secondary: {color: chocolate}
  today_line: {color: crimson, width: 1.25, label_color: crimson}
  arrow_head: {color: '#333333'}
  label:
    stroke_color: '#333333'
    fill_color: lightyellow
    text_color: '#1b1f24'
  label_palette: Set3
compact_plan:
  palette:
    - deeppink
    - dodgerblue
    - darkorange
    - limegreen
    - gold
    - mediumpurple
blockplan:
  header_label_align_h: right
  # Non-workday shading for the single-day date/dow cells, in the theme's own
  # holiday colors (colors.federal_holiday / colors.company_holiday). Applied
  # federal → company → weekend, first match wins.
  federal_holiday_fill_color: crimson
  federal_holiday_fill_opacity: 0.3
  company_holiday_fill_color: limegreen
  company_holiday_fill_opacity: 0.3
  weekend_fill_color: plum
  weekend_fill_opacity: 0.25
  duration_bar_height: 12
  palette: [deepskyblue, gold, tomato, springgreen, deeppink, orange]
  top_bands:
    - fiscal_quarter
    - pi
    - sprint
    - month
    - week_number
    - date
    - dow
    # Last, directly above the swimlanes, so a flag sits as close as it can to
    # the shaded column it explains.
    - band: holiday
      row_height: 12
      # An icon band sizes its heading from the row height unless told
      # otherwise, which would print "Holidays" smaller than the labels
      # stacked above it.
      label_font_size: 12
time_bands:
  holiday:
    unit: holiday
    label: Holidays
    # false also shows observances (Groundhog Day and the like) that carry a
    # flag but do not close the office; the shading below marks which days
    # actually close.
    nonworkdays_only: false
style_rules:
  - name: box:duration — blockplan (from blockplan)
    style: {stroke_opacity: 1.0}
  - name: resource group a
    style: {fill: deeppink}
  - name: resource group b
    style: {fill: dodgerblue}
  - name: resource group c
    style: {fill: chocolate}
  - name: resource group d
    style: {fill: mediumseagreen}
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    style: {opacity: 0.5}
  - name: define text:heading
    style: {font: SairaExtraCondensed-Regular, color: mediumvioletred}
  - {name: 'text:heading — blockplan (from blockplan)'}
  - name: text:heading — letter / ledger / tabloid paper
    apply_to: text:heading
    select:
      papersize: [letter, ledger, tabloid]
    style: {size: 12}
  - name: text:heading — 3x5 / 5x8 paper
    style: {size: 10}
  - name: define text:body
    style: {size: 10, color: black}
  - name: define text:body_secondary
    style: {size: 8, color: dimgrey}
  - name: define text:label
    style: {size: 8, color: dimgrey}
  - name: define text:label_bold
    style: {size: 8, color: '#b26200'}
  - name: define text:caption
    style: {size: 7, color: dimgrey}
  - name: define text:day_number
    style: {font: RobotoCondensed-Light, size: 12, color: '#b26200'}
  - name: define text:month_title
    style: {font: Roboto-Bold, size: 10, color: '#b26200'}
  - name: define box:cell
    style:
      fill: white
      fill_opacity: 0.4
      stroke: slategrey
      stroke_width: 2
      stroke_opacity: 0.7
  - name: define box:timeband
    style:
      fill_palette: Set3
      fill_colors: [deepskyblue, gold, tomato, springgreen, deeppink, orange]
  - name: define box:highlight
    style: {fill: lavenderblush}
  - name: define box:callout
    style: {fill: white, fill_opacity: 0.3, stroke: slategrey}
  - name: define line:grid
    style: {color: slategrey, opacity: 0.7}
  - name: define line:axis
    style: {color: black, opacity: 0.95}
  - name: define line:separator
    style: {color: darkslategray, width: 1.0, opacity: 0.65}
  - name: define line:today
    style: {color: crimson}
  - name: define line:connector
    style: {color: slategrey}
  - name: define icon:event
    style: {color: deeppink}
  - name: define icon:duration
    style: {color: chocolate}
  - name: define icon:overflow
    style: {color: crimson}
  - name: define line:tick
    style: {color: grey}
  - name: today label color
    style: {color: crimson}
  - name: box:band — blockplan (from blockplan)
    style: {stroke_opacity: 0.65}
  - name: weekly_hash_0
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.15
  - name: weekly_hash_1
    style: {pattern: cash, pattern_color: crimson, pattern_opacity: 0.12}
  - name: weekly_hash_2
    style: {pattern: wiggle, pattern_color: plum, pattern_opacity: 0.1}
  - name: weekly_hash_3
    select:
      task_name: [API]
      event_type: event
    style:
      pattern: squares-in-squares
      pattern_color: cyan
      pattern_opacity: 0.7
  - name: weekly_hash_4
    select:
      task_name: []
      event_type: duration
    style:
      pattern: polka-dots
      pattern_color: dodgerblue
      pattern_opacity: 0.08
  - name: weekly_hash_5
    select:
      percent_complete: {min: 100}
    style:
      pattern: polka-dots
      pattern_color: limegreen
      pattern_opacity: 0.12
  - name: weekly_hash_6
    select:
      notes: [urgent, blocker]
    style: {pattern: cash, pattern_color: hotpink, pattern_opacity: 0.14}
  - name: weekly_hash_7
    select: {wbs: '1.'}
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names: [Alice]
    style:
      pattern: polka-dots
      pattern_color: mediumpurple
      pattern_opacity: 0.1
  - name: weekly_hash_9
    select:
      resource_group: [dev]
    apply_to: box:day
    style:
      pattern: squares-in-squares
      pattern_color: dodgerblue
      pattern_opacity: 0.15
  - name: blockplan_vline_0
    style:
      fill: ['#fff0f5', '#f0fff4']
  # Shade every non-working column the full height of the swimlanes, so a bar
  # crossing a holiday or a weekend shows it. One rule per type, in the same
  # colors as the date/dow band cells above (blockplan.*_fill_color), so a
  # column and its cell agree about what kind of day it is. Weekends are
  # declared first: a holiday falling on a weekend matches both rules, and the
  # fills paint in declaration order, so the holiday tint lands on top.
  - name: blockplan_vline_weekend
    apply_to: box:vline
    select: {band: Date, repeat: true, weekend: true}
    style: {fill: plum, fill_opacity: 0.25}
  - name: blockplan_vline_federal_holiday
    apply_to: box:vline
    select: {band: Date, repeat: true, federal_holiday: true}
    style: {fill: crimson, fill_opacity: 0.22}
  - name: blockplan_vline_company_holiday
    apply_to: box:vline
    select: {band: Date, repeat: true, company_holiday: true}
    style: {fill: limegreen, fill_opacity: 0.22}
  - name: blockplan_vline_daily
    apply_to: box:vline
    select: {band: Date, repeat: true}
    style:
      align: start
      stroke: deeppink
      stroke_width: 0.5
      stroke_opacity: 0.35
  - {name: 'define text:week_number'}
  - name: box:cell — weekly (from weekly.day_box)
    apply_to: box:cell
    select: {visualizer: weekly}
    style: {dasharray: 8 2}
  - name: line:grid — mini (from mini_calendar)
    apply_to: line:grid
    select: {visualizer: mini}
    style: {dasharray: 5 1}
  - name: text:event_name — pit (from timeline.name_text)
    style: {font: SairaExtraCondensed-Regular}
  - name: text:event_notes — pit (from timeline.notes_text)
    style: {font: SairaExtraCondensed-Bold}
  - {name: 'text:heading — letter / ledger paper', remove: true}
element_overrides:
  ec-today-label: {color: crimson}
