  ec-axis-tick:
    use: line:tick
  ec-tick-label:
    use: text:caption
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: crimson
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
  ec-connector:
    use: line:connector
  ec-duration-marker:
