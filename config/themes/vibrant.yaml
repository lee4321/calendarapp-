theme:
  name: Vibrant
  version: '2.0'
  description: Colorful high-contrast theme with seasonal month colors
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
  font_family: SairaExtraCondensed-Regular
  default_missing_icon: null
header:
  font_family: SairaExtraCondensed-Regular
  left:
    font_color: deeppink
  center:
    font_color: '#b26200'
  right:
    font_family: SairaExtraCondensed-Regular
    font_color: dodgerblue
footer:
  font_family: SairaExtraCondensed-Regular
  font_color: dimgrey
events:
  icon_color: deeppink
  item_placement_order:
    - milestones
    - events
    - alphabetical
durations:
  icon_color: chocolate
  stroke_dasharray: null
watermark:
  text: null
  color: darkorchid
  font_family: SairaExtraCondensed-Regular
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 0.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: paired
  fiscal_palette: reds
  group_palette: pastel1
  hash_lines: slategrey
  federal_holiday:
    color: crimson
    opacity: 0.3
  company_holiday:
    color: limegreen
    opacity: 0.3
  resource_groups:
    a: deeppink
    b: dodgerblue
    c: chocolate
    d: mediumseagreen
weekly:
  day_names:
    font_family: SairaExtraCondensed-Regular
    font_color: '#b26200'
  week_numbers:
    font_family: SairaExtraCondensed-Regular
    font_color: '#b26200'
    label_format: W{num:02d}
  day_box:
    stroke_color: slategrey
    stroke_opacity: 0.7
    stroke_width: 2
    stroke_dasharray: 8 2
    fill_color: white
    fill_opacity: 0.4
    number_font: SairaExtraCondensed-Regular
    number_color: '#b26200'
    icon_color: chocolate
    font_color: '#b26200'
    hash_pattern_opacity: 0.12
  name_text:
    font_name: SairaExtraCondensed-Regular
    font_color: black
  notes_text:
    font_name: SairaExtraCondensed-Regular
    font_color: dimgrey
  overflow:
    icon: warningtriangle
    color: crimson
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squares
  cell_font: SairaExtraCondensed-Regular
  cell_bold_font: SairaExtraCondensed-Bold
  cell_font_size: 12
  title_font: SairaExtraCondensed-Bold
  title_font_size: null
  title_format: MMMM
  title_color: red
  header_font: SairaExtraCondensed-Bold
  header_font_size: null
  header_color: darkviolet
  day_number_glyphs: null
  day_number_digits: null
  day_color: dimgrey
  adjacent_month_color: grey
  show_adjacent: false
  holiday_color: crimson
  nonworkday_fill_color: plum
  milestone_color: chocolate
  circle_milestones: false
  milestone_stroke_color: chocolate
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: darkgoldenrod
  week_number_font: SairaExtraCondensed-Bold
  week_number_font_size: 9
  week_number_color: '#b26200'
  week_number_label_format: '{num}'
  grid_line_color: grey
  grid_line_width: 0.5
  grid_line_opacity: 0.8
  grid_line_dasharray: 5 1
  cell_box_stroke_dasharray: 5 1
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
  day_box: null
mini_details:
  title_text: Event Details
  title_font: SairaExtraCondensed-Regular
  title_font_size: 12
  title_color: deeppink
  header_font: Roboto-Bold
  header_font_size: null
  header_color: darkviolet
  name_text:
    font_name: SairaExtraCondensed-Regular
    font_color: black
  notes_text:
    font_name: SairaExtraCondensed-Regular
    font_color: dimgrey
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
candybar:
  show_week_numbers: true
  cell_width: 0            # 0 = square cells (width == row height)
  weeknum_col_ratio: 0.6   # week-number column width / day-cell width
  month_col_ratio: 1.6     # month-box column width / day-cell width
  grid_lines: true
  grid_line_color: grey
  day_color: black
  weekend_fill: null        # Sat/Sun day-cell tint (null = off)
  weekend_opacity: 0.15
  month_shading: false       # alternate day-cell tint per month
  month_shade_opacity: 0.12
  month_label_side: right
  month_format: MMM
  month:
    font: SairaExtraCondensed-Bold
    color: crimson
    opacity: 1.0
    bold: false
    anchor: middle
    rotation: 0
  month_box:
    fill: null
    stroke: chocolate
    opacity: 1.0
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    # straight perpendicular run at the axis dot
    start_stub: 4.0
    # and at the box
    end_stub: 4.0
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
  background_color: none
  axis_color: black
  axis_opacity: 0.95
  axis_width: 2
  tick_color: grey
  date_format: MMM D
  tick_label_format: MMM YY
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: crimson
  today_label_color: crimson
  marker_stroke_color: black
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 10.0
  duration_offset_y: 44.0
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.0
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: null
  duration_bracket_stroke_dasharray: null
  top_colors:
    - deeppink
    - gold
    - dodgerblue
    - limegreen
    - darkorange
  bottom_colors:
    - turquoise
    - crimson
    - lightskyblue
    - chartreuse
    - hotpink
  name_text:
    font_name: SairaExtraCondensed-Regular
    font_color: mediumvioletred
  notes_text:
    font_name: SairaExtraCondensed-Bold
    font_color: dimgrey
  date:
    font_family: SairaExtraCondensed-Bold
    font_color: royalblue
timeline_events:
  box_width: 115
pit:
  direction: horizontal      # horizontal | vertical
  label_side: both           # primary | secondary | both
  labella:
    layer_gap: 16
    node_height: 32
    density: 0.6
  axis:
    color: black
    width: 1.5
    marker_size: 7.0          # bounding box of built-in circle/diamond
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 10
  tick_color: black
  tick_unit:  month
  # Two tick rows: bold month labels over a light weekly grid.
  ticks:
    - unit: month
      label_format: MMM
      label_side: below         # month names beneath the axis
      tick_length: 9.0
      tick_color: black
      label_color: black
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above         # day numbers above, clear of the month names
      label_color: dimgrey
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: grey
      tick_opacity: 0.9
  date_format: "MM/DD"
  name_text:
    font_name: SairaExtraCondensed-Regular     # PIT callout event-name font
  notes_text:
    font_name: SairaExtraCondensed-Regular   # PIT callout notes font
  date_text:
    color: "#444444"
    font_name: SairaExtraCondensed-Regular
    font_size: 5
    offset: 4
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: dodgerblue
  milestone_color: orangered
  leader:
    color: "#555555"
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: dodgerblue
    marker_end_size: 6.0
  leader_secondary:
    color: chocolate
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    show: true
    color: crimson
    width: 1.25
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: crimson
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: "#333333"
  label:
    stroke_color: "#333333"
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: lightyellow
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.15
    text_color: "#1b1f24"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
    icon_size: null            # null = match event-name font size
    icon_gap: 4.0
  label_palette: Set3
compact_plan:
  palette:
    - deeppink
    - dodgerblue
    - darkorange
    - limegreen
    - gold
    - mediumpurple
  axis_color: dimgrey
  axis_dasharray: 1.5,5
  text:
    font_color: black
  milestone_color: black
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: darkslategray
  grid_opacity: 0.65
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.16
  band_row_height: 10.0
  fiscal_year_start_month: 10
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Unmatched
  lane_match_mode: first
  header_font: SairaExtraCondensed-Bold
  header_font_size: null
  header_label_color: black
  header_label_opacity: 1.0
  header_label_align_h: right
  header_heading_fill_color: none
  band_font: SairaExtraCondensed-Bold
  band_font_size: null
  timeband_label_color: darkmagenta
  timeband_label_opacity: 1.0
  timeband_fill_color: none
  timeband_fill_palette: []
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: SairaExtraCondensed-Bold
  lane_label_font_size: null
  lane_label_color: black
  lane_label_align_h: left
  lane_label_align_v: middle
  lane_label_rotation: 0
  event_show_date: false
  event_date_font: SairaExtraCondensed-Regular
  event_date_font_size: null
  event_date_color: grey
  event_date_format: YYYY-MM-DD
  marker_radius: 2.0
  # Non-workday shading for the single-day date/dow cells, in the theme's own
  # holiday colors (colors.federal_holiday / colors.company_holiday). Applied
  # federal → company → weekend, first match wins.
  federal_holiday_fill_color: crimson
  federal_holiday_fill_opacity: 0.3
  company_holiday_fill_color: limegreen
  company_holiday_fill_opacity: 0.3
  weekend_fill_color: plum
  weekend_fill_opacity: 0.25
  vertical_line_color: deeppink
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.5
  duration_stroke_opacity: 1.0
  duration_stroke_dasharray: null
  duration_bar_height: 12
  name_text:
    font_name: SairaExtraCondensed-Regular
    font_color: mediumvioletred
  palette:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - deeppink
    - orange
  swimlanes:
    - name: Engineering
    - name: Operations
    - name: Quality
  top_bands:
    - fiscal_quarter
    - pi
    - sprint
    - month
    - week_number
    - date
    - dow
    # Last, directly above the swimlanes, so a flag sits as close as it can to
    # the shaded column it explains.
    - band: holiday
      row_height: 12
      # An icon band sizes its heading from the row height unless told
      # otherwise, which would print "Holidays" smaller than the labels
      # stacked above it.
      label_font_size: 12
gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  band_row_height: 10.0
  bar_height: 8.0
  indent_per_level: 8.0
  min_day_width: 4.0
  progress_color: black
  float_opacity_scale: 0.4
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  show_dependencies: true
  show_today_line: true
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: FY{fy} Q{q}
    show_every: 1
  pi:
    unit: interval
    label: PI
    interval_days: 70
    prefix: 'PI '
    start_index: 1
    show_every: 1
  sprint:
    unit: interval
    label: Sprint
    interval_days: 14
    prefix: 'Sprint '
    start_index: 1
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  week_number:
    unit: week
    label: Week Number
    label_format: Week {week}
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  dow:
    unit: dow
    label: DoW
    date_format: ddd
    show_every: 1
  holiday:
    unit: holiday
    label: Holidays
    # false also shows observances (Groundhog Day and the like) that carry a
    # flag but do not close the office; the shading below marks which days
    # actually close.
    nonworkdays_only: false
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
style_rules:
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    apply_to: line:duration_bar
    select:
      visualizer: timeline
    style:
      opacity: 0.5
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 14
  - name: define text:heading
    define: text
    as: heading
    style:
      font: SairaExtraCondensed-Regular
      size: 12
      color: mediumvioletred
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 12
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 10
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Regular
      size: 10
      color: black
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-Italic
      size: 8
      color: dimgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      size: 8
      color: dimgrey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: RobotoCondensed-Bold
      size: 8
      color: '#b26200'
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 7
      color: dimgrey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: RobotoCondensed-Light
      size: 12
      color: '#b26200'
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 10
      color: '#b26200'
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: white
      fill_opacity: 0.4
      stroke: slategrey
      stroke_width: 2
      stroke_opacity: 0.7
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: Set3
      fill_colors:
        - deepskyblue
        - gold
        - tomato
        - springgreen
        - deeppink
        - orange
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lavenderblush
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.3
      stroke: slategrey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: slategrey
      width: 0.5
      opacity: 0.7
  - name: define line:axis
    define: line
    as: axis
    style:
      color: black
      width: 2
      opacity: 0.95
  - name: define line:separator
    define: line
    as: separator
    style:
      color: darkslategray
      width: 1.0
      opacity: 0.65
  - name: define line:today
    define: line
    as: today
    style:
      color: crimson
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: slategrey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: deeppink
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: chocolate
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: crimson
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: crimson
  - name: band fiscal_quarter — segment
    apply_to: box:band
    select:
      band: fiscal_quarter
    style:
      fill: none
  - name: band pi — segment
    apply_to: box:band
    select:
      band: pi
    style:
      fill: none
  - name: band sprint — segment
    apply_to: box:band
    select:
      band: sprint
    style:
      fill: none
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill: none
  - name: band week_number — segment
    apply_to: box:band
    select:
      band: week_number
    style:
      fill: none
  - name: band date — segment
    apply_to: box:band
    select:
      band: date
    style:
      fill: none
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: none
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: weekly_hash_0
    select:
      milestone: true
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.15
  - name: weekly_hash_1
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      pattern: cash
      pattern_color: crimson
      pattern_opacity: 0.12
  - name: weekly_hash_2
    select:
      nonworkday: true
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: plum
      pattern_opacity: 0.1
  - name: weekly_hash_3
    select:
      task_name:
        - API
      event_type: event
    apply_to: box:day
    style:
      pattern: squares-in-squares
      pattern_color: cyan
      pattern_opacity: 0.7
  - name: weekly_hash_4
    select:
      task_name: []
      event_type: duration
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: dodgerblue
      pattern_opacity: 0.08
  - name: weekly_hash_5
    select:
      percent_complete:
        min: 100
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: limegreen
      pattern_opacity: 0.12
  - name: weekly_hash_6
    select:
      notes:
        - urgent
        - blocker
    apply_to: box:day
    style:
      pattern: cash
      pattern_color: hotpink
      pattern_opacity: 0.14
  - name: weekly_hash_7
    select:
      wbs: '1.'
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: gold
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names:
        - Alice
    apply_to: box:day
    style:
      pattern: polka-dots
      pattern_color: mediumpurple
      pattern_opacity: 0.1
  - name: weekly_hash_9
    select:
      resource_group:
        - dev
    apply_to: box:day
    style:
      pattern: squares-in-squares
      pattern_color: dodgerblue
      pattern_opacity: 0.15
  - name: blockplan_vline_0
    apply_to: box:vline
    select:
      band: Sprint
      repeat: true
    style:
      align: end
      fill:
        - '#fff0f5'
        - '#f0fff4'
  # One line per day, pinned to the left edge of every Date-band segment, so
  # the daily band reads as a grid the bars can be measured against. Thin and
  # faint on purpose: at 1.5pt / 0.85 opacity (the theme's vertical_line_*
  # defaults) sixty of these would out-shout the bars they are there to serve.
  # Shade every non-working column the full height of the swimlanes, so a bar
  # crossing a holiday or a weekend shows it. One rule per type, in the same
  # colors as the date/dow band cells above (blockplan.*_fill_color), so a
  # column and its cell agree about what kind of day it is. Weekends are
  # declared first: a holiday falling on a weekend matches both rules, and the
  # fills paint in declaration order, so the holiday tint lands on top.
  - name: blockplan_vline_weekend
    apply_to: box:vline
    select:
      band: Date
      repeat: true
      weekend: true
    style:
      fill: plum
      fill_opacity: 0.25
  - name: blockplan_vline_federal_holiday
    apply_to: box:vline
    select:
      band: Date
      repeat: true
      federal_holiday: true
    style:
      fill: crimson
      fill_opacity: 0.22
  - name: blockplan_vline_company_holiday
    apply_to: box:vline
    select:
      band: Date
      repeat: true
      company_holiday: true
    style:
      fill: limegreen
      fill_opacity: 0.22
  - name: blockplan_vline_daily
    apply_to: box:vline
    select:
      band: Date
      repeat: true
    style:
      align: start
      stroke: deeppink
      stroke_width: 0.5
      stroke_opacity: 0.35
  - name: Route Engineering
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
    style:
      swimlane: Engineering
  - name: Route Operations
    apply_to: lane
    select:
      resource_group:
        - operations
        - ops
    style:
      swimlane: Operations
  - name: Route Quality
    apply_to: lane
    select:
      resource_group:
        - quality
        - qa
    style:
      swimlane: Quality
