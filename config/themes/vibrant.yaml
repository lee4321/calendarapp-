  fiscal_palette: dark
  group_palette: PairedColor12Steps
  hash_lines: white
  federal_holiday:
    color: crimson
    alpha: 0.3
  company_holiday:
    color: limegreen
    alpha: 0.3
  resource_groups:
    a: deeppink
    b: dodgerblue
    c: darkorange
    d: mediumseagreen
weekly:
  day_names:
    font_family: Roboto-Bold
    font_color: orange
  week_numbers:
    font_family: RobotoCondensed-Bold
    font_color: darkorange
    label_format: W{num:02d}
  day_box:
    stroke_color: slategrey
    stroke_opacity: 0.3
    stroke_width: 2
    stroke_dasharray: 8 2
    fill_color: white
    fill_opacity: 0.4
