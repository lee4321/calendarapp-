theme:
  name: TJXcompactplan
  version: '2.0'
  description: TJX colors and style — compact activities plan only
base:
  font_family: PlaywriteDEGrund-VariableFont_wght
  default_missing_icon: applet-closed
layout:
  margin:
    top: 0.5in
    right: 0.5in
    bottom: 0.5in
    left: 0.5in
events:
  item_placement_order:
    - priority
watermark:
  text: null
  font_family: PlaywriteDEGrund-VariableFont_wght
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
continuation:
  show: true
  icon_after: move-right
  icon_height: 8.0
  icon_color: grey
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: 1
colors:
  month_palette: oranges
  fiscal_palette: blues
  group_palette: pastel1
  hash_lines: black
  resource_groups:
    a: black
    b: yellow
    c: red
    d: grey
  company_holiday:
    opacity: 0.25
    color: gold
  federal_holiday:
    opacity: 0.1
    color: tomato
compact_plan:
  palette:
    - deepskyblue
    - gold
    - tomato
    - grey
    - mediumseagreen
    - mediumpurple
  axis_padding: 5.0
  axis_width: 1.0
  show_axis: false
  header_bottom_y: 8
  key_top_y: 8
  band_row_height: 10.0
  federal_holiday_fill_color: tomato
  federal_holiday_fill_opacity: 1.0
  company_holiday_fill_color: gold
  company_holiday_fill_opacity: 1.0
  weekend_fill_color: '#E8E8E8'
  weekend_fill_opacity: 1.0
  federal_holiday_icon: flag-us
  text:
    font_name: RobotoCondensed-Light
  duration_line_width: 9.0
  lane_spacing: 12.0
  show_duration_icons: true
  duration_icon_list: squircles
  duration_icon_height: 8.0
  milestone_flag_height: 9.0
  milestone_flag_width: 7.0
  milestone_icon: null
  show_milestone_labels: false
  name_text:
    font_name: RobotoCondensed-Light
  legend_column_split: 0.5
  show_legend: true
  legend_row_height: 10.0
  legend_swatch_width: 20.0
  show_milestone_list: true
  milestone_list_date_format: M/D
  milestone_list_row_height: 10.0
  milestone_list_date_col_width: 32.0
  continuation_legend_text: activity continues
  bands:
    - band: month
      row_height: 25
    - date_range
    - dow
  legend_area_ratio: 0.25
time_bands:
  month:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
    text_align: center
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
    text_align: center
  dow:
    unit: date
    label: DoW
    date_format: ddd
    show_every: 1
    text_align: center
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 14
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 12
  - name: define text:heading
    define: text
    as: heading
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 14
      color: grey
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 10
      color: grey
  - name: define text:label
    define: text
    as: label
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:caption
    define: text
    as: caption
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: black
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 3
      opacity: 0.9
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define icon:event
    define: icon
    as: event
    style:
      color: yellow
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill:
        - lightblue
        - grey
  - name: band month — label
    apply_to: text:band_label
    select:
      band: month
    style:
      color: black
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: pink
  - name: band dow — label
    apply_to: text:band_label
    select:
      band: dow
    style:
      color: white
  - name: Marshalls durations (name)
    select:
      task_name:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Marshalls durations (notes)
    select:
      notes:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Maxx durations
    select:
      task_name:
        - Maxx
      event_type: duration
    apply_to: box:duration
    style:
      fill: blue
  - name: Canada durations
    select:
      task_name:
        - Canada
      event_type: duration
    apply_to: box:duration
    style:
      fill: black
  - name: compactplan_vline_weekend
    apply_to: box:vline
    select:
      band: DoW
      repeat: true
      weekend: true
    style:
      align: center
      stroke: '#888888'
      stroke_width: 0.0
      stroke_opacity: 0.05
      dasharray: 2,3
      fill: '#E8E8E8'
      fill_opacity: 0.4
  - name: compactplan_vline_company_holiday
    apply_to: box:vline
    select:
      band: DoW
      repeat: true
      company_holiday: true
    style:
      align: center
      stroke: goldenrod
      stroke_width: 0.0
      stroke_opacity: 0.07
      dasharray: 4,2
      fill: gold
      fill_opacity: 0.3
  - name: compactplan_vline_federal_holiday
    apply_to: box:vline
    select:
      band: DoW
      repeat: true
      federal_holiday: true
    style:
      align: center
      stroke: firebrick
      stroke_width: 0.0
      stroke_opacity: 0.25
      fill: tomato
      fill_opacity: 0.5
  - name: 'define text:base  # backfilled from basic.yaml'
    define: text
    as: base
    style:
      font: Roboto-Regular
      size: 9
      color: black
  - name: 'define text:day_number  # backfilled from basic.yaml'
    define: text
    as: day_number
    style:
      font: Roboto-Regular
      size: 10
      color: black
  - name: 'define text:month_title  # backfilled from basic.yaml'
    define: text
    as: month_title
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: 'define text:week_number  # backfilled from basic.yaml'
    define: text
    as: week_number
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:event_name  # backfilled from basic.yaml'
    define: text
    as: event_name
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: 'define text:event_notes  # backfilled from basic.yaml'
    define: text
    as: event_notes
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:event_date  # backfilled from basic.yaml'
    define: text
    as: event_date
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:duration_date  # backfilled from basic.yaml'
    define: text
    as: duration_date
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:holiday_title  # backfilled from basic.yaml'
    define: text
    as: holiday_title
    style:
      font: Roboto-Regular
      size: 7
      color: black
  - name: 'define text:today_label  # backfilled from basic.yaml'
    define: text
    as: today_label
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:fiscal_label  # backfilled from basic.yaml'
    define: text
    as: fiscal_label
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: 'define text:swimlane_label  # backfilled from basic.yaml'
    define: text
    as: swimlane_label
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: 'define text:band_label  # backfilled from basic.yaml'
    define: text
    as: band_label
    style:
      font: Roboto-Regular
      size: 7
      color: black
      align: center
  - name: 'define text:milestone_label  # backfilled from basic.yaml'
    define: text
    as: milestone_label
    style:
      font: Roboto-Regular
      size: 7
      color: black
      align: center
  - name: 'define box:cell  # backfilled from basic.yaml'
    define: box
    as: cell
    style:
      fill: white
      stroke: lightgrey
      stroke_width: 0.5
  - name: 'define box:callout  # backfilled from basic.yaml'
    define: box
    as: callout
    style:
      fill: white
      stroke: grey
      stroke_width: 0.5
  - name: 'define box:day  # backfilled from basic.yaml'
    define: box
    as: day
    style:
      fill: white
      stroke: lightgrey
      stroke_width: 0.5
  - name: 'define box:event  # backfilled from basic.yaml'
    define: box
    as: event
    style:
      fill: none
      stroke: none
  - name: 'define box:duration  # backfilled from basic.yaml'
    define: box
    as: duration
    style:
      fill: lightgrey
      stroke: grey
      stroke_width: 0.5
  - name: 'define box:milestone  # backfilled from basic.yaml'
    define: box
    as: milestone
    style:
      fill: none
      stroke: none
  - name: 'define box:vline  # backfilled from basic.yaml'
    define: box
    as: vline
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
  - name: 'define box:swimlane_heading  # backfilled from basic.yaml'
    define: box
    as: swimlane_heading
    style:
      fill: '#fafafa'
      stroke: lightgrey
      stroke_width: 0.5
  - name: 'define box:swimlane_content  # backfilled from basic.yaml'
    define: box
    as: swimlane_content
    style:
      fill: none
      stroke: none
  - name: 'define box:band  # backfilled from basic.yaml'
    define: box
    as: band
    style:
      fill: none
      stroke: lightgrey
      stroke_width: 0.5
  - name: 'define line:today  # backfilled from basic.yaml'
    define: line
    as: today
    style:
      color: grey
      width: 1.0
      opacity: 1.0
  - name: 'define icon:milestone  # backfilled from basic.yaml'
    define: icon
    as: milestone
    style:
      icon: diamond
      color: black
      size: 10
  - name: 'define icon:overflow  # backfilled from basic.yaml'
    define: icon
    as: overflow
    style:
      icon: overflow
      color: grey
      size: 8
element_overrides:
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-legend-swatch:
    use: line:axis
  ec-legend-text:
    use: text:body_secondary
