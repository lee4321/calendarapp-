# Julia: every value not listed here comes from 'corporate'.
# See USER_GUIDE.md, "Theme inheritance".  Rewritten by tools/derive_theme.py.
extends: corporate
unset: [candybar.month_shade_colors]
theme:
  name: Julia
  description: JuliaMono monospace calendar with blue-grey tones — unified theme model
base: {font_family: JuliaMono-Regular}
watermark: {font_family: JuliaMono-Regular, opacity: 0.25}
fiscal: {year_offset: 1}
mini_calendar: {cell_bold_font: JuliaMono-Regular}
candybar:
  weekend_fill: null
  month_shading: false
  month: {color: navy}
  month_box: {fill: null, stroke: steelblue}
timeline_events: {box_width: 50, box_height: 20}
pit:
  tick_color: cadetblue
  ticks:
    - unit: month
      label_format: MMM
      label_side: below
      font: JuliaMono-Regular
      tick_length: 8.0
      tick_color: cadetblue
      label_color: cadetblue
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above
      font: JuliaMono-Regular
      label_color: lightsteelblue
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: lightsteelblue
      tick_opacity: 0.5
  name_text: {font_name: JuliaMono-Regular}
  notes_text: {font_name: JuliaMono-RegularItalic}
  date_text: {font_name: JuliaMono-Regular}
  dot_color: steelblue
  leader: {color: cadetblue}
  leader_primary: {color: steelblue}
  leader_secondary: {color: slategrey}
  today_line: {label_font_name: JuliaMono-Regular}
  arrow_head: {color: cadetblue}
compact_plan:
  palette: [royalblue, gold, plum, cadetblue, tomato, khaki]
blockplan:
  palette: [lightskyblue, gold, tomato, springgreen, plum, khaki]
style_rules:
  - name: box:duration — blockplan (from blockplan)
    style: {stroke_width: 1.0}
  - name: define text:heading
    style: {font: JuliaMono-Regular, size: 10}
  - name: define text:label
    style: {font: JuliaMono-RegularItalic}
  - name: define text:caption
    style: {font: JuliaMono-Regular}
  - name: define text:month_title
    style: {font: JuliaMono-Regular}
  - name: define box:cell
    style: {stroke_width: 1}
  - name: define box:highlight
    style: {fill: aliceblue}
  - name: define box:callout
    style: {fill: white}
  - name: weekly_hash_0
    style: {pattern: temple, pattern_color: blue, pattern_opacity: 0.22}
  - name: weekly_hash_1
    style: {pattern: temple, pattern_opacity: 0.18}
  - name: weekly_hash_2
    style: {pattern: temple, pattern_opacity: 0.1}
  - name: weekly_hash_3
    select:
      task_name: [Release, Cutover]
      event_type: event
    style: {pattern: temple, pattern_color: blue}
  - name: weekly_hash_4
    select:
      task_name: [Imaginary Sprint 4]
      event_type: duration
    style:
      pattern: temple
      pattern_color: cadetblue
      pattern_opacity: 0.12
  - name: weekly_hash_5
    select:
      percent_complete: {min: 100}
    style:
      pattern: temple
      pattern_color: mediumseagreen
      pattern_opacity: 0.15
  - name: weekly_hash_6
    select:
      notes: [blocker, risk]
    style:
      pattern: temple
      pattern_color: tomato
      pattern_opacity: 0.15
  - name: weekly_hash_7
    select: {wbs: '1.'}
    style:
      pattern: temple
      pattern_color: powderblue
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names: [Alice]
    style: {pattern: temple, pattern_color: plum, pattern_opacity: 0.1}
  - name: weekly_hash_9
    select:
      resource_group: [dev]
    apply_to: box:day
    style:
      pattern: temple
      pattern_color: slateblue
      pattern_opacity: 0.12
  - name: text:event_name — pit (from timeline.name_text)
    style: {font: JuliaMono-Regular}
  - name: text:event_notes — pit (from timeline.notes_text)
    style: {font: JuliaMono-Regular}
