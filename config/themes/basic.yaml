theme:
  name: basic
  version: '3.0'
  description: Absolute minimum viable theme. See design §11.4.
base:
  font_family: Roboto-Regular
  default_missing_icon: applet-closed
layout:
  margin:
    top: 0.5in
    right: 0.5in
    bottom: 0.5in
    left: 0.5in
events:
  item_placement_order:
    - priority
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Greys
  fiscal_palette: Greys
  group_palette: Greys
  federal_holiday:
    opacity: 0.25
  company_holiday:
    opacity: 0.25
weekly:
  week_numbers:
    label_format: W{num:02d}
  overflow:
    icon: warningtriangle
mini_calendar:
  title_format: MMMM YYYY
  week_number_label_format: W{num}
  icon_set: squares
mini_details:
  output_suffix: _details
  title_text: Event Details
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Days
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  duration_fill: ■
  event_symbols:
    - •
  milestone_symbols:
    - ◆
  holiday_symbols:
    - ✕
  nonworkday_symbols:
    - ·
timeline:
  tick_label_format: M/D
  today_date: ''
  today_label_text: Today
  marker_radius: 4.0
  icon_size: 8
  duration_offset_y: 30.0
  duration_lane_gap_y: 8.0
timeline_events:
  box_width: 120
compact_plan:
  legend_area_ratio: 0.25
  bands:
    - date_range
blockplan:
  fiscal_year_start_month: 1
  week_start: 0
  label_column_ratio: 0.1
  band_row_height: 12.0
  lane_match_mode: first
  show_unmatched_lane: true
  unmatched_lane_name: Other
  swimlanes:
    - name: Other
  top_bands: []
  bottom_bands: []
excelheader:
  font_name: Calibri
  font_size: 9
  band_row_height: 18.0
  top_bands: []
  vertical_lines: []
gantt:
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  band_row_height: 10.0
  bar_height: 8.0
  indent_per_level: 8.0
  min_day_width: 4.0
  progress_color: black
  float_opacity_scale: 0.4
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  show_dependencies: true
  show_today_line: true
time_bands:
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
style_rules:
  - name: define text:base
    define: text
    as: base
    style:
      font: Roboto-Regular
      size: 9
      color: black
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Regular
      size: 10
      color: black
  - name: define text:body
    define: text
    as: body
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: define text:caption
    define: text
    as: caption
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:label
    define: text
    as: label
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Regular
      size: 10
      color: black
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: define text:week_number
    define: text
    as: week_number
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:event_name
    define: text
    as: event_name
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: define text:event_notes
    define: text
    as: event_notes
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:event_date
    define: text
    as: event_date
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:duration_date
    define: text
    as: duration_date
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: Roboto-Regular
      size: 7
      color: black
  - name: define text:today_label
    define: text
    as: today_label
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:fiscal_label
    define: text
    as: fiscal_label
    style:
      font: Roboto-Regular
      size: 7
      color: grey
  - name: define text:swimlane_label
    define: text
    as: swimlane_label
    style:
      font: Roboto-Regular
      size: 8
      color: black
  - name: define text:band_label
    define: text
    as: band_label
    style:
      font: Roboto-Regular
      size: 7
      color: black
  - name: define text:milestone_label
    define: text
    as: milestone_label
    style:
      font: Roboto-Regular
      size: 7
      color: black
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: white
      stroke: lightgrey
      stroke_width: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      stroke: grey
      stroke_width: 0.5
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: '#f0f0f0'
      fill_opacity: 0.5
      stroke: none
  - name: define box:day
    define: box
    as: day
    style:
      fill: white
      stroke: lightgrey
      stroke_width: 0.5
  - name: define box:event
    define: box
    as: event
    style:
      fill: none
      stroke: none
  - name: define box:duration
    define: box
    as: duration
    style:
      fill: lightgrey
      stroke: grey
      stroke_width: 0.5
  - name: define box:milestone
    define: box
    as: milestone
    style:
      fill: none
      stroke: none
  - name: define box:vline
    define: box
    as: vline
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
  - name: define box:swimlane_heading
    define: box
    as: swimlane_heading
    style:
      fill: '#fafafa'
      stroke: lightgrey
      stroke_width: 0.5
  - name: define box:swimlane_content
    define: box
    as: swimlane_content
    style:
      fill: none
      stroke: none
  - name: define box:band
    define: box
    as: band
    style:
      fill: none
      stroke: lightgrey
      stroke_width: 0.5
  - name: define box:band_heading
    define: box
    as: band_heading
    style:
      fill: none
      stroke: none
  - name: define line:grid
    define: line
    as: grid
    style:
      color: lightgrey
      width: 0.5
      opacity: 1.0
  - name: define line:axis
    define: line
    as: axis
    style:
      color: grey
      width: 1.0
      opacity: 1.0
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.0
      opacity: 1.0
  - name: define line:separator
    define: line
    as: separator
    style:
      color: lightgrey
      width: 0.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: lightgrey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: black
      size: 8
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: black
      size: 8
  - name: define icon:milestone
    define: icon
    as: milestone
    style:
      icon: diamond
      color: black
      size: 10
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: grey
      size: 8
  - name: route everything to Other
    apply_to: lane
    select: {}
    style:
      swimlane: Other
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-connector:
    use: line:connector
