theme:
  name: TJX
  version: '2.0'
  description: TJX colors and style — unified theme model
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
  font_family: PlaywriteDEGrund-VariableFont_wght
  default_missing_icon: applet-closed
header:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
footer:
  font_family: PlaywriteDEGrund-VariableFont_wght
  font_color: grey
events:
  icon_color: blue
  item_placement_order:
    - priority
watermark:
  text: null
  font_family: PlaywriteDEGrund-VariableFont_wght
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
continuation:
  show: true
  icon_before: move-left
  icon_after: move-right
  icon_height: 14.0
  icon_color: white
overflow:
  icon: warningtriangle
details:
  # Run details: every visualization writes a folder under output/ holding
  # the chart, this details document, one icon file per icon it drew, and
  # an event CSV.  Column lists use the gantt.columns schema (field, header,
  # align, max_lines, render, icon, format, date_format, indent; width is
  # accepted and ignored).
  markdown:
    enable: true
    title_text: Calendar Details
    sections: [events, colors, symbols, exceptions, holidays]
    events_section_text: Events
    colors_section_text: Color Key
    symbols_section_text: Icons & Symbols
    exceptions_section_text: Exceptions
    holidays_section_text: Holidays & Special Days
    empty_exceptions_text: Every item was drawn as scheduled.
    empty_cell_text: ''
    icon_mode: file        # file | name | none
    color_mode: swatch     # swatch | hex | name
    group_by: none         # none, or a field: category, lane, resource_group ...
    sort: [start_date, end_date, name]
    columns:
      - { field: source_id,        header: ID,        align: right }
      - { field: marker,           header: Key,       align: center }
      - { field: name,             header: Task Name, indent: true }
      - { field: category,         header: Type }
      - { field: status,           header: Status }
      - { field: priority,         header: Pri,       align: right }
      - { field: wbs,              header: WBS }
      - { field: percent_complete, header: '%',       align: right, format: '{:.0%}' }
      - { field: start_date,       header: Start,     date_format: YYYY-MM-DD }
      - { field: end_date,         header: Finish,    date_format: YYYY-MM-DD }
      - { field: resource_names,   header: Resources }
      - { field: resource_group,   header: Group }
      - { field: assigned_color,   header: Color }
      - { field: notes,            header: Notes,     max_lines: 3 }
      - { field: drawn,            header: Drawn }
    exception_columns:
      - { field: issue,  header: Issue }
      - { field: task,   header: Task }
      - { field: date,   header: Date, date_format: YYYY-MM-DD }
      - { field: ref,    header: Ref }
      - { field: detail, header: Detail }
    holiday_columns:
      - { field: icons,      header: Icon, align: center }
      - { field: date,       header: Date }
      - { field: name,       header: Name }
      - { field: kind,       header: Kind }
      - { field: nonworkday, header: Non-work }
      - { field: notes,      header: Notes }
  icons:
    enable: true
    size: 16               # every icon file is size x size
  csv:
    enable: true
    columns: exportdata    # exportdata (re-importable), or a column list
    render_columns: true   # append assigned color, icons, lane, drawn ...
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: 1
colors:
  month_palette: blues
  fiscal_palette: colorblind1
  group_palette: coraltealblue
  hash_lines: black
  federal_holiday:
    opacity: 0.1
    color: tomato
  company_holiday:
    opacity: 0.25
    color: gold
  resource_groups:
    a: black
    b: yellow
    c: red
    d: grey
weekly:
  week_numbers:
    label_format: W{num:02d}
  day_box:
    stroke_color: black
    stroke_opacity: 0.5
    stroke_width: 1
    stroke_dasharray: null
    hash_pattern_opacity: 0.1
  name_text:
    font_size: 18
  notes_text:
    font_size: 14
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squares
  cell_font: JuliaMono-Regular
  cell_bold_font: Caveat-Bold
  cell_font_size: 48
  title_font_size: 18
  title_format: MMMM YYYY
  header_font_size: 12
  day_number_glyphs: null
  day_number_digits: null
  day_color: black
  adjacent_month_color: lightgrey
  show_adjacent: false
  holiday_color: red
  nonworkday_fill_color: blood
  milestone_color: navy
  circle_milestones: false
  milestone_stroke_color: navy
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: black
  week_number_font_size: 12
  week_number_label_format: W{num}
  grid_lines: true
  grid_line_color: grey
  grid_line_width: 0.4
  grid_line_opacity: 0.7
  grid_line_dasharray: 1,2
  month_outline_color: navy
  month_outline_width: 0.75
  month_outline_opacity: 0.6
  month_outline_dasharray: null
  # event / holiday / special-day icons in a day cell's corners, drawn
  # alongside the day number rather than in place of it: up to four, filled
  # top-right first and then clockwise
  event_icon_scale: 0.25      # fraction of the cell's shorter side
  event_icon_opacity: 0.6     # keeps the day number legible underneath
mini_details:
  title_text: Event Details
  title_font_size: null
  name_text:
    font_color: black
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
  output_suffix: _details
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: [⯍, ⯏, 🟈, 🟃, 🟎, 🟉, ⯌, 🟒, 🟋, 🞻, 🞯, 🟂, 🟐, 🞿, 🞭, 🞹, ⭐, 🃟, ⊛, ⋇, ⊗, ⨳, ⧾, ⟡, ⟐, ❖, ◊, ⯪, ⯫, ꥟, 𜱃, 𜱪, 𜱩, 𜸂, "\U0001cecf", 🟙, 🝴, "\U0001fa54", 🮻, 🯀, 🮽, "\ue60e", "\ue615", "\ue835", "\uf2dc", "\U000f0633", ⟠, ⨷, ✢, ✨, ❂]
  milestone_symbols: [🄰, 🄱, 🄲, 🄳, 🄴, 🄵, 🄶, 🄷, 🄸, 🄹, 🄺, 🄻, 🄼, 🄽, 🄾, 🄿, 🅀, 🅁, 🅂, 🅃, 🅄, 🅅, 🅆, 🅇, 🅈, 🅉]
  holiday_symbols: [🅰, 🅱, 🅲, 🅳, 🅴, 🅵, 🅶, 🅷, 🅸, 🅹, 🅺, 🅻, 🅼, 🅽, 🅾, 🅿, 🆀, 🆁, 🆂, 🆃, 🆄, 🆅, 🆆, 🆇, 🆈, 🆉]
  nonworkday_symbols: [𝒂, 𝒃, 𝒄, 𝒅, 𝒆, 𝒇, 𝒈, 𝒉, 𝒊, 𝒋, 𝒌, 𝒍, 𝒎, 𝒏, 𝒐, 𝒑, 𝒒, 𝒓, 𝒔, 𝒕, 𝒖, 𝒗, 𝒘, 𝒙, 𝒚, 𝒛]
  duration_symbols: null
  duration_fill: null
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    # straight perpendicular run at the axis dot
    start_stub: 4.0
    # and at the box
    end_stub: 4.0
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
  axis_width: 3
  tick_color: grey
  date_format: M/D
  tick_label_format: M/D
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: grey
  marker_stroke_color: ''
  marker_stroke_width: 1.0
  marker_radius: 4.0
  icon_size: 14
  duration_offset_y: 20.0
  duration_lane_gap_y: 20.0
  duration_icon_visible: true
  label_fill_opacity: 0.25
  connector_stroke_dasharray: 4 2
  top_colors:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - lightskyblue
    - ivory
    - lightgoldenrod
    - lightsalmon
    - lime
    - mistyrose
  bottom_colors:
    - midnightblue
    - springgreen
    - deepskyblue
    - gold
    - orchid
    - orange
    - mediumblue
    - orangered
    - firebrick
    - fuchsia
  name_text:
    font_name: PlaywriteDEGrund-VariableFont_wght
    font_color: white
    font_size: 18
  notes_text:
    font_name: PlaywriteDEGrund-VariableFont_wght
    font_color: grey
    font_size: 14
  date:
    font_family: PlaywriteDEGrund-VariableFont_wght
  ticks:
    - unit: month
      label_format: MMM D
      show_labels: true
      label_color: black
      label_font_size: 11
      tick_width: 0.5
      tick_opacity: 0.5
      tick_length: 8.0
      label_gap: 18.0
    - unit: Date
      show_labels: true
      label_format: D
      label_color: black
      label_font_size: 6
      tick_width: 0.5
      tick_opacity: 0.5
      tick_length: 4.0
      include_endpoints: false
      max_label_count: 400
      label_gap: 10.0
    - unit: Date
      show_labels: true
      label_format: dd
      label_color: black
      label_font_size: 6
      tick_width: 0.5
      tick_opacity: 0.5
      tick_length: 2.0
      include_endpoints: false
      max_label_count: 400
      label_gap: 4.0
timeline_events:
  box_width: 255
  box_height: 24
  # how point-event boxes are placed: "packed" puts each box's leading
  # edge on its own start date and stacks collisions away from the axis;
  # "labella" keeps the force-solved placement centred on the date
  placement: packed
  # clear space between two rows of boxes; null follows timeline.labella.layer_gap
  row_gap: null
  # clear space between two boxes sharing a row
  box_gap: 2.0
  # inner border kept clear on all four sides of a box
  inner_pad: 2.0
  # share of a box's inner width given to the icon / date column
  icon_column_ratio: 0.15
timeline_durations:
  box_height: 50
  date_font: PlaywriteDEGrund-VariableFont_wght
  date_font_size: 10
  date_color: black
compact_plan:
  palette: null
  header_bottom_y: 8
  band_row_height: 10.0
  federal_holiday_fill_color: tomato
  federal_holiday_fill_opacity: 1.0
  company_holiday_fill_color: gold
  company_holiday_fill_opacity: 1.0
  weekend_fill_color: '#E8E8E8'
  weekend_fill_opacity: 1.0
  federal_holiday_icon: us
  text:
    font_name: RobotoCondensed-Light
  axis_padding: 5.0
  axis_width: 1.0
  show_axis: false
  duration_line_width: 9.0
  lane_spacing: 9.0
  show_duration_icons: true
  duration_icon_list: darksquare
  duration_icon_height: 8.0
  palette_name: null
  milestone_flag_height: 9.0
  milestone_flag_width: 7.0
  milestone_icon: null
  show_milestone_labels: false
  name_text:
    font_name: RobotoCondensed-Light
  show_legend: true
  legend_swatch_width: 10.0
  continuation_legend_text: activity continues
  bands:
    - band: month_2
      row_height: 25
    - date_range
    - dow_2
blockplan:
  grid_color: black
  grid_opacity: 1.0
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_fill_opacity: 1.0
  timeband_line_color: black
  timeband_line_width: 0.75
  timeband_line_opacity: 1.0
  timeband_line_dasharray: null
  label_column_ratio: 0.05
  fiscal_year_start_month: 2
  week_start: 0
  duration_date_font_size: 8
  federal_holiday_icon: us
  federal_holiday_fill_color: tomato
  federal_holiday_fill_opacity: 1.0
  show_unmatched_lane: false
  unmatched_lane_name: Other
  lane_match_mode: first
  header_font_size: 11
  header_label_color: Green
  header_label_opacity: 1.0
  header_label_align_h: right
  band_font_size: 14
  company_holiday_fill_color: gold
  weekend_fill_color: '#E8E8E8'
  lane_label_font_size: 14
  lane_label_align_h: center
  lane_label_align_v: middle
  lane_label_rotation: -90
  lane_split_ratio: 0.0
  swimlanes:
    - name: 'Xstore

        Conversions'
    - name: 'Triversity

        POSReady7'
    - name: 15.0.2
    - name: IC Fix
    - name: Post PI6
  duration_date_font: PlaywriteDEGrund-VariableFont_wght
  duration_fill_opacity: 1.0
  duration_stroke_color: white
  duration_stroke_width: 1.0
  duration_stroke_opacity: 1.0
  duration_stroke_dasharray: null
  duration_bar_height: 40
  duration_icon_visible: true
  notes_text:
    font_name: PlaywriteDEGrund-VariableFont_wght
    font_color: grey
  duration_show_start_date: true
  duration_show_end_date: true
  duration_date_format: M/D
  duration_date_color: Black
  event_show_date: false
  event_date_font_size: null
  event_date_format: MM/DD
  marker_radius: 2.0
  top_bands:
    - band: fiscal_quarter
      row_height: 14
    - band: month
      row_height: 14
    - band: date
      row_height: 14
    - band: dow
      row_height: 14
  bottom_bands:
    - band: dow
      row_height: 14
    - band: date
      row_height: 14
    - band: month
      row_height: 14
excelblockplan:
  font_name: Calibri
  font_size: 9
  band_row_height: 18.0
gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  band_row_height: 10.0
  bar_height: 8.0
  indent_per_level: 8.0
  min_day_width: 4.0
  progress_color: black
  float_opacity_scale: 0.4
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  show_dependencies: true
  show_today_line: true
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: Q{q}-FY{fy2}
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMMM
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  dow:
    unit: date
    label: DoW
    date_format: dd
    show_every: 1
  month_2:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  dow_2:
    unit: date
    label: DoW
    date_format: ddd
    show_every: 1
layout:
  margin:
    bottom: 0
    left: 0
    right: 0
    top: 0
style_rules:
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    apply_to: line:duration_bar
    select:
      visualizer: timeline
    style:
      opacity: 0.75
  - name: define text:heading
    define: text
    as: heading
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 14
      color: grey
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: black
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label
    define: text
    as: label
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: grey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: Blue
  - name: define text:caption
    define: text
    as: caption
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: black
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: white
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 22
      color: navy
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: PlaywriteDEGrund-VariableFont_wght
      size: 12
      color: black
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: '#F8F8FF'
      fill_opacity: 0.25
      stroke: none
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:mini_grid
    define: line
    as: mini_grid
    style:
      color: grey
      width: 0.4
      opacity: 0.7
      dasharray: 1,2
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 3
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: grey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: yellow
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: warningtriangle
      color: red
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: grey
  - name: band fiscal_quarter — segment
    apply_to: box:band
    select:
      band: fiscal_quarter
    style:
      fill:
        - ghostwhite
        - silver
  - name: band fiscal_quarter — label
    apply_to: text:band_label
    select:
      band: fiscal_quarter
    style:
      color: Black
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill:
        - white smoke
        - darkgrey
  - name: band month — label
    apply_to: text:band_label
    select:
      band: month
    style:
      color: black
  - name: band date — segment
    apply_to: box:band
    select:
      band: date
    style:
      fill: white
  - name: band date — label
    apply_to: text:band_label
    select:
      band: date
    style:
      color: Black
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: white
  - name: band dow — label
    apply_to: text:band_label
    select:
      band: dow
    style:
      color: Black
  - name: band month_2 — segment
    apply_to: box:band
    select:
      band: month_2
    style:
      fill:
        - lightblue
        - grey
  - name: band month_2 — label
    apply_to: text:band_label
    select:
      band: month_2
    style:
      color: black
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band dow_2 — segment
    apply_to: box:band
    select:
      band: dow_2
    style:
      fill: pink
  - name: band dow_2 — label
    apply_to: text:band_label
    select:
      band: dow_2
    style:
      color: white
  - name: weekly_hash_0
    select:
      nonworkday: false
    apply_to: box:day
    style:
      pattern: stars74
      pattern_color: silver
      pattern_opacity: 0.01
  - name: fedholidays
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      fill: lightblue
      fill_opacity: 1.0
      pattern: app
      pattern_color: tomato
      pattern_opacity: 0.5
  - name: Marshalls durations (name)
    select:
      task_name:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Marshalls durations (notes)
    select:
      notes:
        - Marshalls
      event_type: duration
    apply_to: box:duration
    style:
      fill: red
  - name: Maxx durations
    select:
      task_name:
        - Maxx
      event_type: duration
    apply_to: box:duration
    style:
