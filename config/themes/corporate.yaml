theme:
  name: Corporate
  version: '2.0'
  description: Professional business calendar with blue-grey tones
base:
  font_family: RobotoCondensed-Regular
  default_missing_icon: null
header:
  font_family: Roboto-Bold
  left:
    font_color: midnightblue
  center:
    font_color: midnightblue
  right:
    font_family: Roboto-BoldItalic
    font_color: midnightblue
footer:
  font_family: RobotoCondensed-Light
  font_color: slategrey
  left:
    font_color: midnightblue
  center:
    font_color: midnightblue
  right:
    font_family: Roboto-BoldItalic
    font_color: midnightblue
events:
  icon_color: steelblue
  item_placement_order:
    - priority
durations:
  icon_color: steelblue
  stroke_dasharray: null
watermark:
  text: null
  color: lightsteelblue
  font_family: Roboto-Bold
  opacity: 0.15
  font_size: null
  resize_mode: fit
  rotation_angle: 0.0
  image_rotation_angle: 0.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Blues
  fiscal_palette: Blues
  group_palette: Blues
  hash_lines: lightsteelblue
  federal_holiday:
    color: royalblue
    alpha: 0.2
  company_holiday:
    color: mediumseagreen
    alpha: 0.2
  resource_groups:
    a: midnightblue
    b: steelblue
    c: cadetblue
    d: slategrey
weekly:
  day_names:
    font_family: RobotoCondensed-Bold
    font_color: midnightblue
  week_numbers:
    font_family: RobotoCondensed-Bold
    font_color: slategrey
    label_format: W{num:02d}
  day_box:
    stroke_color: lightsteelblue
    stroke_opacity: 0.4
    stroke_width: 3
    stroke_dasharray: null
    fill_color: aliceblue
    fill_opacity: 0.3
    number_font: Roboto-Bold
    number_color: midnightblue
    icon_color: steelblue
    font_color: darkslategrey
    hash_pattern_opacity: 0.2
  name_text:
    font_name: RobotoCondensed-Regular
    font_color: darkslategrey
  notes_text:
    font_name: RobotoCondensed-Italic
    font_color: slategrey
  overflow:
    icon: warningtriangle
    color: darkorange
mini_calendar:
  cell_font: JuliaMono-Regular
  cell_bold_font: Roboto-Bold
  cell_font_size: null
  title_font: Roboto-Bold
  title_font_size: null
  title_format: MMMM YYYY
  title_color: midnightblue
  header_font: JuliaMono-Regular
  header_font_size: null
  header_color: slategrey
  day_number_glyphs: null
  day_number_digits: null
  day_color: darkslategrey
  adjacent_month_color: lightsteelblue
  show_adjacent: true
  holiday_color: royalblue
  nonworkday_fill_color: aliceblue
  milestone_color: midnightblue
  circle_milestones: true
  milestone_stroke_color: midnightblue
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: lightskyblue
  week_number_font: JuliaMono-Regular
  week_number_font_size: null
  week_number_color: slategrey
  week_number_label_format: W{num}
  grid_line_color: lightgrey
  grid_line_width: 0.25
  grid_line_opacity: 0.5
  grid_line_dasharray: null
  cell_box_stroke_dasharray: null
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
  day_box: null
mini_details:
  title_text: Event Details
  title_font: RobotoCondensed-Bold
  title_font_size: null
  title_color: midnightblue
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_color: slategrey
  name_text:
    font_name: RobotoCondensed-Light
    font_color: darkslategrey
  notes_text:
    font_name: RobotoCondensed-Italic
    font_color: slategrey
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
timeline:
  background_color: midnightblue
  axis_color: aliceblue
  axis_opacity: 0.9
  axis_width: 2
  tick_color: lightsteelblue
  date_format: MMM D
  tick_label_format: MMM YY
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: lightsteelblue
  today_label_color: aliceblue
  marker_stroke_color: midnightblue
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 10.0
  callout_offset_y: 96.0
  duration_offset_y: 44.0
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.0
  duration_bar_fill_opacity: 0.25
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: null
  duration_bracket_stroke_dasharray: null
  top_colors:
    - lightskyblue
    - khaki
    - tomato
    - mediumturquoise
    - white
  bottom_colors:
    - cadetblue
    - mediumseagreen
    - lightskyblue
    - khaki
    - tomato
  name_text:
    font_name: Roboto-Bold
    font_color: aliceblue
  notes_text:
    font_name: RobotoCondensed-Bold
    font_color: lightsteelblue
  date:
    font_family: Roboto-Bold
    font_color: aliceblue
pit:
  direction: horizontal      # horizontal | vertical
  label_side: both           # primary | secondary | both
  labella:
    layer_gap: 8
    node_height: 24
    density: 0.75
  axis:
    color: lightsteelblue
    width: 1.5
    marker_size: 7.0          # bounding box of built-in circle/diamond
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 6.0
  tick_color: steelblue
  tick_unit: month
  # Two tick rows: fiscal quarters labeled above monthly ticks.
  ticks:
    - unit: fiscal_quarter
      label_side: below         # quarter labels beneath the axis
      tick_length: 9.0
      tick_color: steelblue
      label_color: steelblue
      label_gap: 16.0
    - unit: month
      label_format: MMM
      label_side: above         # month names above, clear of the quarter labels
      tick_length: 4.0
      tick_color: lightsteelblue
      tick_opacity: 0.6
      label_font_size: 7
      label_color: slategrey
  date_format: "MMM D"
  name_text:
    font_name: RobotoCondensed-Regular  # PIT callout event-name font
  notes_text:
    font_name: RobotoCondensed-Italic   # PIT callout notes font
  date_text:
    color: slategrey
    font_name: Roboto-Regular
    font_size: 9
    offset: 6.0
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: "#2c7bb6"
  milestone_color: midnightblue
  event_palette: Blues
  milestone_palette: Blues
  leader:
    color: steelblue
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: "#2c7bb6"
    marker_end_size: 6.0
  leader_secondary:
    color: cadetblue
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    show: true
    color: royalblue
    width: 1.0
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: royalblue
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: steelblue
  label:
    stroke_color: lightsteelblue
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: aliceblue
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.15
    text_color: midnightblue
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
    icon_size: null            # null = match event-name font size
    icon_gap: 4.0
  label_palette: Blues
compact_plan:
  palette:
    - steelblue
    - cadetblue
    - lightskyblue
    - lightsteelblue
    - cornflowerblue
    - mediumturquoise
  axis_color: lightsteelblue
  axis_dasharray: 2,6
  text:
    font_color: '#2c4770'
  milestone_color: '#2c4770'
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: grey
  grid_opacity: 0.6
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.16
  band_row_height: 10.0
  fiscal_year_start_month: 10
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Unmatched
  lane_match_mode: first
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_label_color: black
  header_label_opacity: 1.0
  header_label_align_h: left
  header_heading_fill_color: none
  band_font: RobotoCondensed-Bold
  band_font_size: null
  timeband_label_color: black
  timeband_label_opacity: 1.0
  timeband_fill_color: none
  timeband_fill_palette: []
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: RobotoCondensed-Bold
  lane_label_font_size: null
  lane_label_color: black
  lane_label_align_h: left
  lane_label_align_v: middle
  lane_label_rotation: 0
  event_show_date: false
  event_date_font: RobotoCondensed-Light
  event_date_font_size: null
  event_date_color: grey
  event_date_format: YYYY-MM-DD
  marker_radius: 2.0
  vertical_line_color: steelblue
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.5
  duration_stroke_opacity: 0.9
  duration_stroke_dasharray: null
  duration_bar_height: 8.0
  name_text:
    font_name: RobotoCondensed-Light
    font_color: midnightblue
  palette:
    - lightskyblue
    - khaki
    - tomato
    - mediumturquoise
    - white
    - cadetblue
  swimlanes:
    - name: Engineering
    - name: Operations
    - name: Quality
  top_bands:
    - fiscal_quarter
    - pi
    - sprint
    - month
    - week_number
    - date
    - dow
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: FY{fy} Q{q}
    show_every: 1
  pi:
    unit: interval
    label: PI
    interval_days: 70
    prefix: 'PI '
    start_index: 1
    show_every: 1
  sprint:
    unit: interval
    label: Sprint
    interval_days: 14
    prefix: 'Sprint '
    start_index: 1
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  week_number:
    unit: week
    label: Week Number
    label_format: Week {week}
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  dow:
    unit: dow
    label: DoW
    date_format: ddd
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Bold
      size: 12
      color: midnightblue
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Regular
      size: 8
      color: darkslategrey
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-Italic
      size: 7
      color: slategrey
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      size: 7
      color: slategrey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: RobotoCondensed-Bold
      size: 7
      color: slategrey
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 6
      color: slategrey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Bold
      size: 10
      color: midnightblue
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: RobotoCondensed-Bold
      size: 8
      color: midnightblue
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: aliceblue
      fill_opacity: 0.3
      stroke: lightsteelblue
      stroke_width: 3
      stroke_opacity: 0.4
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: Blues
      fill_colors:
        - lightskyblue
        - khaki
        - tomato
        - mediumturquoise
        - white
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: '#e8f0fe'
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: aliceblue
      fill_opacity: 0.25
      stroke: lightsteelblue
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: lightsteelblue
      width: 0.5
      opacity: 0.4
  - name: define line:axis
    define: line
    as: axis
    style:
      color: aliceblue
      width: 2
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: lightsteelblue
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: lightsteelblue
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: lightsteelblue
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: steelblue
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: steelblue
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: darkorange
  - name: define line:tick
    define: line
    as: tick
    style:
      color: lightsteelblue
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: aliceblue
  - name: band fiscal_quarter — segment
    apply_to: box:band
    select:
      band: fiscal_quarter
    style:
      fill: none
  - name: band pi — segment
    apply_to: box:band
    select:
      band: pi
    style:
      fill: none
  - name: band sprint — segment
    apply_to: box:band
    select:
      band: sprint
    style:
      fill: none
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill: none
  - name: band week_number — segment
    apply_to: box:band
    select:
      band: week_number
    style:
      fill: none
  - name: band date — segment
    apply_to: box:band
    select:
      band: date
    style:
      fill: none
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: none
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: weekly_hash_0
    select:
      milestone: true
    apply_to: box:day
    style:
      pattern: bricks
      pattern_color: steelblue
      pattern_opacity: 0.25
  - name: weekly_hash_1
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      pattern: bricks
      pattern_color: royalblue
      pattern_opacity: 0.2
  - name: weekly_hash_2
    select:
      nonworkday: true
    apply_to: box:day
    style:
      pattern: bricks
      pattern_color: lightsteelblue
      pattern_opacity: 0.12
  - name: weekly_hash_3
    select:
      task_name:
        - Sprint 10
      event_type: duration
    apply_to: box:day
    style:
      pattern: circuit-board
      pattern_color: steelblue
      pattern_opacity: 0.15
  - name: weekly_hash_4
    select:
      percent_complete:
        min: 100
    apply_to: box:day
    style:
      pattern: bricks
      pattern_color: mediumseagreen
      pattern_opacity: 0.15
  - name: weekly_hash_5
    select:
      notes:
        - blocker
        - risk
    apply_to: box:day
    style:
      pattern: bricks
      pattern_color: coral
      pattern_opacity: 0.18
  - name: weekly_hash_6
    select:
      wbs: '1.'
    apply_to: box:day
    style:
      pattern: circuit-board
      pattern_color: cadetblue
      pattern_opacity: 0.12
  - name: weekly_hash_7
    select:
      resource_names:
        - Alice
    apply_to: box:day
    style:
      pattern: circuit-board
      pattern_color: slategrey
      pattern_opacity: 0.12
  - name: weekly_hash_8
    select:
      resource_group:
        - dev
        - ops
    apply_to: box:day
    style:
      pattern: circuit-board
      pattern_color: royalblue
      pattern_opacity: 0.12
  - name: blockplan_vline_0
    apply_to: box:vline
    select:
      band: Sprint
      repeat: true
    style:
      align: end
      fill:
        - '#e8f0fe'
        - none
  - name: Route Engineering
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
    style:
      swimlane: Engineering
  - name: Route Operations
    apply_to: lane
    select:
      resource_group:
        - operations
        - ops
    style:
      swimlane: Operations
  - name: Route Quality
    apply_to: lane
    select:
      resource_group:
        - quality
        - qa
    style:
      swimlane: Quality
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-tick-label:
    use: text:caption
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: aliceblue
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
  ec-connector:
    use: line:connector
  ec-duration-marker:
    use: line:axis
  ec-legend-swatch:
    use: line:axis
