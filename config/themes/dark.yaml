# dark: every value not listed here comes from 'corporate'.
# See USER_GUIDE.md, "Theme inheritance".  Rewritten by tools/derive_theme.py.
extends: corporate
unset: [candybar.month_shade_colors]
theme:
  name: Dark
  description: Dark background theme for reduced eye strain
base: {font_family: RobotoCondensed-Light}
events: {icon_color: lightskyblue}
watermark: {font_family: RobotoCondensed-Light}
colors:
  month_palette: Greys
  fiscal_palette: Greys
  group_palette: Dark2
  hash_lines: grey
  federal_holiday: {color: indianred, opacity: 0.3}
  company_holiday: {color: darkseagreen, opacity: 0.3}
weekly:
  day_box: {hash_pattern_opacity: 0.15}
mini_calendar:
  adjacent_month_color: dimgrey
  holiday_color: indianred
  nonworkday_fill_color: slategrey
  milestone_color: lightskyblue
  milestone_stroke_color: lightskyblue
  current_day_color: teal
candybar:
  grid_line_color: dimgrey
  weekend_fill: null
  month_shading: false
  month: {color: lightgrey}
  month_box: {fill: null, stroke: dimgrey}
timeline:
  today_line_color: grey
  marker_stroke_color: black
  top_colors: [deepskyblue, gold, tomato, springgreen, lightskyblue]
  bottom_colors: [midnightblue, springgreen, deepskyblue, gold, tomato]
pit:
  axis: {color: '#666666'}
  tick_color: '#888888'
  ticks:
    - unit: month
      label_format: MMM
      label_side: below
      tick_length: 8.0
      tick_color: '#aaaaaa'
      label_color: '#aaaaaa'
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above
      label_color: '#888888'
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: '#666666'
      tick_opacity: 0.5
  name_text: {font_name: RobotoCondensed-Light}
  notes_text: {font_name: RobotoCondensed-LightItalic}
  date_text: {color: '#aaaaaa'}
  dot_color: lightskyblue
  milestone_color: lightgrey
  leader: {color: '#999999'}
  leader_primary: {color: lightskyblue}
  leader_secondary: {color: lightsteelblue}
  today_line: {color: '#cc4444', label_color: '#cc4444'}
  arrow_head: {color: '#888888'}
  label:
    stroke_color: '#555555'
    fill_color: '#2a2a2a'
    text_color: '#cccccc'
  label_palette: Dark2
compact_plan:
  palette:
    - deepskyblue
    - gold
    - tomato
    - mediumpurple
    - springgreen
    - coral
blockplan:
  palette:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - mediumpurple
    - slategray
gantt: {progress_color: whitesmoke}
style_rules:
  - name: box:duration — blockplan (from blockplan)
    style: {stroke_opacity: 0.85, stroke_width: 1.0}
  - name: resource group a
    style: {fill: whitesmoke}
  - name: resource group b
    style: {fill: lightskyblue}
  - name: resource group c
    style: {fill: coral}
  - name: resource group d
    style: {fill: darkgrey}
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    style: {opacity: 0.35}
  - name: define text:heading
    style: {color: whitesmoke}
  - name: define text:body
    style: {font: RobotoCondensed-Light, color: lightcyan}
  - name: define text:body_secondary
    style: {font: RobotoCondensed-LightItalic, color: darkgrey}
  - name: define text:label
    style: {font: RobotoCondensed-LightItalic, color: darkgrey}
  - name: define text:label_bold
    style: {color: darkgrey}
  - name: define text:caption
    style: {color: darkgrey}
  - name: define text:day_number
    style: {font: RobotoCondensed-Light, color: whitesmoke}
  - name: define text:month_title
    style: {color: whitesmoke}
  - name: define box:default
    style: {fill: black}
  - name: define box:cell
    style:
      fill: dimgrey
      fill_opacity: 0.35
      stroke: dimgrey
      stroke_width: 1
      stroke_opacity: 0.5
  - name: define box:timeband
    style:
      fill_palette: accent
      fill_colors: [deepskyblue, gold, tomato, springgreen, lightskyblue]
  - name: define box:highlight
    style: {fill: lightskyblue, fill_opacity: 0.15}
  - name: define box:callout
    style: {fill: black, stroke: dimgrey}
  - name: define line:grid
    style: {color: dimgrey, opacity: 0.5}
  - name: define line:axis
    style: {color: whitesmoke}
  - name: define line:separator
    style: {color: dimgrey}
  - name: define line:today
    style: {color: grey}
  - name: define line:connector
    style: {color: dimgrey}
  - name: define icon:event
    style: {color: lightskyblue}
  - name: define icon:duration
    style: {color: lightskyblue}
  - name: define icon:overflow
    style: {color: orangered}
  - name: define line:tick
    style: {color: dimgrey}
  - name: today label color
    style: {color: grey}
  - name: box:band — blockplan (from blockplan)
    style: {stroke_opacity: 0.7}
  - name: weekly_hash_0
    style: {pattern: wiggle, pattern_color: gold, pattern_opacity: 0.18}
  - name: weekly_hash_1
    style:
      pattern: wiggle
      pattern_color: indianred
      pattern_opacity: 0.15
  - name: weekly_hash_2
    style:
      pattern: wiggle
      pattern_color: dimgrey
      pattern_opacity: 0.1
  - name: weekly_hash_3
    select:
      task_name: [Release, Cutover]
      event_type: event
    style: {pattern: wiggle, pattern_color: coral, pattern_opacity: 0.12}
  - name: weekly_hash_4
    select:
      task_name: [Sprint, Freeze]
      event_type: duration
    style:
      pattern: wiggle
      pattern_color: lightskyblue
      pattern_opacity: 0.1
  - name: weekly_hash_5
    select:
      percent_complete: {min: 100}
    style:
      pattern: wiggle
      pattern_color: mediumseagreen
      pattern_opacity: 0.15
  - name: weekly_hash_6
    select:
      notes: [urgent, blocker]
    style:
      pattern: wiggle
      pattern_color: orangered
      pattern_opacity: 0.14
  - name: weekly_hash_7
    select: {wbs: '1.'}
    style:
      pattern: wiggle
      pattern_color: cadetblue
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names: [Alice]
    style: {pattern: wiggle, pattern_color: plum, pattern_opacity: 0.1}
  - name: weekly_hash_9
    select:
      resource_group: [dev]
    apply_to: box:day
    style: {pattern: wiggle, pattern_color: teal, pattern_opacity: 0.12}
  - name: blockplan_vline_0
    style:
      fill: ['#1a2a3a', '#0d1a28']
element_overrides:
  ec-today-label: {color: grey}
