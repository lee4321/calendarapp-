  holiday_color: indianred
  nonworkday_fill_color: slategrey
  milestone_color: lightskyblue
  circle_milestones: true
  milestone_stroke_color: lightskyblue
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: teal
  week_number_font: JuliaMono-Regular
  week_number_font_size: null
  week_number_color: darkgrey
  week_number_label_format: W{num}
  grid_line_color: lightgrey
  grid_line_width: 0.25
  grid_line_opacity: 0.5
  grid_line_dasharray: null
  cell_box_stroke_dasharray: null
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
  day_box: null
mini_details:
  title_text: Event Details
  title_font: RobotoCondensed-Bold
  title_font_size: null
  title_color: whitesmoke
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_color: darkgrey
  name_text:
    font_name: RobotoCondensed-Light
    font_color: silver
  notes_text:
    font_name: RobotoCondensed-LightItalic
    font_color: darkgrey
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
timeline:
  background_color: black
  axis_color: whitesmoke
  axis_opacity: 0.9
  axis_width: 2
  tick_color: dimgrey
  date_format: MMM D
  tick_label_format: MMM YY
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: grey
  today_label_color: grey
  marker_stroke_color: black
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 10.0
  callout_offset_y: 96.0
  duration_offset_y: 44.0
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.0
  duration_bar_fill_opacity: 0.35
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: null
  duration_bracket_stroke_dasharray: null
  top_colors:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - lightskyblue
  bottom_colors:
    - midnightblue
    - springgreen
    - deepskyblue
    - gold
    - tomato
  name_text:
    font_name: Roboto-Bold
    font_color: lightskyblue
  notes_text:
    font_name: RobotoCondensed-Bold
    font_color: lightskyblue
  date:
    font_family: Roboto-Bold
    font_color: lightskyblue
pit:
  axis:
    color: "#666666"
    width: 1.5
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 6.0
  tick_color: "#888888"
  tick_unit: month
  date_format: "MMM D"
  date_text:
    color: "#aaaaaa"
    font_name: Roboto-Regular
    font_size: 9
    offset: 6.0
  default_event_icon: null
  default_milestone_icon: null
  dot_color: lightskyblue
  milestone_color: lightgrey
  event_palette: Dark2
  milestone_palette: Greys
  leader:
    color: "#999999"
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: lightskyblue
    marker_end_size: 6.0
  leader_secondary:
    color: lightsteelblue
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    color: "#cc4444"
    width: 1.0
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: "#cc4444"
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: "#888888"
  label:
    stroke_color: "#555555"
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: "#2a2a2a"
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.12
    text_color: "#cccccc"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
  label_palette: Dark2
compact_plan:
  palette:
    - deepskyblue
    - gold
    - tomato
    - mediumpurple
    - springgreen
    - coral
  axis_color: slategrey
  axis_dasharray: 2,5
  text:
    font_color: whitesmoke
  milestone_color: whitesmoke
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: lightslategray
  grid_opacity: 0.7
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.16
  band_row_height: 10.0
  fiscal_year_start_month: 10
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Unmatched
  lane_match_mode: first
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_label_color: whitesmoke
  header_label_opacity: 1.0
  header_label_align_h: left
  header_heading_fill_color: none
  band_font: RobotoCondensed-Bold
  band_font_size: null
  timeband_label_color: lightskyblue
  timeband_label_opacity: 1.0
  timeband_fill_color: none
  timeband_fill_palette: []
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: RobotoCondensed-Bold
  lane_label_font_size: null
  lane_label_color: whitesmoke
  lane_label_align_h: left
  lane_label_align_v: middle
  lane_label_rotation: 0
  event_show_date: false
  event_date_font: RobotoCondensed-Light
  event_date_font_size: null
  event_date_color: grey
  event_date_format: YYYY-MM-DD
  marker_radius: 2.0
  vertical_line_color: orangered
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.0
  duration_stroke_opacity: 0.85
  duration_stroke_dasharray: null
  duration_bar_height: 8.0
  name_text:
    font_name: RobotoCondensed-Light
    font_color: lightskyblue
  palette:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - mediumpurple
    - slategray
  swimlanes:
    - name: Engineering
    - name: Operations
    - name: Quality
  top_bands:
    - fiscal_quarter
    - pi
    - sprint
    - month
    - week_number
    - date
    - dow
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: FY{fy} Q{q}
    show_every: 1
  pi:
    unit: interval
    label: PI
    interval_days: 70
    prefix: 'PI '
    start_index: 1
    show_every: 1
  sprint:
    unit: interval
    label: Sprint
    interval_days: 14
    prefix: 'Sprint '
    start_index: 1
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  week_number:
    unit: week
    label: Week Number
    label_format: Week {week}
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  dow:
    unit: dow
    label: DoW
    date_format: ddd
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
style_rules:
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Bold
      size: 12
      color: whitesmoke
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 12
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Light
      size: 8
      color: lightcyan
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-LightItalic
      size: 7
      color: darkgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-LightItalic
      size: 7
      color: darkgrey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: RobotoCondensed-Bold
      size: 7
      color: darkgrey
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 6
      color: darkgrey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: RobotoCondensed-Light
      size: 10
      color: whitesmoke
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: RobotoCondensed-Bold
      size: 8
      color: whitesmoke
  - name: define box:default
    define: box
    as: default
    style:
      fill: black
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: dimgrey
      fill_opacity: 0.35
      stroke: dimgrey
      stroke_width: 1
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: accent
      fill_colors:
        - deepskyblue
        - gold
        - tomato
        - springgreen
        - lightskyblue
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightskyblue
      fill_opacity: 0.15
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: black
      fill_opacity: 0.25
      stroke: dimgrey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: dimgrey
      width: 0.5
      opacity: 0.5
  - name: define line:axis
    define: line
    as: axis
    style:
      color: whitesmoke
      width: 2
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: dimgrey
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: dimgrey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: lightskyblue
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: lightskyblue
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: orangered
  - name: define line:tick
    define: line
    as: tick
    style:
      color: dimgrey
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: grey
  - name: band fiscal_quarter — segment
    apply_to: box:band
    select:
      band: fiscal_quarter
    style:
      fill: none
  - name: band pi — segment
    apply_to: box:band
    select:
      band: pi
    style:
      fill: none
  - name: band sprint — segment
    apply_to: box:band
    select:
      band: sprint
    style:
      fill: none
  - name: band month — segment
    apply_to: box:band
    select:
      band: month
    style:
      fill: none
  - name: band week_number — segment
    apply_to: box:band
    select:
      band: week_number
    style:
      fill: none
  - name: band date — segment
    apply_to: box:band
    select:
      band: date
    style:
      fill: none
  - name: band dow — segment
    apply_to: box:band
    select:
      band: dow
    style:
      fill: none
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: weekly_hash_0
    select:
      milestone: true
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: gold
      pattern_opacity: 0.18
  - name: weekly_hash_1
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: indianred
      pattern_opacity: 0.15
  - name: weekly_hash_2
    select:
      nonworkday: true
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: dimgrey
      pattern_opacity: 0.1
  - name: weekly_hash_3
    select:
      task_name:
        - Release
        - Cutover
      event_type: event
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: coral
      pattern_opacity: 0.12
  - name: weekly_hash_4
    select:
      task_name:
        - Sprint
        - Freeze
      event_type: duration
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: lightskyblue
      pattern_opacity: 0.1
  - name: weekly_hash_5
    select:
      percent_complete:
        min: 100
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: mediumseagreen
      pattern_opacity: 0.15
  - name: weekly_hash_6
    select:
      notes:
        - urgent
        - blocker
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: orangered
      pattern_opacity: 0.14
  - name: weekly_hash_7
    select:
      wbs: '1.'
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: cadetblue
      pattern_opacity: 0.1
  - name: weekly_hash_8
    select:
      resource_names:
        - Alice
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: plum
      pattern_opacity: 0.1
  - name: weekly_hash_9
    select:
      resource_group:
        - dev
    apply_to: box:day
    style:
      pattern: wiggle
      pattern_color: teal
      pattern_opacity: 0.12
  - name: blockplan_vline_0
    apply_to: box:vline
    select:
      band: Sprint
      repeat: true
    style:
      align: end
      fill:
        - '#1a2a3a'
        - '#0d1a28'
  - name: Route Engineering
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
    style:
      swimlane: Engineering
  - name: Route Operations
    apply_to: lane
    select:
      resource_group:
        - operations
        - ops
    style:
      swimlane: Operations
  - name: Route Quality
    apply_to: lane
    select:
      resource_group:
        - quality
        - qa
    style:
      swimlane: Quality
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-tick-label:
    use: text:caption
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: grey
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
  ec-connector:
    use: line:connector
  ec-duration-marker:
    use: line:axis
  ec-legend-swatch:
    use: line:axis
