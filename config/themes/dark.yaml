theme:
  name: Dark
  version: '2.0'
  description: Dark background theme for reduced eye strain
base:
  font_family: RobotoCondensed-Light
  default_missing_icon: null
header:
  font_family: Roboto-Bold
  font_color: whitesmoke
footer:
  font_family: RobotoCondensed-Light
  font_color: darkgrey
events:
  icon_color: lightskyblue
  item_placement_order:
    - priority
durations:
  icon_color: lightskyblue
  stroke_dasharray: null
watermark:
  text: null
  color: dimgrey
  font_family: RobotoCondensed-Light
  opacity: 0.15
  font_size: null
  resize_mode: fit
  rotation_angle: 0.0
  image_rotation_angle: 0.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Greys
  fiscal_palette: Greys
  group_palette: Dark2
  hash_lines: grey
  federal_holiday:
    color: indianred
    alpha: 0.3
  company_holiday:
    color: darkseagreen
    alpha: 0.3
  resource_groups:
    a: whitesmoke
    b: lightskyblue
    c: coral
    d: darkgrey
weekly:
  day_names:
    font_family: RobotoCondensed-Bold
    font_color: whitesmoke
  week_numbers:
    font_family: RobotoCondensed-Bold
    font_color: darkgrey
    label_format: W{num:02d}
  day_box:
    stroke_color: dimgrey
    stroke_opacity: 0.5
    stroke_width: 1
    stroke_dasharray: null
    fill_color: dimgrey
    fill_opacity: 0.35
    number_font: RobotoCondensed-Light
    number_color: whitesmoke
    icon_color: coral
    font_color: lightyellow
    hash_pattern_opacity: 0.15
  name_text:
    font_name: RobotoCondensed-Light
    font_color: lightcyan
  notes_text:
    font_name: RobotoCondensed-LightItalic
    font_color: darkgrey
  overflow:
    icon: warningtriangle
