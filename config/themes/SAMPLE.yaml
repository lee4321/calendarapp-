theme:
  name: SAMPLE
  version: '3.0'
  description: Annotated reference theme for the unified style_rules schema.
base:
  font_family: FiraSans-Light
  default_missing_icon: applet-closed
  # Drawn size of that stand-in, in points. Omit (or null) to keep it the
  # size of whatever it replaces.
  default_missing_icon_size: null
layout:
  margin:
    top: 0.5in
    right: 0.5in
    bottom: 0.5in
    left: 0.5in
header:
  left:
    text: '{theme.name}'
  center:
    text: '{calendar.range}'
  right:
    text: '{today}'
footer:
  left:
    text: ''
  center:
    text: ''
  right:
    text: p. {page}
events:
  item_placement_order:
    - priority
durations:
  stroke_dasharray: null
watermark:
  text: ''
  rotation_angle: 45.0
  resize_mode: fit
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Pastel1
  fiscal_palette: Blues
  group_palette: Set2
  federal_holiday:
    opacity: 0.25
  company_holiday:
    opacity: 0.25
  resource_groups:
    engineering: steelblue
    design: mediumpurple
    qa: tomato
    ops: goldenrod
weekly:
  week_numbers:
    label_format: W{num:02d}
  overflow:
    icon: warningtriangle
mini_calendar:
  # Glyph set the mini-icon variant draws day numbers from:
  # squares | darksquare | circles | darkcircles | squircles |
  # darksquircles. --mini-icon-set overrides it.
  icon_set: squares
  title_format: MMMM YYYY
  week_number_label_format: W{num}
  icon_set: squares
  show_adjacent: true          # render leading/trailing adjacent-month days
  circle_milestones: true      # circle day numbers that carry a milestone
  # current_day_color: red     # highlight color for today's day number
mini_details:
  output_suffix: _details
  title_text: Event Details
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Days
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  duration_fill: ■
  event_symbols:
    - •
    - ○
    - ◐
  milestone_symbols:
    - ◆
    - ◇
  holiday_symbols:
    - ✕
  nonworkday_symbols:
    - ·
timeline:
  tick_label_format: M/D
  # Distance from the axis to the built-in month-tick date labels.
  # tick_label_gap is measured from the tick's tip so it moves with the
  # tick; tick_label_offset_y is the whole distance and wins. Both null =
  # 1.5 label heights past the tick. A `ticks:` band below sets its own.
  tick_label_gap: null
  tick_label_offset_y: null
  today_date: ''
  today_label_text: Today
  marker_radius: 4.2
  icon_size: 8
  duration_offset_y: 30.0
  duration_lane_gap_y: 8.0
  leader:
    # false threads each leader through every row it passes, labella's own
    # routing: one curve-and-line pair per row, all crossing the boxes
    # between. true draws one curve from the dot to the box.
    direct: true
    # Straight perpendicular segments at each end of a callout leader.
    # labella's bezier leaves the axis dot and meets the box at a shallow
    # angle; the stubs make both ends arrive square-on. 0 = pure bezier.
    # Mirrors pit.leader.end_stub.
    start_stub: 4.0
    end_stub: 4.0
timeline_events:
  box_width: 115
compact_plan:
  legend_area_ratio: 0.28
  bands:
    - date_range
    - week
blockplan:
  fiscal_year_start_month: 2
  week_start: 0
  label_column_ratio: 0.1
  band_row_height: 12.0
  lane_match_mode: first
  show_unmatched_lane: true
  unmatched_lane_name: Other
  swimlanes:
    - name: Engineering
    - name: Design
    - name: QA
      split_ratio: 0.0
    - name: Operations
    - name: Other
  top_bands:
    - fiscal_quarter
    - month
  bottom_bands: []
gantt:
  # ── Geometry ────────────────────────────────────────────────────────────
  table_width_ratio: 0.38   # task table's share of the content width
  row_height: 14.0          # fixed and uniform; cells truncate, never grow
  header_row_height: 18.0
  band_row_height: 10.0     # per-band default; a band may set its own
  indent_per_level: 8.0     # WBS depth × this, applied to indent: columns
  bar_height: 8.0
  min_day_width: 4.0        # split the range across pages below this; 0 = never
  sort:                     # WBS segments compare numerically: 1.9 before 1.10
    - wbs
    - start_date
  # ── Marks ───────────────────────────────────────────────────────────────
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check              # the task table's rollup column
  milestone_flag_icon: check      # the task table's milestone column
  snapped_event_icon: arrow-left-circle   # event moved off a hidden weekend
  offchart_dep_icon: crosssquare          # predecessor nowhere in the chart
  # Cross-page dependencies: one number per source event, drawn at the stub
  # and again in each unreachable successor's `link_ref` column.  Families
  # are consumed in order, giving 300 references before numbering degrades
  # to the unnumbered marker above.
  link_ref_icon_families: [circle-, darkcircle-, square-]
  link_ref_family_size: 100
  link_ref_max_icons: 2     # icons drawn in one reference cell
  continuation_icon: arrow-bar-right      # bar runs past the range
  progress_color: black
  progress_width: 1.5
  float_opacity_scale: 0.4  # earliest/latest bars, relative to the task bar
  show_dependencies: true
  # Arrows are curved leaders drawn like the PIT callout leaders; the head
  # is an SVG marker that orients itself along the curve.
  arrow_marker_end: arrow-head     # or `none` for a bare leader
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  show_today_line: true
  today_date: null          # YYYYMMDD to fix "today"; null = the wall clock
  show_details: true        # write the companion <output>_details.svg
  details_title_text: Gantt Details
  # ── Task table ──────────────────────────────────────────────────────────
  # Column keys: field, header, width (renormalized), align, max_lines,
  # truncate, render (text|icon), icon, format, date_format, indent.
  # `field` names the events table (name, start_date, …); dates accept any
  # Arrow format plus the `dd` two-letter weekday token.
  columns:
    - { field: link_ref,        header: Ref,       width: 0.03, render: icon, align: center }
    - { field: source_id,        header: ID,        width: 0.035, align: right }
    - { field: name,             header: Task Name, width: 0.215, max_lines: 2, indent: true }
    - { field: status,           header: Status,    width: 0.045 }
    - { field: priority,         header: Pri,       width: 0.025, align: right }
    - { field: wbs,              header: WBS,       width: 0.05 }
    - { field: rollup,           header: Roll,      width: 0.02, render: icon, align: center }
    - { field: milestone,        header: MS,        width: 0.02, render: icon, align: center }
    - { field: percent_complete, header: '%',       width: 0.035, align: right, format: '{:.0%}' }
    - { field: effort_text,      header: Effort,    width: 0.045, align: right }
    - { field: duration_text,    header: Duration,  width: 0.045, align: right }
    - { field: start_date,       header: Start,     width: 0.08, date_format: dd MM/DD/YY }
    - { field: end_date,         header: Finish,    width: 0.08, date_format: dd MM/DD/YY }
    - { field: resource_names,   header: Resources, width: 0.065, max_lines: 1 }
    - { field: resource_group,   header: Group,     width: 0.055 }
    - { field: notes,            header: Notes,     width: 0.075, max_lines: 2 }
    - { field: deadline,         header: Deadline,  width: 0.08, date_format: dd MM/DD/YY }
  # Timescale.  `top_bands` / `bottom_bands` reference entries in the
  # top-level `time_bands:` catalog, exactly as blockplan does; omit
  # `bottom_bands` and the bottom axis mirrors the top.
  top_bands:
    - { band: fiscal_quarter, row_height: 12 }
    - { band: month,          row_height: 12 }
    - { band: week,           row_height: 10 }
  bottom_bands:
    - { band: month, row_height: 10 }
  #
  # Either stack takes **any number** of bands, each with its own
  # `row_height` (or the `band_row_height` default above), e.g. fiscal
  # quarter over month over week over day-of-week.  Should the stacks and
  # the column-header row together want more than 75% of the content
  # height, every chrome row is scaled down proportionally — no band is
  # dropped, and the task body always keeps positive height.
excelheader:
  font_name: Calibri
  font_size: 9
  band_row_height: 18.0
  top_bands:
    - fiscal_quarter
    - month
  band_fonts:
    fiscal_quarter:
      excel_font_name: Calibri
      excel_font_size: 10
  vertical_lines: []
time_bands:
  # Shared catalog of band definitions.  Visualizers do not define bands
  # inline; they *reference* these by name from their own `top_bands` /
  # `bottom_bands` / `bands` lists, so one definition serves blockplan,
  # compactplan, excelheader and gantt alike.
  #
  # `unit` picks the segmentation: date | week | month | year | interval |
  # fiscal_quarter | fiscal_period | icon.  Label text comes from
  # `date_format` (an Arrow format, `dd` supported) or `label_format`
  # (a template over the segment's own fields).
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: 'Q{q}-FY{fy2}'
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMMM
    show_every: 1
  week:
    unit: week
    label: Week
    label_format: Week {n}
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
style_rules:
  # Per-visualizer token override example: timeline duration-bar fill opacity.
  # (Bars in other visualizers read the shared ec-duration-bar element style.)
  # - name: timeline duration-bar fill opacity
  #   apply_to: line:duration_bar
  #   select:
  #     visualizer: timeline
  #   style:
  #     opacity: 0.75
  - name: define text:base
    define: text
    as: base
    style:
      font: FiraSans-Light
      size: 9
      color: black
  - name: define text:heading
    define: text
    as: heading
    style:
      font: FiraSans-Bold
      size: 11
      color: black
  - name: define text:body
    define: text
    as: body
    style:
      font: FiraSans-Light
      size: 8
      color: black
  - name: define text:caption
    define: text
    as: caption
    style:
      font: FiraSans-Light
      size: 7
      color: dimgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Bold
      size: 11
      color: black
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 9
      color: black
  - name: define text:week_number
    define: text
    as: week_number
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:event_name
    define: text
    as: event_name
    style:
      font: FiraSans-Light
      size: 8
      color: navy
  - name: define text:event_notes
    define: text
    as: event_notes
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:event_date
    define: text
    as: event_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:duration_date
    define: text
    as: duration_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: define text:today_label
    define: text
    as: today_label
    style:
      font: FiraSans-Light
      size: 7
      color: tomato
  - name: define text:fiscal_label
    define: text
    as: fiscal_label
    style:
      font: FiraSans-Light
      size: 7
      color: navy
  - name: define text:swimlane_label
    define: text
    as: swimlane_label
    style:
      font: Roboto-Bold
      size: 8
      color: black
  - name: define text:band_label
    define: text
    as: band_label
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: define text:milestone_label
    define: text
    as: milestone_label
    style:
      font: Roboto-Bold
      size: 7
      color: navy
  - name: text:heading — small paper
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.85
      stroke: grey
      stroke_width: 0.5
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:day
    define: box
    as: day
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:event
    define: box
    as: event
    style:
      fill: none
      stroke: none
  - name: define box:duration
    define: box
    as: duration
    style:
      fill: steelblue
      fill_opacity: 0.35
      stroke: navy
      stroke_width: 0.5
  - name: define box:milestone
    define: box
    as: milestone
    style:
      fill: none
      stroke: none
  - name: define box:vline
    define: box
    as: vline
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
  - name: define box:swimlane_heading
    define: box
    as: swimlane_heading
    style:
      fill: '#f4f4f4'
      stroke: grey
      stroke_width: 0.5
  - name: define box:swimlane_content
    define: box
    as: swimlane_content
    style:
      fill: none
      stroke: none
  - name: define box:band
    define: box
    as: band
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:band_heading
    define: box
    as: band_heading
    style:
      fill: none
      stroke: none
  - name: define line:grid
    define: line
    as: grid
    style:
      color: '#cccccc'
      width: 0.5
      opacity: 1.0
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 1.0
      opacity: 1.0
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: tomato
      width: 1.5
      opacity: 1.0
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:connector
    define: line
    as: connector
    style:
      color: grey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: navy
      size: 8
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
      size: 8
  - name: define icon:milestone
    define: icon
    as: milestone
    style:
      icon: diamond
      color: gold
      size: 12
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: chevron-down
      color: grey
      size: 8
  - name: federal holidays — day box tint
    apply_to: box:day
    select:
      federal_holiday: true
    style:
      fill: tomato
      fill_opacity: 0.1
      pattern: diagonal-stripes
      pattern_color: tomato
      pattern_opacity: 0.12
  - name: company nonworkdays — day box tint
    apply_to: box:day
    select:
      company_holiday: true
    style:
      fill: gold
      fill_opacity: 0.1
  - name: sprint durations
    apply_to: box:duration
    select:
      task_name:
        - Sprint
      event_type: duration
    style:
      fill: steelblue
      fill_opacity: 0.5
      stroke: steelblue
      stroke_width: 1.0
  - name: priority 1 — box outline
    apply_to: box:event
    select:
      priority: 1
    style:
      stroke: crimson
      stroke_width: 1.5
  - name: priority 1 — event name
    apply_to: text:event_name
    select:
      priority: 1
    style:
      color: crimson
      weight: bold
  - name: completed items — visual fade
    apply_to:
      - box:event
      - box:duration
      - text:event_name
    select:
      percent_complete:
        min: 100
    style:
      fill: '#f4f4f4'
      color: grey
      italic: true
  - name: critical milestone — marker
    apply_to: icon:milestone
    select:
      priority_min: 1
    style:
      icon: flag
      color: red
      size: 14
  - name: critical milestone — label
    apply_to: text:milestone_label
    select:
      priority_min: 1
    style:
      color: red
      weight: bold
  - name: month band — segment fill
    apply_to: box:band
    select:
      band: month
    style:
      fill:
        - lightblue
        - lightyellow
  - name: month band — label
    apply_to: text:band_label
    select:
      band: month
    style:
      color: navy
  - name: month separator vertical line
    apply_to: box:vline
    select:
      band: month
      repeat: true
    style:
      align: end
      stroke: grey
      stroke_width: 1.0
      stroke_opacity: 0.33
      dasharray: 5,5
  - name: Engineering — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Engineering
    style:
      fill: '#dceaff'
  - name: Engineering — label
    apply_to: text:swimlane_label
    select:
      swimlane: Engineering
    style:
      color: navy
  - name: Design — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Design
    style:
      fill: '#e7defb'
  - name: Design — label
    apply_to: text:swimlane_label
    select:
      swimlane: Design
    style:
      color: indigo
  - name: QA — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: QA
    style:
      fill: '#ffe1de'
  - name: QA — label
    apply_to: text:swimlane_label
    select:
      swimlane: QA
    style:
      color: firebrick
  - name: Operations — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Operations
    style:
      fill: '#fff3d8'
  - name: Operations — label
    apply_to: text:swimlane_label
    select:
      swimlane: Operations
    style:
      color: darkgoldenrod
  - name: Other — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Other
    style:
      fill: '#f0f0f0'
  - name: Other — label
    apply_to: text:swimlane_label
    select:
      swimlane: Other
    style:
      color: dimgrey
  - name: route engineering tasks
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
        - eng
    style:
      swimlane: Engineering
  - name: route design tasks
    apply_to: lane
    select:
      resource_group:
        - design
        - ux
    style:
      swimlane: Design
  - name: route qa tasks
    apply_to: lane
    select:
      resource_group:
        - qa
        - test
    style:
      swimlane: QA
  - name: route ops tasks
    apply_to: lane
    select:
      resource_group:
        - ops
        - operations
        - sre
    style:
      swimlane: Operations
  - name: catch-all
    apply_to: lane
    select: {}
    style:
      swimlane: Other
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-connector:
    use: line:connector
