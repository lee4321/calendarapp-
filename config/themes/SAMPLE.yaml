theme:
  name: SAMPLE
  version: '3.0'
  description: Annotated reference theme for the unified style_rules schema.
base:
  font_family: FiraSans-Light
  default_missing_icon: applet-closed
layout:
  margin:
    top: 0.5in
    right: 0.5in
    bottom: 0.5in
    left: 0.5in
header:
  left:
    text: '{theme.name}'
  center:
    text: '{calendar.range}'
  right:
    text: '{today}'
footer:
  left:
    text: ''
  center:
    text: ''
  right:
    text: p. {page}
events:
  item_placement_order:
    - priority
durations:
  stroke_dasharray: null
watermark:
  text: ''
  rotation_angle: 45.0
  resize_mode: fit
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Pastel1
  fiscal_palette: Blues
  group_palette: Set2
  federal_holiday:
    opacity: 0.25
  company_holiday:
    opacity: 0.25
  resource_groups:
    engineering: steelblue
    design: mediumpurple
    qa: tomato
    ops: goldenrod
weekly:
  week_numbers:
    label_format: W{num:02d}
  overflow:
    icon: warningtriangle
mini_calendar:
  title_format: MMMM YYYY
  week_number_label_format: W{num}
  icon_set: squares
  show_adjacent: true          # render leading/trailing adjacent-month days
  circle_milestones: true      # circle day numbers that carry a milestone
  # current_day_color: red     # highlight color for today's day number
mini_details:
  output_suffix: _details
  title_text: Event Details
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Days
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  duration_fill: ■
  event_symbols:
    - •
    - ○
    - ◐
  milestone_symbols:
    - ◆
    - ◇
  holiday_symbols:
    - ✕
  nonworkday_symbols:
    - ·
timeline:
  tick_label_format: M/D
  today_date: ''
  today_label_text: Today
  marker_radius: 4.2
  icon_size: 8
  duration_offset_y: 30.0
  duration_lane_gap_y: 8.0
compact_plan:
  legend_area_ratio: 0.28
  bands:
    - date_range
    - week
blockplan:
  fiscal_year_start_month: 2
  week_start: 0
  label_column_ratio: 0.1
  band_row_height: 12.0
  lane_match_mode: first
  show_unmatched_lane: true
  unmatched_lane_name: Other
  swimlanes:
    - name: Engineering
    - name: Design
    - name: QA
      split_ratio: 0.0
    - name: Operations
    - name: Other
  top_bands:
    - fiscal_quarter
    - month
  bottom_bands: []
excelheader:
  font_name: Calibri
  font_size: 9
  band_row_height: 18.0
  top_bands:
    - fiscal_quarter
    - month
  band_fonts:
    fiscal_quarter:
      excel_font_name: Calibri
      excel_font_size: 10
  vertical_lines: []
style_rules:
  # Per-visualizer token override example: timeline duration-bar fill opacity.
  # (Bars in other visualizers read the shared ec-duration-bar element style.)
  # - name: timeline duration-bar fill opacity
  #   apply_to: line:duration_bar
  #   select:
  #     visualizer: timeline
  #   style:
  #     opacity: 0.75
  - name: define text:base
    define: text
    as: base
    style:
      font: FiraSans-Light
      size: 9
      color: black
  - name: define text:heading
    define: text
    as: heading
    style:
      font: FiraSans-Bold
      size: 11
      color: black
  - name: define text:body
    define: text
    as: body
    style:
      font: FiraSans-Light
      size: 8
      color: black
  - name: define text:caption
    define: text
    as: caption
    style:
      font: FiraSans-Light
      size: 7
      color: dimgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Bold
      size: 11
      color: black
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 9
      color: black
  - name: define text:week_number
    define: text
    as: week_number
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:event_name
    define: text
    as: event_name
    style:
      font: FiraSans-Light
      size: 8
      color: navy
  - name: define text:event_notes
    define: text
    as: event_notes
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:event_date
    define: text
    as: event_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:duration_date
    define: text
    as: duration_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: define text:today_label
    define: text
    as: today_label
    style:
      font: FiraSans-Light
      size: 7
      color: tomato
  - name: define text:fiscal_label
    define: text
    as: fiscal_label
    style:
      font: FiraSans-Light
      size: 7
      color: navy
  - name: define text:swimlane_label
    define: text
    as: swimlane_label
    style:
      font: Roboto-Bold
      size: 8
      color: black
  - name: define text:band_label
    define: text
    as: band_label
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: define text:milestone_label
    define: text
    as: milestone_label
    style:
      font: Roboto-Bold
      size: 7
      color: navy
  - name: text:heading — small paper
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.85
      stroke: grey
      stroke_width: 0.5
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:day
    define: box
    as: day
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:event
    define: box
    as: event
    style:
      fill: none
      stroke: none
  - name: define box:duration
    define: box
    as: duration
    style:
      fill: steelblue
      fill_opacity: 0.35
      stroke: navy
      stroke_width: 0.5
  - name: define box:milestone
    define: box
    as: milestone
    style:
      fill: none
      stroke: none
  - name: define box:vline
    define: box
    as: vline
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
  - name: define box:swimlane_heading
    define: box
    as: swimlane_heading
    style:
      fill: '#f4f4f4'
      stroke: grey
      stroke_width: 0.5
  - name: define box:swimlane_content
    define: box
    as: swimlane_content
    style:
      fill: none
      stroke: none
  - name: define box:band
    define: box
    as: band
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:band_heading
    define: box
    as: band_heading
    style:
      fill: none
      stroke: none
  - name: define line:grid
    define: line
    as: grid
    style:
      color: '#cccccc'
      width: 0.5
      opacity: 1.0
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 1.0
      opacity: 1.0
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: tomato
      width: 1.5
      opacity: 1.0
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:connector
    define: line
    as: connector
    style:
      color: grey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: navy
      size: 8
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
      size: 8
  - name: define icon:milestone
    define: icon
    as: milestone
    style:
      icon: diamond
      color: gold
      size: 12
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: chevron-down
      color: grey
      size: 8
  - name: federal holidays — day box tint
    apply_to: box:day
    select:
      federal_holiday: true
    style:
      fill: tomato
      fill_opacity: 0.1
      pattern: diagonal-stripes
      pattern_color: tomato
      pattern_opacity: 0.12
  - name: company nonworkdays — day box tint
    apply_to: box:day
    select:
      company_holiday: true
    style:
      fill: gold
      fill_opacity: 0.1
  - name: sprint durations
    apply_to: box:duration
    select:
      task_name:
        - Sprint
      event_type: duration
    style:
      fill: steelblue
      fill_opacity: 0.5
      stroke: steelblue
      stroke_width: 1.0
  - name: priority 1 — box outline
    apply_to: box:event
    select:
      priority: 1
    style:
      stroke: crimson
      stroke_width: 1.5
  - name: priority 1 — event name
    apply_to: text:event_name
    select:
      priority: 1
    style:
      color: crimson
      weight: bold
  - name: completed items — visual fade
    apply_to:
      - box:event
      - box:duration
      - text:event_name
    select:
      percent_complete:
        min: 100
    style:
      fill: '#f4f4f4'
      color: grey
      italic: true
  - name: critical milestone — marker
    apply_to: icon:milestone
    select:
      priority_min: 1
    style:
      icon: flag
      color: red
      size: 14
  - name: critical milestone — label
    apply_to: text:milestone_label
    select:
      priority_min: 1
    style:
      color: red
      weight: bold
  - name: month band — segment fill
    apply_to: box:band
    select:
      band: month
    style:
      fill:
        - lightblue
        - lightyellow
  - name: month band — label
    apply_to: text:band_label
    select:
      band: month
    style:
      color: navy
  - name: month separator vertical line
    apply_to: box:vline
    select:
      band: month
      repeat: true
    style:
      align: end
      stroke: grey
      stroke_width: 1.0
      stroke_opacity: 0.33
      dasharray: 5,5
  - name: Engineering — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Engineering
    style:
      fill: '#dceaff'
  - name: Engineering — label
    apply_to: text:swimlane_label
    select:
      swimlane: Engineering
    style:
      color: navy
  - name: Design — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Design
    style:
      fill: '#e7defb'
  - name: Design — label
    apply_to: text:swimlane_label
    select:
      swimlane: Design
    style:
      color: indigo
  - name: QA — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: QA
    style:
      fill: '#ffe1de'
  - name: QA — label
    apply_to: text:swimlane_label
    select:
      swimlane: QA
    style:
      color: firebrick
  - name: Operations — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Operations
    style:
      fill: '#fff3d8'
  - name: Operations — label
    apply_to: text:swimlane_label
    select:
      swimlane: Operations
    style:
      color: darkgoldenrod
  - name: Other — heading
    apply_to: box:swimlane_heading
    select:
      swimlane: Other
    style:
      fill: '#f0f0f0'
  - name: Other — label
    apply_to: text:swimlane_label
    select:
      swimlane: Other
    style:
      color: dimgrey
  - name: route engineering tasks
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
        - eng
    style:
      swimlane: Engineering
  - name: route design tasks
    apply_to: lane
    select:
      resource_group:
        - design
        - ux
    style:
      swimlane: Design
  - name: route qa tasks
    apply_to: lane
    select:
      resource_group:
        - qa
        - test
    style:
      swimlane: QA
  - name: route ops tasks
    apply_to: lane
    select:
      resource_group:
        - ops
        - operations
        - sre
    style:
      swimlane: Operations
  - name: catch-all
    apply_to: lane
    select: {}
    style:
      swimlane: Other
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-connector:
    use: line:connector
