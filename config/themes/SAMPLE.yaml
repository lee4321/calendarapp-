theme:
  name: SAMPLE
  version: '3.0'
  description: Annotated reference theme for the unified style_rules schema.
base:
  font_family: FiraSans-Light
  default_missing_icon: applet-closed
  # Ink for that stand-in. It flags an event naming an icon the icons
  # table does not have, so it stays an alert colour by default.
  default_missing_icon_color: red
  # Drawn size of that stand-in, in points. Omit (or null) to keep it the
  # size of whatever it replaces.
  default_missing_icon_size: null
layout:
  margin:
    top: 0.5in
    right: 0.5in
    bottom: 0.5in
    left: 0.5in
events:
  item_placement_order:
    - priority
watermark:
  text: ''
  rotation_angle: 45.0
  resize_mode: fit
overflow:
  icon: warningtriangle
details:
  # Run details: every visualization writes a folder under output/ holding
  # the chart, this details document, one icon file per icon it drew, and
  # an event CSV.  Column lists use the gantt.columns schema (field, header,
  # align, max_lines, render, icon, format, date_format, indent; width is
  # accepted and ignored).
  markdown:
    enable: true
    title_text: Calendar Details
    sections: [events, colors, symbols, exceptions, holidays]
    events_section_text: Events
    colors_section_text: Color Key
    symbols_section_text: Icons & Symbols
    exceptions_section_text: Exceptions
    holidays_section_text: Holidays & Special Days
    empty_exceptions_text: Every item was drawn as scheduled.
    empty_cell_text: ''
    icon_mode: file        # file | name | none
    color_mode: swatch     # swatch | hex | name
    group_by: none         # none, or a field: category, lane, resource_group ...
    sort: [start_date, end_date, name]
    columns:
      - { field: source_id,        header: ID,        align: right }
      - { field: marker,           header: Key,       align: center }
      - { field: name,             header: Task Name, indent: true }
      - { field: category,         header: Type }
      - { field: status,           header: Status }
      - { field: priority,         header: Pri,       align: right }
      - { field: wbs,              header: WBS }
      - { field: percent_complete, header: '%',       align: right, format: '{:.0%}' }
      - { field: start_date,       header: Start,     date_format: YYYY-MM-DD }
      - { field: end_date,         header: Finish,    date_format: YYYY-MM-DD }
      - { field: resource_names,   header: Resources }
      - { field: resource_group,   header: Group }
      - { field: assigned_color,   header: Color }
      - { field: notes,            header: Notes,     max_lines: 3 }
      - { field: drawn,            header: Drawn }
    exception_columns:
      - { field: issue,  header: Issue }
      - { field: task,   header: Task }
      - { field: date,   header: Date, date_format: YYYY-MM-DD }
      - { field: ref,    header: Ref }
      - { field: detail, header: Detail }
    holiday_columns:
      - { field: icons,      header: Icon, align: center }
      - { field: date,       header: Date }
      - { field: name,       header: Name }
      - { field: kind,       header: Kind }
      - { field: nonworkday, header: Non-work }
      - { field: notes,      header: Notes }
  icons:
    enable: true
    size: 16               # every icon file is size x size
  csv:
    enable: true
    columns: exportdata    # exportdata (re-importable), or a column list
    render_columns: true   # append assigned color, icons, lane, drawn ...
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Pastel1
  fiscal_palette: Blues
  group_palette: Set2
  federal_holiday:
    opacity: 0.25
  company_holiday:
    opacity: 0.25
weekly:
  week_numbers:
    label_format: W{num:02d}
mini_calendar:
  # Glyph set the mini-icon variant draws day numbers from:
  # squares | darksquare | circles | darkcircles | squircles |
  # darksquircles. --mini-icon-set overrides it.
  icon_set: squares
  title_format: MMMM YYYY
  week_number_label_format: W{num}
  show_adjacent: true          # render leading/trailing adjacent-month days
  circle_milestones: true      # circle day numbers that carry a milestone
  # current_day_color: red     # highlight color for today's day number
  # event / holiday / special-day icons in a day cell's corners, drawn
  # alongside the day number rather than in place of it: up to four, filled
  # top-right first and then clockwise
  event_icon_scale: 0.25      # fraction of the cell's shorter side
  event_icon_opacity: 0.6     # keeps the day number legible underneath
text_mini:
  cell_width: 2
  month_gap: 4
  duration_fill: ■
  event_symbols:
    - •
    - ○
    - ◐
  milestone_symbols:
    - ◆
    - ◇
  holiday_symbols:
    - ✕
  nonworkday_symbols:
    - ·
timeline:
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  tick_label_format: M/D
  # Distance from the axis to the built-in month-tick date labels.
  # tick_label_gap is measured from the tick's tip so it moves with the
  # tick; tick_label_offset_y is the whole distance and wins. Both null =
  # 1.5 label heights past the tick. A `ticks:` band below sets its own.
  tick_label_gap: null
  tick_label_offset_y: null
  today_date: ''
  today_label_text: Today
  marker_radius: 4.2
  icon_size: 8
  duration_offset_y: 30.0
  duration_lane_gap_y: 8.0
  leader:
    # false threads each leader through every row it passes, labella's own
    # routing: one curve-and-line pair per row, all crossing the boxes
    # between. true draws one curve from the dot to the box.
    direct: true
    # Straight perpendicular segments at each end of a callout leader.
    # labella's bezier leaves the axis dot and meets the box at a shallow
    # angle; the stubs make both ends arrive square-on. 0 = pure bezier.
    # Mirrors pit.leader.end_stub.
    start_stub: 4.0
    end_stub: 4.0
timeline_events:
  box_width: 115
  # how point-event boxes are placed: "packed" puts each box's leading
  # edge on its own start date and stacks collisions away from the axis;
  # "labella" keeps the force-solved placement centred on the date
  placement: packed
  # clear space between two rows of boxes; null follows timeline.labella.layer_gap
  row_gap: null
  # clear space between two boxes sharing a row
  box_gap: 2.0
  # inner border kept clear on all four sides of a box
  inner_pad: 2.0
  # share of a box's inner width given to the icon / date column
  icon_column_ratio: 0.15
compact_plan:
  bands:
    - date_range
    - week
blockplan:
  # leading WBS segments that make a duration family: one palette color,
  # rollups packed above the rest; 0 = color by event color / priority
  wbs_group_depth: 2
  fiscal_year_start_month: 2
  week_start: 0
  label_column_ratio: 0.1
  lane_match_mode: first
  show_unmatched_lane: true
  unmatched_lane_name: Other
  # Per-lane colors: fill_color tints the heading cell, label_color the lane
  # name, timeline_fill_color the lane's content area.
  swimlanes:
    - name: Engineering
      fill_color: '#dceaff'
      label_color: navy
    - name: Design
      fill_color: '#e7defb'
      label_color: indigo
    - name: QA
      split_ratio: 0.0
      fill_color: '#ffe1de'
      label_color: firebrick
    - name: Operations
      fill_color: '#fff3d8'
      label_color: darkgoldenrod
    - name: Other
      fill_color: '#f0f0f0'
      label_color: dimgrey
  top_bands:
    - fiscal_quarter
    - month
  bottom_bands: []
gantt:
  # ── Geometry ────────────────────────────────────────────────────────────
  table_width_ratio: 0.5   # task table's share of the content width
  row_height: 14.0          # fixed and uniform; cells truncate, never grow
  header_row_height: 18.0
  band_row_height: 10.0     # per-band default; a band may set its own
  indent_per_level: 8.0     # WBS depth × this, applied to indent: columns
  bar_height: 8.0
  min_day_width: 4.0        # split the range across pages below this; 0 = never
  sort:                     # WBS segments compare numerically: 1.9 before 1.10
    - wbs
    - start_date
  # ── Marks ───────────────────────────────────────────────────────────────
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check              # the task table's rollup column
  milestone_flag_icon: check      # the task table's milestone column
  snapped_event_icon: arrow-left-circle   # event moved off a hidden weekend
  offchart_dep_icon: crosssquare          # predecessor nowhere in the chart
  # Cross-page dependencies: one number per source event, drawn at the stub
  # and again in each unreachable successor's `link_ref` column.  Families
  # are consumed in order, giving 300 references before numbering degrades
  # to the unnumbered marker above.
  link_ref_icon_families: [circle-, darkcircle-, square-]
  link_ref_family_size: 100
  link_ref_max_icons: 2     # icons drawn in one reference cell
  continuation_icon: arrow-bar-right      # bar runs past the range
  progress_color: black
  progress_width: 1.5
  float_opacity_scale: 0.4  # earliest/latest bars, relative to the task bar
  show_dependencies: true
  # Arrows are curved leaders drawn like the PIT callout leaders; the head
  # is an SVG marker that orients itself along the curve.
  arrow_marker_end: arrow-head     # or `none` for a bare leader
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  show_today_line: true
  today_date: null          # YYYYMMDD to fix "today"; null = the wall clock
  # ── Task table ──────────────────────────────────────────────────────────
  # Column keys: field, header, width (renormalized), align, max_lines,
  # truncate, render (text|icon), icon, format, date_format, indent.
  # `field` names the events table (name, start_date, …); dates accept any
  # Arrow format plus the `dd` two-letter weekday token.
  columns:
    - { field: wbs,              header: WBS,       width: 0.05 }
  #  - { field: link_ref,        header: Ref,       width: 0.03, render: icon, align: center }
  #  - { field: source_id,        header: ID,        width: 0.035, align: right }
    - { field: name,             header: Task Name, width: 0.215, max_lines: 2, indent: true }
  #  - { field: status,           header: Status,    width: 0.045 }
    - { field: priority,         header: Pri,       width: 0.025, align: center }

  #  - { field: rollup,           header: Roll,      width: 0.02, render: icon, align: center }
  #  - { field: milestone,        header: MS,        width: 0.02, render: icon, align: center }
  #  - { field: percent_complete, header: '%',       width: 0.035, align: right, format: '{:.0%}' }
  #  - { field: effort_text,      header: Effort,    width: 0.045, align: right }
  #  - { field: duration_text,    header: Duration,  width: 0.045, align: right }
    - { field: start_date,       header: Start,     width: 0.06, date_format: dd MM/DD/YY }
    - { field: end_date,         header: Finish,    width: 0.06, date_format: dd MM/DD/YY }
  #  - { field: resource_names,   header: Resources, width: 0.065, max_lines: 1 }
  #  - { field: resource_group,   header: Group,     width: 0.055 }
    - { field: notes,            header: Notes,     width: 0.2, max_lines: 2 }
  #  - { field: deadline,         header: Deadline,  width: 0.08, date_format: dd MM/DD/YY }
  # Timescale.  `top_bands` / `bottom_bands` reference entries in the
  # top-level `time_bands:` catalog, exactly as blockplan does; omit
  # `bottom_bands` and the bottom axis mirrors the top.
  top_bands:
    - { band: fiscal_quarter, row_height: 12 }
    - { band: month,          row_height: 12 }
    - { band: week,           row_height: 10 }
  bottom_bands:
    - { band: month, row_height: 10 }
  #
  # Either stack takes **any number** of bands, each with its own
  # `row_height` (or the `band_row_height` default above), e.g. fiscal
  # quarter over month over week over day-of-week.  Should the stacks and
  # the column-header row together want more than 75% of the content
  # height, every chrome row is scaled down proportionally — no band is
  # dropped, and the task body always keeps positive height.
excelblockplan:
  font_name: Calibri
  font_size: 9
  band_row_height: 18.0
  # A placement may set its own excel_font_name / excel_font_size; bands
  # without them use font_name / font_size above.
  top_bands:
    - { band: fiscal_quarter, excel_font_name: Calibri, excel_font_size: 10 }
    - month
  vertical_lines: []
time_bands:
  # Shared catalog of band definitions.  Visualizers do not define bands
  # inline; they *reference* these by name from their own `top_bands` /
  # `bottom_bands` / `bands` lists, so one definition serves blockplan,
  # compactplan, excelblockplan and gantt alike.
  #
  # `unit` picks the segmentation: date | week | month | year | interval |
  # fiscal_quarter | fiscal_period | icon.  Label text comes from
  # `date_format` (an Arrow format, `dd` supported) or `label_format`
  # (a template over the segment's own fields).
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: 'Q{q}-FY{fy2}'
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMMM
    show_every: 1
  week:
    unit: week
    label: Week
    label_format: Week {n}
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
style_rules:
  # Event colors by resource group.  An event's color comes from style_rules
  # in every visualizer; the theme's later rules still win over these.
  - name: resource group engineering
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: engineering
    style:
      fill: steelblue
  - name: resource group design
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: design
    style:
      fill: mediumpurple
  - name: resource group qa
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: qa
    style:
      fill: tomato
  - name: resource group ops
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: ops
    style:
      fill: goldenrod
  - name: define text:heading
    define: text
    as: heading
    style:
      font: FiraSans-Bold
      size: 11
      color: black
  - name: define text:body
    define: text
    as: body
    style:
      font: FiraSans-Light
      size: 8
      color: black
  - name: define text:caption
    define: text
    as: caption
    style:
      font: FiraSans-Light
      size: 7
      color: dimgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Bold
      size: 11
      color: black
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 9
      color: black
  - name: define text:week_number
    define: text
    as: week_number
    style:
      font: FiraSans-Light
      size: 7
      color: grey
  - name: define text:event_name
    define: text
    as: event_name
    style:
      font: FiraSans-Light
      size: 8
      color: navy
  - name: define text:event_notes
    define: text
    as: event_notes
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:event_date
    define: text
    as: event_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:duration_date
    define: text
    as: duration_date
    style:
      font: FiraSans-Light
      size: 7
      color: darkgrey
  - name: define text:holiday_title
    define: text
    as: holiday_title
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: define text:today_label
    define: text
    as: today_label
    style:
      font: FiraSans-Light
      size: 7
      color: tomato
  - name: define text:fiscal_label
    define: text
    as: fiscal_label
    style:
      font: FiraSans-Light
      size: 7
      color: navy
  - name: define text:swimlane_label
    define: text
    as: swimlane_label
    style:
      font: Roboto-Bold
      size: 8
      color: black
  - name: define text:band_label
    define: text
    as: band_label
    style:
      font: FiraSans-Light
      size: 7
      color: black
  - name: text:heading — small paper
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.85
      stroke: grey
      stroke_width: 0.5
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:day
    define: box
    as: day
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define box:event
    define: box
    as: event
    style:
      fill: none
      stroke: none
  - name: define box:duration
    define: box
    as: duration
    style:
      fill: steelblue
      fill_opacity: 0.35
      stroke: navy
      stroke_width: 0.5
  - name: define box:milestone
    define: box
    as: milestone
    style:
      fill: none
      stroke: none
  - name: define box:vline
    define: box
    as: vline
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
  - name: define box:band
    define: box
    as: band
    style:
      fill: none
      stroke: grey
      stroke_width: 0.5
      stroke_opacity: 0.5
  - name: define line:grid
    define: line
    as: grid
    style:
      color: '#cccccc'
      width: 0.5
      opacity: 1.0
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 1.0
      opacity: 1.0
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: define line:today
    define: line
    as: today
    style:
      color: tomato
      width: 1.5
      opacity: 1.0
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:connector
    define: line
    as: connector
    style:
      color: grey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: navy
      size: 8
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
      size: 8
  - name: define icon:milestone
    define: icon
    as: milestone
    style:
      icon: diamond
      color: gold
      size: 12
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: warningtriangle
      color: grey
      size: 8
  - name: federal holidays — day box tint
    apply_to: box:day
    select:
      federal_holiday: true
    style:
      fill: tomato
      fill_opacity: 0.1
      pattern: diagonal-stripes
      pattern_color: tomato
      pattern_opacity: 0.12
  - name: company nonworkdays — day box tint
    apply_to: box:day
    select:
      company_holiday: true
    style:
      fill: gold
      fill_opacity: 0.1
  - name: sprint durations
    apply_to: box:duration
    select:
      task_name:
        - Sprint
      event_type: duration
    style:
      fill: steelblue
      fill_opacity: 0.5
      stroke: steelblue
      stroke_width: 1.0
  - name: priority 1 — box outline
    apply_to: box:event
    select:
      priority: 1
    style:
      stroke: crimson
      stroke_width: 1.5
  - name: completed items — visual fade
    apply_to:
      - box:event
      - box:duration
    select:
      percent_complete:
        min: 100
    style:
      fill: '#f4f4f4'
  - name: icon:milestone — mini (from mini_calendar)
    apply_to: icon:milestone
    select: {visualizer: mini}
    style: {stroke_width: 1.0, stroke_opacity: 1.0}
  - name: critical milestone — marker
    apply_to: icon:milestone
    select:
      priority_min: 1
    style:
      icon: flag
      color: red
      size: 14
  - name: month band — segment fill
    apply_to: box:band
    select:
      band: month
    style:
      fill:
        - lightblue
        - lightyellow
  - name: month band — label
    apply_to: text:band_label
    select:
      band: month
    style:
      color: navy
  - name: month separator vertical line
    apply_to: box:vline
    select:
      band: month
      repeat: true
    style:
      align: end
      stroke: grey
      stroke_width: 1.0
      stroke_opacity: 0.33
      dasharray: 5,5
  - name: route engineering tasks
    apply_to: lane
    select:
      resource_group:
        - engineering
        - dev
        - eng
    style:
      swimlane: Engineering
  - name: route design tasks
    apply_to: lane
    select:
      resource_group:
        - design
        - ux
    style:
      swimlane: Design
  - name: route qa tasks
    apply_to: lane
    select:
      resource_group:
        - qa
        - test
    style:
      swimlane: QA
  - name: route ops tasks
    apply_to: lane
    select:
      resource_group:
        - ops
        - operations
        - sre
    style:
      swimlane: Operations
  - name: catch-all
    apply_to: lane
    select: {}
    style:
      swimlane: Other
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-connector:
    use: line:connector
