theme:
  name: Default
  version: '2.0'
  description: The original CalendarApp styling — unified theme model
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
  font_family: Offside-Regular
  default_missing_icon: applet-closed
header:
  font_family: Offside-Regular
  font_color: grey
footer:
  font_family: Offside-Regular
  font_color: grey
events:
  icon_color: navy
  item_placement_order:
    - priority
durations:
  icon_color: navy
  stroke_dasharray: null
watermark:
  text: null
  color: blue
  font_family: Offside-Regular
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
continuation:
  show: true
  icon_before: arrow-left
  icon_after: arrow-right
  icon_height: 8.0
  icon_color: null
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: Greys
  fiscal_palette: Greys
  group_palette: Pastel1
  hash_lines: black
  federal_holiday:
    color: red
    opacity: 0.25
  company_holiday:
    color: green
    opacity: 0.25
  resource_groups:
    a: black
    b: yellow
    c: red
    d: grey
weekly:
  day_names:
    font_family: Offside-Regular
    font_color: grey
  week_numbers:
    font_family: Offside-Regular
    font_color: yellow
    label_format: W{num:02d}
  day_box:
    stroke_color: grey
    stroke_opacity: 0.25
    stroke_width: 2
    stroke_dasharray: null
    fill_color: grey
    fill_opacity: 0.25
    number_font: Offside-Regular
    number_color: white
    icon_color: red
    font_color: navy
    hash_pattern_opacity: 0.1
  name_text:
    font_name: Offside-Regular
    font_color: navy
  notes_text:
    font_name: Offside-Regular
    font_color: darkgrey
  overflow:
    icon: warningtriangle
    color: red
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squares
  cell_font: JuliaMono-Regular
  cell_bold_font: Roboto-Bold
  cell_font_size: null
  title_font: Offside-Regular
  title_font_size: null
  title_format: MMMM YYYY
  title_color: navy
  header_font: JuliaMono-Regular
  header_font_size: null
  header_color: grey
  day_number_glyphs: null
  day_number_digits: null
  day_color: black
  adjacent_month_color: lightgrey
  show_adjacent: true
  holiday_color: red
  nonworkday_fill_color: lightblue
  milestone_color: navy
  circle_milestones: true
  milestone_stroke_color: navy
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: lightblue
  week_number_font: JuliaMono-Regular
  week_number_font_size: null
  week_number_color: darkgrey
  week_number_label_format: W{num}
  grid_line_color: lightgrey
  grid_line_width: 0.25
  grid_line_opacity: 0.5
  grid_line_dasharray: null
  cell_box_stroke_dasharray: null
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
  day_box: null
mini_details:
  title_text: Event Details
  title_font: Offside-Regular
  title_font_size: null
  title_color: navy
  header_font: Offside-Regular
  header_font_size: null
  header_color: grey
  name_text:
    font_name: Offside-Regular
    font_color: black
  notes_text:
    font_name: Offside-Regular
    font_color: darkgrey
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
candybar:
  show_week_numbers: true
  cell_width: 0            # 0 = square cells (width == row height)
  weeknum_col_ratio: 0.6   # week-number column width / day-cell width
  month_col_ratio: 1.6     # month-box column width / day-cell width
  grid_lines: true
  grid_line_color: lightgrey
  day_color: black
  weekend_fill: null        # Sat/Sun day-cell tint (null = off)
  weekend_opacity: 0.15
  month_shading: false       # alternate day-cell tint per month
  month_shade_opacity: 0.12
  month_label_side: right
  month_format: MMM
  month:
    font: Offside-Regular
    color: navy
    opacity: 1.0
    bold: false
    anchor: middle
    rotation: 0
  month_box:
    fill: null
    stroke: lightgrey
    opacity: 1.0
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    # straight perpendicular run at the axis dot
    start_stub: 4.0
    # and at the box
    end_stub: 4.0
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
  background_color: powderblue
  axis_color: lightgrey
  axis_opacity: 0.9
  axis_width: 3
  tick_color: grey
  date_format: M/D
  tick_label_format: M/D
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: grey
  today_label_color: grey
  marker_stroke_color: ''
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 8
  duration_offset_y: 30
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.25
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: 4 2
  duration_bracket_stroke_dasharray: null
  top_colors:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - lightskyblue
    - ivory
    - lightgoldenrod
    - lightsalmon
    - lime
    - mistyrose
  bottom_colors:
    - midnightblue
    - springgreen
    - deepskyblue
    - gold
    - orchid
    - orange
    - mediumblue
    - orangered
    - firebrick
    - fuchsia
  name_text:
    font_name: Roboto-Bold
    font_color: deepskyblue
  notes_text:
    font_name: Offside-Regular
    font_color: deepskyblue
  date:
    font_family: Roboto-Bold
    font_color: deepskyblue
timeline_events:
  box_width: 170
  box_height: 24
timeline_durations:
  box_width: null
  box_height: 24
  date_font: RobotoCondensed-Italic
  date_font_size: 9
  date_color: grey
pit:
  direction: horizontal      # horizontal | vertical
  label_side: both           # primary | secondary | both
  labella:
    layer_gap: 50
    node_height: 24
    density: 0.50
  axis:
    color: lightgrey
    width: 1.5
    marker_size: 7.0          # bounding box of built-in circle/diamond
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 8
  tick_color: grey
  # tick_unit: month
  # Two tick rows: bold month labels over a light weekly grid.
  ticks:
    - unit: month
      show_labels: true
      label_format: MMMM
      label_align: start        # align the month name with its first-of-month tick
      label_side: below         # month names beneath the axis
      tick_length: 8.0
      label_gap: 16.0
    - unit: week
      week_start: 0
      label_align: start
      label_format: M/D
      label_side: above         # weekday labels above, clear of the month names
      show_labels: true
      max_label_count: 400      # raise the default 60-label cap so daily
                                # numbers still show over multi-month ranges
      tick_length: 4.0
      label_gap: 4.0
      tick_opacity: 0.5
  date_format: "ddd MMM D"
  name_text:
    font_name: Offside-Regular        # PIT callout event-name font
  notes_text:
    font_name: Offside-Regular        # PIT callout notes font
  date_text:
    color: grey
    font_name: Offside-Regular
    font_size: 9
    offset: 6.0
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: deepskyblue
  milestone_color: gold
  leader:
    color: grey
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: deepskyblue
    marker_end_size: 6.0
  leader_secondary:
    color: steelblue
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    show: true
    color: tomato
    width: 1.0
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: tomato
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: grey
  label:
    stroke_color: lightgrey
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: aliceblue
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.15
    text_color: "#1b1f24"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
    icon_size: null            # null = match event-name font size
    icon_gap: 4.0
  label_palette: Pastel1
compact_plan:
  palette:
    - '#92d050'
    - '#6b9bc7'
    - gold
    - tomato
    - plum
    - khaki
  show_axis: true
  axis_color: '#7f7f7f'
  axis_dasharray: 1.75,7.0
  text:
    font_color: black
  milestone_color: black
  header_bottom_y: null
  key_top_y: null
  legend_column_split: 0.5
  legend_team_columns: 2
  show_duration_icons: true
  duration_icon_list: darksquare
  duration_icon_height: 8.0
  duration_icon_color: null
  show_milestone_list: false
  milestone_list_date_format: M/D
  milestone_list_date_color: '#595959'
  milestone_list_row_height: 10.0
  milestone_list_date_col_width: 32.0
  milestone_list_section_gap: 6.0
  continuation_legend_text: activity continues
  continuation_section_gap: 4.0
  show_axis_legend: true
  legend_axis_text: timeline
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: grey
  grid_opacity: 0.3
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.08
  band_row_height: 10.0
  fiscal_year_start_month: 2
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Other
  lane_match_mode: first
  header_font: Offside-Regular
  header_font_size: null
  header_label_color: black
  header_label_opacity: 1.0
  header_label_align_h: right
  header_heading_fill_color: none
  band_font: Offside-Regular
  band_font_size: null
  timeband_label_color: black
  timeband_label_opacity: 1.0
  timeband_fill_color:
    - deepskyblue
    - gold
    - tomato
    - springgreen
    - lightskyblue
  timeband_fill_palette: accent
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: Offside-Regular
  lane_label_font_size: null
  lane_label_color: black
  lane_label_align_h: right
  lane_label_align_v: middle
  lane_label_rotation: 0
  lane_split_ratio: 0.5
  event_show_date: true
  event_date_font: Offside-Regular
  event_date_font_size: null
  event_date_color: grey
  event_date_format: M/D
  marker_radius: 2.0
  vertical_line_color: tomato
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_date_font: Offside-Regular
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.0
  duration_stroke_opacity: 0.9
  duration_stroke_dasharray: null
  duration_bar_height: 8.0
  duration_icon_visible: true
  name_text:
    font_name: Offside-Regular
    font_color: navy
  duration_show_start_date: true
  duration_show_end_date: true
  duration_date_format: M/D
  duration_date_color: dimgray
  palette:
    - lightskyblue
    - gold
    - tomato
    - springgreen
    - plum
    - khaki
  swimlanes:
    - name: Engineering
    - name: Operations
  top_bands:
    - band: fiscal_quarter
      row_height: 24
    - band: month_2
      row_height: 18
gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  # Table geometry.  Column definitions are layout, not style — style_rules
  # govern how the cells look, this decides which cells exist.
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  indent_per_level: 8.0
  sort:
    - wbs
    - start_date
  band_row_height: 10.0
  bar_height: 8.0
  min_day_width: 4.0     # 0 = never split the range across pages
  # Marks.  Icon names resolve against the `icon` table.
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  milestone_flag_icon: check
  snapped_event_icon: arrow-left-circle
  offchart_dep_icon: crosssquare
  continuation_icon: arrow-bar-right
  progress_color: black
  progress_width: 1.5
  float_opacity_scale: 0.4
  show_dependencies: true
  show_today_line: true
  today_date: null
  details_title_text: Gantt Details
  # Per-column keys: field, header, width (fraction of the table, renormalized),
  # align, max_lines, wrap, truncate, render (text|icon), icon, format,
  # date_format, indent.
  columns:
    - { field: link_ref,        header: Ref,       width: 0.03, render: icon, align: center }
    - { field: source_id,        header: ID,        width: 0.035, align: right }
    - { field: name,             header: Task Name, width: 0.215, max_lines: 2, indent: true }
    - { field: status,           header: Status,    width: 0.045 }
    - { field: priority,         header: Pri,       width: 0.025, align: right }
    - { field: wbs,              header: WBS,       width: 0.05 }
    - { field: rollup,           header: Roll,      width: 0.02, render: icon, align: center }
    - { field: milestone,        header: MS,        width: 0.02, render: icon, align: center }
    - { field: percent_complete, header: '%',       width: 0.035, align: right, format: '{:.0%}' }
    - { field: effort_text,      header: Effort,    width: 0.045, align: right }
    - { field: duration_text,    header: Duration,  width: 0.045, align: right }
    - { field: start_date,       header: Start,     width: 0.08, date_format: dd MM/DD/YY }
    - { field: end_date,         header: Finish,    width: 0.08, date_format: dd MM/DD/YY }
    - { field: resource_names,   header: Resources, width: 0.065, max_lines: 1 }
    - { field: resource_group,   header: Group,     width: 0.055 }
    - { field: notes,            header: Notes,     width: 0.075, max_lines: 2 }
    - { field: deadline,         header: Deadline,  width: 0.08, date_format: dd MM/DD/YY }
  # Bottom bands mirror the top when omitted.
  top_bands:
    - band: month
      row_height: 12
    - band: week
      row_height: 10
    - band: holiday
      row_height: 10
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: Q{q}-FY{fy2}
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMMM
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  holiday:
    unit: holiday
    label: Holidays
    # true hides observances that do not close the office
    nonworkdays_only: false
  dow:
    unit: date
    label: DoW
    date_format: dd
    show_every: 1
  month_2:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
  dow_2:
    unit: date
    label: DoW
    date_format: ddd
    show_every: 1

style_rules:
  - name: gantt dependency arrows
    apply_to: line:dependency_arrow
    style:
      stroke: navy
      stroke_width: 1.0
      stroke_opacity: 0.85
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    apply_to: line:duration_bar
    select:
      visualizer: timeline
    style:
      opacity: 0.75
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Offside-Regular
      size: 10
      color: grey
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: Offside-Regular
      size: 8
      color: navy
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: Offside-Regular
      size: 7
      color: darkgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: Offside-Regular
      size: 7
      color: grey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: Offside-Regular
      size: 7
      color: yellow
  - name: define text:caption
    define: text
    as: caption
    style:
      font: Offside-Regular
      size: 6
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Offside-Regular
      size: 10
      color: white
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Offside-Regular
      size: 8
      color: navy
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: grey
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 2
      stroke_opacity: 0.25
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: accent
      fill_colors:
        - deepskyblue
        - gold
        - tomato
        - springgreen
        - lightskyblue
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 3
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: grey
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: grey
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: navy
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: navy
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: overflow
      color: red
  - name: define line:tick
    define: line
    as: tick
    style:
      color: grey
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: grey
  - name: band pi — segment
    apply_to: box:band
    select:
      band: pi
    style:
      fill: none
  - name: band sprint — segment
    apply_to: box:band
    select:
      band: sprint
    style:
      fill: none
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: weekly_hash_0
    select:
      milestone: true
    apply_to: box:day
    style:
      pattern: diagonal-stripes
      pattern_color: gold
      pattern_opacity: 0.15
  - name: weekly_hash_1
    select:
      federal_holiday: true
    apply_to: box:day
    style:
      pattern: diagonal-stripes
      pattern_color: tomato
      pattern_opacity: 0.12
  - name: weekly_hash_2
    select:
      nonworkday: true
