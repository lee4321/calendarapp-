theme:
  name: Default
  version: '2.0'
  description: The original CalendarApp styling — unified theme model
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
  font_family: OfficinaSans-Book
  default_missing_icon: exclamation-circle
  # Ink for that stand-in. It flags an event naming an icon the icons
  # table does not have, so it stays an alert colour by default.
  default_missing_icon_color: red
events:
  icon_color: navy
  item_placement_order:
    - priority
watermark:
  text: null
  font_family: OfficinaSans-Book
  opacity: 0.5
  font_size: null
  resize_mode: fit
  rotation_angle: 45.0
  image_rotation_angle: 45.0
continuation:
  show: true
  icon_before: arrow-left
  icon_after: arrow-right
  icon_height: 8.0
  icon_color: black
overflow:
  icon: warningtriangle
details:
  # Run details: every visualization writes a folder under output/ holding
  # the chart, this details document, one icon file per icon it drew, and
  # an event CSV.  Column lists use the gantt.columns schema (field, header,
  # align, max_lines, render, icon, format, date_format, indent; width is
  # accepted and ignored).
  markdown:
    enable: true
    title_text: Calendar Details
    sections: [events, colors, symbols, exceptions, holidays]
    events_section_text: Events
    colors_section_text: Color Key
    symbols_section_text: Icons & Symbols
    exceptions_section_text: Exceptions
    holidays_section_text: Holidays & Special Days
    empty_exceptions_text: Every item was drawn as scheduled.
    empty_cell_text: ''
    icon_mode: file        # file | name | none
    color_mode: swatch     # swatch | hex | name
    group_by: none         # none, or a field: category, lane, resource_group ...
    sort: [start_date, end_date, name]
    columns:
      - { field: source_id,        header: ID,        align: right }
      - { field: marker,           header: Key,       align: center }
      - { field: name,             header: Task Name, indent: true }
      - { field: category,         header: Type }
      - { field: status,           header: Status }
      - { field: priority,         header: Pri,       align: right }
      - { field: wbs,              header: WBS }
      - { field: percent_complete, header: '%',       align: right, format: '{:.0%}' }
      - { field: start_date,       header: Start,     date_format: YYYY-MM-DD }
      - { field: end_date,         header: Finish,    date_format: YYYY-MM-DD }
      - { field: resource_names,   header: Resources }
      - { field: resource_group,   header: Group }
      - { field: assigned_color,   header: Color }
      - { field: notes,            header: Notes,     max_lines: 3 }
      - { field: drawn,            header: Drawn }
    exception_columns:
      - { field: issue,  header: Issue }
      - { field: task,   header: Task }
      - { field: date,   header: Date, date_format: YYYY-MM-DD }
      - { field: ref,    header: Ref }
      - { field: detail, header: Detail }
    holiday_columns:
      - { field: icons,      header: Icon, align: center }
      - { field: date,       header: Date }
      - { field: name,       header: Name }
      - { field: kind,       header: Kind }
      - { field: nonworkday, header: Non-work }
      - { field: notes,      header: Notes }
  icons:
    enable: true
    size: 16               # every icon file is size x size
  csv:
    enable: true
    columns: exportdata    # exportdata (re-importable), or a column list
    render_columns: true   # append assigned color, icons, lane, drawn ...
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: colorblind1
  fiscal_palette: paired
  group_palette: pastel1
  hash_lines: black
  federal_holiday:
    color: red
    opacity: 0.25
  company_holiday:
    color: green
    opacity: 0.25
weekly:
  week_numbers:
    label_format: W{num:02d}
  day_box:
    hash_pattern_opacity: 0.1
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squircles
  cell_bold_font: OfficinaSans-Book
  cell_font_size: null
  title_font_size: null
  title_format: MMMM YYYY
  header_font_size: null
  day_number_glyphs: null
  day_number_digits: null
  adjacent_month_color: lightgrey
  show_adjacent: false
  holiday_color: red
  nonworkday_fill_color: lightblue
  milestone_color: navy
  circle_milestones: false
  milestone_stroke_color: navy
  current_day_color: lightblue
  week_number_font_size: 12
  week_number_label_format: W{num}
  # event / holiday / special-day icons in a day cell's corners, drawn
  # alongside the day number rather than in place of it: up to four, filled
  # top-right first and then clockwise
  event_icon_scale: 0.25      # fraction of the cell's shorter side
  event_icon_opacity: 0.6     # keeps the day number legible underneath
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: [⯍, ⟠, ⨷, ✢, 🞭, 🞹, 🮻, 🯀, 🞿, 🟈, ❖, ◊, 𜱪, 🟃, 🟎, 🟉, ⯌, 🟒, 🟋, 🞻, 🞯, 🟂, 🟐,   ⭐, 🃟, ⊛, ⋇, ⊗, ⨳, ⧾, ⟡, ⟐,  ⯪, ⯫, ꥟, 𜱃,  𜱩, 𜸂, ⯏, "\U0001cecf", 🟙, 🝴, "\U0001fa54",  🮽, "\ue60e", "\ue615", "\ue835", "\uf2dc", "\U000f0633",  ✨, ❂]
  milestone_symbols: [🄰, 🄱, 🄲, 🄳, 🄴, 🄵, 🄶, 🄷, 🄸, 🄹, 🄺, 🄻, 🄼, 🄽, 🄾, 🄿, 🅀, 🅁, 🅂, 🅃, 🅄, 🅅, 🅆, 🅇, 🅈, 🅉]
  holiday_symbols: [🅰, 🅱, 🅲, 🅳, 🅴, 🅵, 🅶, 🅷, 🅸, 🅹, 🅺, 🅻, 🅼, 🅽, 🅾, 🅿, 🆀, 🆁, 🆂, 🆃, 🆄, 🆅, 🆆, 🆇, 🆈, 🆉]
  nonworkday_symbols: [𝒂, 𝒃, 𝒄, 𝒅, 𝒆, 𝒇, 𝒈, 𝒉, 𝒊, 𝒋, 𝒌, 𝒍, 𝒎, 𝒏, 𝒐, 𝒑, 𝒒, 𝒓, 𝒔, 𝒕, 𝒖, 𝒗, 𝒘, 𝒙, 𝒚, 𝒛]
  duration_symbols: null
  duration_fill: null
candybar:
  show_week_numbers: true
  cell_width: 0            # 0 = square cells (width == row height)
  weeknum_col_ratio: 1.0   # week-number column width / day-cell width
  month_col_ratio: 1.6     # month-box column width / day-cell width
  grid_lines: true
  grid_line_color: lightgrey
  weekend_fill: null        # Sat/Sun day-cell tint (null = off)
  weekend_opacity: 0.25
  month_shading: true       # alternate day-cell tint per month
  month_shade_opacity: 0.12
  month_label_side: right
  month_format: MMM
  month:
    font: OfficinaSans-Book
    color: navy
    opacity: 1.0
    anchor: middle
    rotation: 0
  month_box:
    fill: null
    stroke: lightgrey
    opacity: 1.0
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    start_stub: 4.0   # straight segment leaving the axis dot
    end_stub: 4.0     # straight segment meeting the box
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 5.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: M/D
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
  axis_width: 3
  date_format: M/D
  tick_label_format: M/D
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 5.0
  today_line_color: grey
  marker_stroke_color: ''
  marker_stroke_width: 1.0
  marker_radius: 4.0
  icon_size: 8
  duration_offset_y: 20
  duration_lane_gap_y: 8.0
  label_fill_opacity: 0.25
  palette: colorblind2
timeline_events:
  box_width: 115
  box_height: 16
  # how point-event boxes are placed: "packed" puts each box's leading
  # edge on its own start date and stacks collisions away from the axis;
  # "labella" keeps the force-solved placement centred on the date
  placement: packed
  # clear space between two rows of boxes; null follows timeline.labella.layer_gap
  row_gap: 10
  # clear space between two boxes sharing a row
  box_gap: 2.0
  # inner border kept clear on all four sides of a box
  inner_pad: 2.0
  # share of a box's inner width given to the icon / date column
  icon_column_ratio: 0.15
timeline_durations:
  box_width: null
  box_height: 14
  date_font_size: 9
pit:
  direction: horizontal      # horizontal | vertical
  label_side: both           # primary | secondary | both
  labella:
    layer_gap: 50
    node_height: 24
    density: 0.50
  axis:
    color: lightgrey
    width: 1.5
    marker_size: 7.0          # bounding box of built-in circle/diamond
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 8
  tick_color: grey
  # tick_unit: month
  # Two tick rows: bold month labels over a light weekly grid.
  ticks:
    - unit: month
      show_labels: true
      label_format: MMMM
      label_align: start        # align the month name with its first-of-month tick
      label_side: below         # month names beneath the axis
      tick_length: 8.0
      label_gap: 16.0
    - unit: week
      week_start: 0
      label_align: start
      label_format: M/D
      label_side: above         # weekday labels above, clear of the month names
      show_labels: true
      max_label_count: 400      # raise the default 60-label cap so daily
                                # numbers still show over multi-month ranges
      tick_length: 4.0
      label_gap: 4.0
      tick_opacity: 0.5
  date_format: "ddd MMM D"
  name_text:
    font_name: OfficinaSans-Book        # PIT callout event-name font
  notes_text:
    font_name: OfficinaSans-Book        # PIT callout notes font
  date_text:
    color: grey
    font_name: OfficinaSans-Book
    font_size: 9
    offset: 6.0
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: deepskyblue
  milestone_color: gold
  leader:
    color: grey
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: deepskyblue
  leader_secondary:
    color: steelblue
  today_line:
    show: true
    color: tomato
    width: 1.0
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: tomato
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: grey
  label:
    stroke_color: lightgrey
    stroke_width: 0.5
    fill_color: aliceblue
    fill_opacity: 0.85
    pattern: null
    text_color: "#1b1f24"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
    icon_size: null            # null = match event-name font size
    icon_gap: 4.0
  label_palette: Pastel1

compact_plan:
  # A bar takes its style_rules fill, else its own Color, else its
  # resource group's palette color below.
  palette:
    - '#92d050'
    - '#6b9bc7'
    - gold
    - tomato
    - plum
    - khaki
  show_axis: true
  header_bottom_y: null
  show_duration_icons: true
  duration_icon_list: darksquare
  duration_icon_height: 8.0
  # each bar is three columns: start date | icon + name | end date; the
  # date columns are each this fraction of the bar's width
  duration_show_start_date: true
  duration_show_end_date: true
  duration_date_format: M/D
  duration_date_column_ratio: 0.04
  # null → black or white, whichever reads against the bar
  duration_date_color: null
  duration_name_color: null
  continuation_legend_text: activity continues
  continuation_before_legend_text: activity began earlier
  show_axis_legend: true
  legend_axis_text: timeline
  # marks a government holiday's date/dow band cell; each closed
  # country's own flag takes its place, so this shows only when a
  # holiday carries no flag
  federal_holiday_icon: null
  bands:
    - date_range
    - week
    - date

blockplan:
  fiscal_year_start_month: 2
  week_start: 0
  show_unmatched_lane: false
  unmatched_lane_name: Other
  lane_match_mode: first
  header_font_size: null
  header_label_align_h: right
  band_font_size: null
  timeband_fill_palette: accent
  timeband_fill_opacity: 1.0
  label_column_ratio: 0.05
  lane_label_font_size: null
  lane_label_align_h: right
  lane_label_align_v: middle
  lane_label_rotation: 0
  lane_split_ratio: 0.25
  event_show_date: true
  event_date_font_size: null
  event_date_format: M/D
  marker_radius: 2.0
  duration_bar_height: 14
  duration_row_gap: 3
  duration_icon_visible: true
  duration_show_start_date: true
  duration_show_end_date: true
  duration_date_format: M/D
  # marks a government holiday's date/dow band cell; each closed
  # country's own flag takes its place, so this shows only when a
  # holiday carries no flag
  federal_holiday_icon: flag-duotone
  palette:
    - lightskyblue
    - gold
    - tomato
    - springgreen
    - plum
    - khaki
  #  - name: Engineering
  #  - name: Operations
  top_bands:
    - band: fiscal_quarter
      row_height: 12
      stroke_color: black
    - band: month_2
      row_height: 12
      stroke_color: grey
    - band: date
      row_height: 12
      stroke_color: grey
    - band: dow
      row_height: 12
      stroke_color: grey
    - band: holiday
      row_height: 12
      stroke_color: grey
      # An icon band sizes its heading from the row height unless told
      # otherwise, which would print "Holidays" smaller than the labels
      # stacked above it.
      # label_font_size: 10

gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  # Table geometry.  Column definitions are layout, not style — style_rules
  # govern how the cells look, this decides which cells exist.
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  indent_per_level: 8.0
  sort:
    - wbs
    - start_date
  band_row_height: 10.0
  bar_height: 8.0
  min_day_width: 4.0     # 0 = never split the range across pages
  # Marks.  Icon names resolve against the `icon` table.
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  milestone_flag_icon: check
  snapped_event_icon: arrow-left-circle
  offchart_dep_icon: crosssquare
  continuation_icon: arrow-bar-right
  progress_color: black
  progress_width: 1.5
  float_opacity_scale: 0.4
  show_dependencies: true
  show_today_line: true
  today_date: null
  # Per-column keys: field, header, width (fraction of the table, renormalized),
  # align, max_lines, wrap, truncate, render (text|icon), icon, format,
  # date_format, indent.
  columns:
    - { field: link_ref,        header: Ref,       width: 0.03, render: icon, align: center }
    - { field: source_id,        header: ID,        width: 0.035, align: right }
    - { field: name,             header: Task Name, width: 0.215, max_lines: 2, indent: true }
    - { field: status,           header: Status,    width: 0.045 }
    - { field: priority,         header: Pri,       width: 0.025, align: right }
    - { field: wbs,              header: WBS,       width: 0.05 }
    - { field: rollup,           header: Roll,      width: 0.02, render: icon, align: center }
    - { field: milestone,        header: MS,        width: 0.02, render: icon, align: center }
    - { field: percent_complete, header: '%',       width: 0.035, align: right, format: '{:.0%}' }
    - { field: effort_text,      header: Effort,    width: 0.045, align: right }
    - { field: duration_text,    header: Duration,  width: 0.045, align: right }
    - { field: start_date,       header: Start,     width: 0.08, date_format: dd MM/DD/YY }
    - { field: end_date,         header: Finish,    width: 0.08, date_format: dd MM/DD/YY }
    - { field: resource_names,   header: Resources, width: 0.065, max_lines: 1 }
    - { field: resource_group,   header: Group,     width: 0.055 }
    - { field: notes,            header: Notes,     width: 0.075, max_lines: 2 }
    - { field: deadline,         header: Deadline,  width: 0.08, date_format: dd MM/DD/YY }
  # Bottom bands mirror the top when omitted.
  top_bands:
    - band: month
      row_height: 12
    - band: week
      row_height: 10
    - band: holiday
      row_height: 10
time_bands:
  fiscal_quarter:
    unit: fiscal_quarter
    label: Fiscal Quarter
    label_format: Q{q}-FY{fy2}
    show_every: 1
  month:
    unit: month
    label: Month
    date_format: MMMM
    show_every: 1
  date:
    unit: date
    label: Date
    date_format: D
    show_every: 1
  holiday:
    unit: holiday
    label: Holidays
    # true hides observances that do not close the office
    nonworkdays_only: true
  dow:
    unit: date
    label: DoW
    date_format: dd
    show_every: 1
  month_2:
    unit: month
    label: Month
    date_format: MMM YYYY
    show_every: 1
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}

excelblockplan:
  band_row_height: 18.0
  font_name: Calibri
  font_size: 9
layout:
  margin:
    bottom: 0
    left: 0
    right: 0
    top: 0
style_rules:
  # Event colors by resource group.  An event's color comes from style_rules
  # in every visualizer; the theme's later rules still win over these.
  - name: box:duration — blockplan (from blockplan)
    apply_to: box:duration
    select: {visualizer: blockplan}
    style: {stroke_opacity: 0.9, stroke_width: 1.0, stroke: black}
  - name: resource group a
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: a
    style:
      fill: black
  - name: resource group b
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: b
    style:
      fill: yellow
  - name: resource group c
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: c
    style:
      fill: red
  - name: resource group d
    apply_to:
      - box:event
      - box:duration
    select:
      resource_group: d
    style:
      fill: grey
  - name: gantt dependency arrows
    apply_to: line:dependency_arrow
    style:
      stroke: navy
      stroke_width: 1.0
      stroke_opacity: 0.85
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    apply_to: line:duration_bar
    select:
      visualizer: timeline
    style:
      opacity: 0.75
  - name: define text:heading
    define: text
    as: heading
    style:
      font: OfficinaSans-Book
      size: 10
      color: grey
  - name: text:heading — blockplan (from blockplan)
    apply_to: text:heading
    select: {visualizer: blockplan}
    style: {opacity: 1.0}
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
        - tabloid
    style:
      size: 10
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: OfficinaSans-Book
      size: 8
      color: navy
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: OfficinaSans-Book
      size: 7
      color: darkgrey
  - name: define text:label
    define: text
    as: label
    style:
      font: OfficinaSans-Book
      size: 7
      color: grey
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: OfficinaSans-Book
      size: 7
      color: yellow
  - name: define text:caption
    define: text
    as: caption
    style:
      font: OfficinaSans-Book
      size: 6
      color: grey
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: OfficinaSans-Book
      size: 18
      color: navy
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: OfficinaSans-Book
      size: 18
      color: navy
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: grey
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 2
      stroke_opacity: 0.25
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: accent
      fill_colors:
        - deepskyblue
        - gold
        - tomato
        - springgreen
        - lightskyblue
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: lightblue
      fill_opacity: 0.3
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: grey
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: grey
      width: 0.5
      opacity: 0.3
  - name: define line:axis
    define: line
    as: axis
    style:
      color: lightgrey
      width: 3
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: grey
      width: 0.5
