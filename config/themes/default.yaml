# The default theme.  A theme may state anything and omit the rest: every value not
# written here is the schema default (config/theme_schema.py).  See
# config/themes/demonstration.yaml for every supported key and its allowed values.
theme:
  name: Default
  version: '3.0'
  description: The default look

fonts:
  # [text]
  family: SofiaSansExtraCondensed-Regular

fiscal:
  year_start_month: 2
  week_start: 0

lines:
  axis: { color: lightgrey, width: 1.75, opacity: 0.9 }
  dependency: { color: navy, width: 1.0, opacity: 0.85 }

today:
  show: true
  label: Today

boxes:
  duration: { fill: lightsteelblue, stroke: black, stroke_width: 1.0, stroke_opacity: 0.9 }
  band:
    stroke: grey
    stroke_width: 0.5

# One timescale for every view.  Primary rows sit above the content (or on the
# axis's primary side); secondary rows mirror them below.
timescale:
  heading_align: end
  primary:
    - { unit: fiscal_quarter, label: Fiscal Quarter, format: 'Q{q}-FY{fy2}', height: 12 }
    - { unit: fiscal_period,  label: Fiscal Period,  format: '{prefix}{period_short}', end_format: '{period_short} End', height: 12 }
    - { unit: month,          label: Month,          format: MMMM,            height: 12, tick: { length: 6, label_align: start } }
    - { unit: dow,            label: DoW,            format: dd,              height: 10 }
    - { unit: date,           label: Date,           format: D,               height: 10 }
    - { unit: holiday,        label: Holidays,       height: 10, holidays: { nonworkdays_only: true } }
  secondary:
    - { unit: holiday,        label: Holidays,       height: 10, holidays: { nonworkdays_only: true } }
    - { unit: date,           label: Date,           format: D,               height: 10 }
    - { unit: dow,            label: DoW,            format: dd,              height: 10 }
    - { unit: month,          label: Month,          format: MMMM,            height: 12, tick: { length: 6, label_align: start } }
    - { unit: fiscal_period,  label: Fiscal Period,  format: '{prefix}{period_short}', end_format: '{period_short} End', height: 12 }
    - { unit: fiscal_quarter, label: Fiscal Quarter, format: 'Q{q}-FY{fy2}', height: 12 }

holidays:
  federal: { color: red, opacity: 0.25, icon: flag-duotone }
  company: { color: green, opacity: 0.25 }
  weekend: { color: grey, opacity: 0.15 }

# Event colours by resource group.
style_rules:
  - { name: resource group a, apply_to: [box:event, box:duration], select: { resource_group: a }, style: { fill: black } }
  - { name: resource group b, apply_to: [box:event, box:duration], select: { resource_group: b }, style: { fill: yellow } }
  - { name: resource group c, apply_to: [box:event, box:duration], select: { resource_group: c }, style: { fill: red } }
  - { name: resource group d, apply_to: [box:event, box:duration], select: { resource_group: d }, style: { fill: grey } }

  # Weekly and mini day-box hatching.
  - { name: hash milestone,    apply_to: box:day, select: { milestone: true },        style: { pattern: diagonal-stripes, pattern_color: gold,        pattern_opacity: 0.15 } }
  - { name: hash holiday,      apply_to: box:day, select: { federal_holiday: true },  style: { pattern: diagonal-stripes, pattern_color: tomato,      pattern_opacity: 0.12 } }
  - { name: hash nonworkday,   apply_to: box:day, select: { nonworkday: true },       style: { pattern: diagonal-stripes, pattern_color: silver,      pattern_opacity: 0.08 } }
  - { name: hash release,      apply_to: box:day, select: { task_name: [Release, Cutover], event_type: event },   style: { pattern: diagonal-stripes, pattern_color: gold,          pattern_opacity: 0.10 } }
  - { name: hash sprint,       apply_to: box:day, select: { task_name: [Sprint, Freeze], event_type: duration },  style: { pattern: diagonal-stripes, pattern_color: steelblue,     pattern_opacity: 0.08 } }
  - { name: hash complete,     apply_to: box:day, select: { percent_complete: { min: 100 } },                     style: { pattern: diagonal-stripes, pattern_color: mediumseagreen, pattern_opacity: 0.10 } }
  - { name: hash urgent,       apply_to: box:day, select: { notes: [urgent, blocker] },                           style: { pattern: diagonal-stripes, pattern_color: orangered,      pattern_opacity: 0.12 } }
  - { name: hash phase one,    apply_to: box:day, select: { wbs: '1.' },                                          style: { pattern: diagonal-stripes, pattern_color: lightskyblue,   pattern_opacity: 0.08 } }
  - { name: hash alice,        apply_to: box:day, select: { resource_names: [Alice] },                            style: { pattern: diagonal-stripes, pattern_color: mediumpurple,   pattern_opacity: 0.08 } }
  - { name: hash dev,          apply_to: box:day, select: { resource_group: [dev] },                              style: { pattern: diagonal-stripes, pattern_color: steelblue,      pattern_opacity: 0.10 } }

# ── Durations, continuation and the page ────────────────────────────────────────
durations:
  icon_size: 10.0

mini_calendar:
  show_adjacent: false

candybar:
  weeknum_col_ratio: 1.0
  month_shading: true

timeline:
  events:
    box_width: 115
    box_height: 16
    row_gap: 10
  durations:
    box_height: 14

compact_plan: {}

blockplan:
  show_unmatched_lane: false
  unmatched_lane_name: Other
  label_column_ratio: 0.05
  lane_label_align_h: end
  lane_split_ratio: 0.25
  duration_bar_height: 14
  duration_row_gap: 3

gantt:
  header_row_height: 14.0
  indent_per_level: 5.0
  columns:
    - { field: wbs,              header: WBS,       width: 0.08 }
    - { field: name,             header: Task Name, width: 0.3, max_lines: 2, indent: true }
    - { field: percent_complete, header: '%',       width: 0.04, align: end, format: '{:.0%}' }
    - { field: start_date,       header: Start,     width: 0.08, date_format: dd MM/DD }
    - { field: end_date,         header: Finish,    width: 0.08, date_format: dd MM/DD }
    - { field: notes,            header: Notes,     width: 0.3, max_lines: 2 }
