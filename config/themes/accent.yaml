theme:
  name: Accent
  version: '2.0'
  description: Palette-driven theme with all colors from the Accent DB palette — unified
    theme model
base:
  # size of the stand-in glyph; null = the size of what it replaces
  default_missing_icon_size: null
  font_family: RobotoCondensed-Regular
  default_missing_icon: star-dashed
header:
  font_family: Roboto-Bold
  font_color: palette:Accent:4
  left:
    font_color: palette:Accent:4
  center:
    font_color: palette:Accent:4
  right:
    font_family: Roboto-BoldItalic
    font_color: palette:Accent:4
footer:
  font_family: RobotoCondensed-Light
  font_color: palette:Accent:7
  left:
    font_color: palette:Accent:4
  center:
    font_color: palette:Accent:4
  right:
    font_family: Roboto-BoldItalic
    font_color: palette:Accent:4
events:
  icon_color: palette:Accent:4
  item_placement_order:
    - milestones
    - events
    - durations
durations:
  icon_color: palette:Accent:4
  stroke_dasharray: null
watermark:
  text: null
  color: palette:Accent:1
  font_family: Roboto-Bold
  opacity: 0.15
  font_size: null
  resize_mode: fit
  rotation_angle: 0.0
  image_rotation_angle: 0.0
fiscal:
  label_format: '{prefix}{period_short}'
  end_label_format: '{period_short} End'
  year_offset: null
colors:
  month_palette: PuBuGn
  fiscal_palette: Accent
  group_palette: PuBuGn
  hash_lines: palette:Accent:7
  federal_holiday:
    color: palette:Accent:5
    opacity: 0.25
  company_holiday:
    color: palette:Accent:0
    opacity: 0.25
  resource_groups:
    a: palette:Accent:4
    b: palette:Accent:0
    c: palette:Accent:1
    d: palette:Accent:7
weekly:
  day_names:
    font_family: RobotoCondensed-Bold
    font_color: palette:Accent:4
  week_numbers:
    font_family: RobotoCondensed-Bold
    font_color: palette:Accent:7
    label_format: W{num:02d}
  day_box:
    stroke_color: palette:Accent:7
    stroke_opacity: 0.2
    stroke_width: 2
    stroke_dasharray: null
    fill_color: palette:Accent:0
    fill_opacity: 0.15
    number_font: Roboto-Bold
    number_color: palette:Accent:4
    icon_color: palette:Accent:4
    font_color: palette:Accent:7
    hash_pattern_opacity: 0.2
  name_text:
    font_name: RobotoCondensed-Regular
    font_color: palette:Accent:7
  notes_text:
    font_name: RobotoCondensed-Italic
    font_color: palette:Accent:6
  overflow:
    icon: send-backward
    color: orange
mini_calendar:
  # mini-icon day glyphs: squares | darksquare | circles |
  # darkcircles | squircles | darksquircles
  icon_set: squares
  cell_font: JuliaMono-Regular
  cell_bold_font: Roboto-Bold
  cell_font_size: null
  title_font: Roboto-Bold
  title_font_size: null
  title_format: MMMM YYYY
  title_color: palette:Accent:4
  header_font: JuliaMono-Regular
  header_font_size: null
  header_color: palette:Accent:7
  day_number_glyphs: null
  day_number_digits: null
  day_color: palette:Accent:7
  adjacent_month_color: palette:Accent:1
  show_adjacent: true
  holiday_color: palette:Accent:5
  nonworkday_fill_color: palette:Accent:3
  milestone_color: palette:Accent:4
  circle_milestones: true
  milestone_stroke_color: palette:Accent:4
  milestone_stroke_width: 1.0
  milestone_stroke_opacity: 1.0
  current_day_color: palette:Accent:2
  week_number_font: JuliaMono-Regular
  week_number_font_size: null
  week_number_color: palette:Accent:7
  week_number_label_format: W{num}
  grid_line_color: lightgrey
  grid_line_width: 0.25
  grid_line_opacity: 0.5
  grid_line_dasharray: null
  cell_box_stroke_dasharray: null
  strikethrough_stroke_dasharray: null
  hash_line_dasharray: null
  duration_bar_stroke_dasharray: null
  duration_bar_stroke_opacity: null
  day_box: null
mini_details:
  title_text: Event Details
  title_font: RobotoCondensed-Bold
  title_font_size: null
  title_color: palette:Accent:4
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_color: palette:Accent:7
  name_text:
    font_name: RobotoCondensed-Light
    font_color: palette:Accent:7
  notes_text:
    font_name: RobotoCondensed-Italic
    font_color: palette:Accent:6
  separator_stroke_dasharray: null
  headers:
    - Start Date
    - Name / Description
    - Milestone
    - Priority
    - Group
  column_widths:
    - 0.16
    - 0.52
    - 0.1
    - 0.1
    - 0.12
text_mini:
  cell_width: 2
  month_gap: 4
  week_number_digits: null
  day_number_digits: null
  event_symbols: null
  milestone_symbols: null
  holiday_symbols: null
  nonworkday_symbols: null
  duration_symbols: null
  duration_fill: null
candybar:
  show_week_numbers: true
  cell_width: 0            # 0 = square cells (width == row height)
  weeknum_col_ratio: 0.6   # week-number column width / day-cell width
  month_col_ratio: 1.6     # month-box column width / day-cell width
  grid_lines: true
  grid_line_color: lightgrey
  day_color: black
  weekend_fill: null        # Sat/Sun day-cell tint (null = off)
  weekend_opacity: 0.15
  month_shading: false       # alternate day-cell tint per month
  month_shade_opacity: 0.12
  month_label_side: right
  month_format: MMM
  month:
    font: RobotoCondensed-Bold
    color: teal
    opacity: 1.0
    bold: false
    anchor: middle
    rotation: 0
  month_box:
    fill: null
    stroke: cadetblue
    opacity: 1.0
timeline:
  leader:
    # one curve per leader instead of one per row it crosses
    direct: true
    # straight perpendicular run at the axis dot
    start_stub: 4.0
    # and at the box
    end_stub: 4.0
  # leading WBS segments that share one color; 0 = off
  wbs_group_depth: 2
  # government-holiday marks under the axis
  show_holiday_icons: true
  holiday_icon_size: 10.0
  # null keeps each flag's own colors
  holiday_icon_color: null
  holiday_icon_y_offset: 4.0
  # print each holiday's date under its icon
  show_holiday_dates: true
  # null follows timeline.date_format
  holiday_date_format: null
  holiday_date_font_size: null
  holiday_date_color: null
  # axis-to-tick-date distance; null = 1.5 label heights
  tick_label_gap: null
  # the whole distance; wins over the gap
  tick_label_offset_y: null
  background_color: ''
  axis_color: palette:Accent:3
  axis_opacity: 0.9
  axis_width: 2
  tick_color: palette:Accent:1
  date_format: MMM D
  tick_label_format: MMM YY
  today_date: ''
  today_label_text: Today
  today_label_offset_y: 10.0
  today_line_color: palette:Accent:5
  today_label_color: palette:Accent:3
  marker_stroke_color: palette:Accent:4
  marker_stroke_width: 1.0
  marker_radius: 4.2
  icon_size: 10.0
  duration_offset_y: 44.0
  duration_lane_gap_y: 8.0
  label_stroke_width: 1.0
  label_fill_opacity: 0.0
  axis_stroke_dasharray: null
  tick_stroke_dasharray: null
  today_line_dasharray: null
  label_stroke_dasharray: null
  duration_bar_stroke_dasharray: null
  connector_stroke_dasharray: null
  duration_bracket_stroke_dasharray: null
  top_colors:
    - palette:Accent:4
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:2
    - palette:Accent:1
  bottom_colors:
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:4
    - palette:Accent:1
    - palette:Accent:2
  palette: Accent
  name_text:
    font_name: Roboto-Bold
    font_color: palette:Accent:3
  notes_text:
    font_name: RobotoCondensed-Bold
    font_color: palette:Accent:1
  date:
    font_family: Roboto-Bold
    font_color: palette:Accent:3
timeline_events:
  box_width: 150
  # how point-event boxes are placed: "packed" puts each box's leading
  # edge on its own start date and stacks collisions away from the axis;
  # "labella" keeps the force-solved placement centred on the date
  placement: packed
  # clear space between two rows of boxes; null follows timeline.labella.layer_gap
  row_gap: null
  # clear space between two boxes sharing a row
  box_gap: 2.0
  # inner border kept clear on all four sides of a box
  inner_pad: 2.0
  # share of a box's inner width given to the icon / date column
  icon_column_ratio: 0.15
pit:
  direction: horizontal      # horizontal | vertical
  label_side: both           # primary | secondary | both
  labella:
    layer_gap: 8
    node_height: 24
    density: 0.75
  axis:
    color: "#cccccc"
    width: 1.5
    marker_size: 7.0          # bounding box of built-in circle/diamond
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "arrow-head"
    marker_end_size: 6.0
  tick_color: "#aaaaaa"
  tick_unit: month
  # Two tick rows: month labels over a light weekly grid. Band colors are
  # literal (per-band tick_color is not palette-resolved).
  ticks:
    - unit: month
      label_format: MMM
      label_side: below         # month names beneath the axis
      tick_length: 8.0
      tick_color: "#7a7a7a"
      label_color: "#7a7a7a"
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above         # day numbers above, clear of the month names
      label_color: "#aaaaaa"
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: "#cccccc"
      tick_opacity: 0.6
  date_format: "MMM D"
  name_text:
    font_name: RobotoCondensed-Regular  # PIT callout event-name font
  notes_text:
    font_name: RobotoCondensed-Italic   # PIT callout notes font
  date_text:
    color: "#888888"
    font_name: Roboto-Regular
    font_size: 9
    offset: 6.0
  # Optional DB icon names drawn INSIDE the callout label box,
  # left of the event name. Leave null for plain text-only labels.
  # The axis marker is always a built-in shape (circle for events,
  # diamond for milestones) and is NOT affected by these settings.
  default_event_icon: null
  default_milestone_icon: null
  dot_color: "palette:PuBuGn:4"
  milestone_color: "palette:Accent:1"
  leader:
    color: "#888888"
    width: 0.75
    dasharray: null
    opacity: 1.0
    linecap: round
    marker_start: "none"
    marker_start_size: 3.0
    marker_end: "arrow-head"
    marker_end_size: 5.0
  leader_primary:
    color: "palette:PuBuGn:5"
    marker_end_size: 6.0
  leader_secondary:
    color: "palette:Accent:2"
    dasharray: "3,2"
    marker_start: "none"
    marker_start_size: 3.0
  today_line:
    show: true
    color: "palette:Accent:1"
    width: 1.0
    dasharray: "4,2"
    opacity: 0.85
    linecap: round
    linejoin: round
    label: today
    label_color: "palette:Accent:1"
    label_font_name: Roboto-Bold
    label_font_size: 9
    label_position: end
    marker_start: "none"
    marker_start_size: 4.0
    marker_end: "none"
    marker_end_size: 6.0
  arrow_head:
    color: "#888888"
  label:
    stroke_color: "#cccccc"
    stroke_width: 0.5
    stroke_dasharray: null
    fill_color: "palette:PuBuGn:1"
    fill_opacity: 0.85
    pattern: null
    pattern_opacity: 0.12
    text_color: "#1b1f24"
    corner_radius: 2.0
    padding_x: 6.0
    padding_y: 3.0
    icon_size: null            # null = match event-name font size
    icon_gap: 4.0
  label_palette: PuBuGn
compact_plan:
  palette_name: Accent
  axis_color: darkgrey
  axis_dasharray: 2,5
  text:
    font_color: '#333333'
  milestone_color: '#333333'
  bands:
    - date_range
    - week
blockplan:
  background_color: none
  grid_color: palette:Accent:7
  grid_opacity: 0.4
  grid_line_width: 1.0
  grid_dasharray: null
  timeband_line_color: null
  timeband_line_width: null
  timeband_line_opacity: null
  timeband_line_dasharray: null
  label_column_ratio: 0.1
  band_row_height: 10.0
  fiscal_year_start_month: 1
  week_start: 0
  show_unmatched_lane: true
  unmatched_lane_name: Other
  lane_match_mode: first
  header_font: RobotoCondensed-Bold
  header_font_size: null
  header_label_color: palette:Accent:4
  header_label_opacity: 1.0
  header_label_align_h: right
  header_heading_fill_color: none
  band_font: RobotoCondensed-Bold
  band_font_size: null
  timeband_label_color: palette:Accent:7
  timeband_label_opacity: 1.0
  timeband_fill_color: none
  timeband_fill_palette:
    - accent
  timeband_fill_opacity: 1.0
  lane_heading_fill_color: none
  lane_label_font: RobotoCondensed-Bold
  lane_label_font_size: null
  lane_label_color: palette:Accent:4
  lane_label_align_h: right
  lane_label_align_v: middle
  lane_label_rotation: 0
  event_show_date: false
  event_date_font: RobotoCondensed-Light
  event_date_font_size: null
  event_date_color: palette:Accent:7
  event_date_format: YYYY-MM-DD
  marker_radius: 2.0
  vertical_line_color: palette:Accent:5
  vertical_line_width: 1.5
  vertical_line_dasharray: null
  vertical_line_opacity: 0.85
  vertical_line_fill_color: none
  vertical_line_fill_opacity: 0.2
  duration_fill_opacity: 0.35
  duration_stroke_color: null
  duration_stroke_width: 1.0
  duration_stroke_opacity: 0.9
  duration_stroke_dasharray: null
  duration_bar_height: 8.0
  name_text:
    font_name: RobotoCondensed-Light
    font_color: palette:Accent:4
  palette:
    - palette:Accent:4
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:2
    - palette:Accent:1
    - palette:Accent:7
  palette_name: Accent
gantt:
  # dependency arrowhead; none to omit
  arrow_marker_end: arrow-head
  arrow_marker_end_size: 6.0
  arrow_linecap: round
  arrow_linejoin: round
  table_width_ratio: 0.38
  row_height: 14.0
  header_row_height: 18.0
  band_row_height: 10.0
  bar_height: 8.0
  indent_per_level: 8.0
  min_day_width: 4.0
  progress_color: black
  float_opacity_scale: 0.4
  milestone_icon: diamond-fill
  deadline_icon: square-fill
  rollup_icon: check
  show_dependencies: true
  show_today_line: true
time_bands:
  date_range:
    unit: week
    label: Date Range
    label_format: '{start} – {end}'
  week:
    unit: week
    label: Week
    label_format: Week {n}
style_rules:
  - name: timeline duration-bar fill opacity (ported from timeline.duration_bar_fill_opacity)
    apply_to: line:duration_bar
    select:
      visualizer: timeline
    style:
      opacity: 0.25
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 18
  - name: base font — papersize override
    apply_to: text:base
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:heading
    define: text
    as: heading
    style:
      font: Roboto-Bold
      size: 10
      color: palette:Accent:4
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - letter
        - ledger
    style:
      size: 18
  - name: text:heading — papersize override
    apply_to: text:heading
    select:
      papersize:
        - 3x5
        - 5x8
    style:
      size: 8
  - name: define text:body
    define: text
    as: body
    style:
      font: RobotoCondensed-Regular
      size: 8
      color: palette:Accent:7
  - name: define text:body_secondary
    define: text
    as: body_secondary
    style:
      font: RobotoCondensed-Italic
      size: 7
      color: palette:Accent:6
  - name: define text:label
    define: text
    as: label
    style:
      font: RobotoCondensed-Light
      size: 7
      color: palette:Accent:7
  - name: define text:label_bold
    define: text
    as: label_bold
    style:
      font: RobotoCondensed-Bold
      size: 7
      color: palette:Accent:7
  - name: define text:caption
    define: text
    as: caption
    style:
      font: RobotoCondensed-Light
      size: 6
      color: palette:Accent:7
  - name: define text:day_number
    define: text
    as: day_number
    style:
      font: Roboto-Bold
      size: 10
      color: palette:Accent:4
  - name: define text:month_title
    define: text
    as: month_title
    style:
      font: Roboto-Bold
      size: 8
      color: palette:Accent:4
  - name: define box:default
    define: box
    as: default
    style:
      fill: white
      fill_opacity: 1.0
      stroke: none
  - name: define box:cell
    define: box
    as: cell
    style:
      fill: palette:Accent:0
      fill_opacity: 0.15
      stroke: palette:Accent:7
      stroke_width: 2
      stroke_opacity: 0.2
  - name: define box:header
    define: box
    as: header
    style:
      fill: none
      stroke: none
  - name: define box:timeband
    define: box
    as: timeband
    style:
      fill: none
      fill_opacity: 1.0
      stroke: none
      fill_palette: Accent
      fill_colors:
        - palette:Accent:4
        - palette:Accent:0
        - palette:Accent:5
        - palette:Accent:2
        - palette:Accent:1
  - name: define box:highlight
    define: box
    as: highlight
    style:
      fill: palette:Accent:0
      fill_opacity: 0.15
      stroke: none
  - name: define box:callout
    define: box
    as: callout
    style:
      fill: white
      fill_opacity: 0.25
      stroke: palette:Accent:7
      stroke_width: 1.0
  - name: define line:grid
    define: line
    as: grid
    style:
      color: palette:Accent:7
      width: 0.5
      opacity: 0.4
  - name: define line:axis
    define: line
    as: axis
    style:
      color: palette:Accent:3
      width: 2
      opacity: 0.9
  - name: define line:separator
    define: line
    as: separator
    style:
      color: palette:Accent:7
      width: 0.5
      opacity: 0.5
  - name: define line:today
    define: line
    as: today
    style:
      color: palette:Accent:5
      width: 1.5
      opacity: 1.0
  - name: define line:connector
    define: line
    as: connector
    style:
      color: palette:Accent:7
      width: 0.5
      opacity: 1.0
      dasharray: 4 2
  - name: define icon:event
    define: icon
    as: event
    style:
      color: palette:Accent:4
      size: 10
  - name: define icon:duration
    define: icon
    as: duration
    style:
      color: palette:Accent:4
  - name: define icon:overflow
    define: icon
    as: overflow
    style:
      icon: send-backward
      color: orange
  - name: define line:tick
    define: line
    as: tick
    style:
      color: palette:Accent:1
      width: 0.5
      opacity: 1.0
  - name: today label color
    apply_to: text:today_label
    style:
      color: palette:Accent:3
  - name: band date_range — segment
    apply_to: box:band
    select:
      band: date_range
    style:
      fill: none
  - name: band week — segment
    apply_to: box:band
    select:
      band: week
    style:
      fill: none
  - name: blockplan_vline_0
    apply_to: box:vline
    select:
      band: Sprint
      repeat: true
    style:
      align: end
      fill:
        - palette:Accent:0
        - none
      fill_opacity: 0.1
element_overrides:
  ec-axis-tick:
    use: line:tick
  ec-tick-label:
    use: text:caption
  ec-week-number:
    use: text:label_bold
  ec-fiscal-label:
    use: text:caption
  ec-event-name:
    use: text:body
  ec-event-notes:
    use: text:body_secondary
  ec-event-date:
    use: text:caption
  ec-duration-date:
    use: text:caption
  ec-holiday-title:
    use: text:body
  ec-today-label:
    use: text:label
    color: palette:Accent:3
  ec-band-cell:
    use: box:timeband
  ec-vline-fill:
    use: box:highlight
  ec-day-box:
    use: box:cell
  ec-connector:
    use: line:connector
  ec-duration-marker:
    use: line:axis
  ec-legend-swatch:
    use: line:axis
