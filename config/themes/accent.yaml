# accent: every value not listed here comes from 'corporate'.
# See USER_GUIDE.md, "Theme inheritance".  Rewritten by tools/derive_theme.py.
extends: corporate
unset:
  - candybar.month_shade_colors
  - compact_plan.palette
  - blockplan.top_bands
  - time_bands.fiscal_quarter
  - time_bands.pi
  - time_bands.sprint
  - time_bands.month
  - time_bands.week_number
  - time_bands.date
  - time_bands.dow
theme:
  name: Accent
  description: Palette-driven theme with all colors from the Accent DB palette — unified theme model
base: {default_missing_icon: star-dashed}
events:
  icon_color: palette:Accent:4
  item_placement_order: [milestones, events, durations]
overflow: {icon: send-backward}
colors:
  month_palette: PuBuGn
  fiscal_palette: Accent
  group_palette: PuBuGn
  hash_lines: palette:Accent:7
  federal_holiday: {color: 'palette:Accent:5', opacity: 0.25}
  company_holiday: {color: 'palette:Accent:0', opacity: 0.25}
mini_calendar:
  adjacent_month_color: palette:Accent:1
  holiday_color: palette:Accent:5
  nonworkday_fill_color: palette:Accent:3
  milestone_color: palette:Accent:4
  milestone_stroke_color: palette:Accent:4
  current_day_color: palette:Accent:2
candybar:
  grid_line_color: lightgrey
  weekend_fill: null
  month_shading: false
  month: {color: teal}
  month_box: {fill: null, stroke: cadetblue}
timeline:
  today_line_color: palette:Accent:5
  marker_stroke_color: palette:Accent:4
  top_colors:
    - palette:Accent:4
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:2
    - palette:Accent:1
  bottom_colors:
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:4
    - palette:Accent:1
    - palette:Accent:2
  palette: Accent
pit:
  axis: {color: '#cccccc'}
  tick_color: '#aaaaaa'
  ticks:
    - unit: month
      label_format: MMM
      label_side: below
      tick_length: 8.0
      tick_color: '#7a7a7a'
      label_color: '#7a7a7a'
      label_gap: 16.0
    - unit: week
      show_labels: true
      label_format: DD
      label_side: above
      label_color: '#aaaaaa'
      label_font_size: 6
      max_label_count: 400
      tick_length: 3.0
      tick_color: '#cccccc'
      tick_opacity: 0.6
  date_text: {color: '#888888'}
  dot_color: palette:PuBuGn:4
  milestone_color: palette:Accent:1
  leader: {color: '#888888'}
  leader_primary: {color: 'palette:PuBuGn:5'}
  leader_secondary: {color: 'palette:Accent:2'}
  today_line: {color: 'palette:Accent:1', label_color: 'palette:Accent:1'}
  arrow_head: {color: '#888888'}
  label:
    stroke_color: '#cccccc'
    fill_color: palette:PuBuGn:1
    text_color: '#1b1f24'
  label_palette: PuBuGn
compact_plan: {palette_name: Accent}
blockplan:
  label_column_ratio: 0.1
  fiscal_year_start_month: 1
  unmatched_lane_name: Other
  header_label_align_h: right
  timeband_fill_palette: [accent]
  lane_label_align_h: right
  palette:
    - palette:Accent:4
    - palette:Accent:0
    - palette:Accent:5
    - palette:Accent:2
    - palette:Accent:1
    - palette:Accent:7
  palette_name: Accent
  swimlanes:
    - {name: Other}
style_rules:
  - name: box:duration — blockplan (from blockplan)
    style: {stroke_width: 1.0}
  - name: resource group a
    style: {fill: 'palette:Accent:4'}
  - name: resource group b
    style: {fill: 'palette:Accent:0'}
  - name: resource group c
    style: {fill: 'palette:Accent:1'}
  - name: resource group d
    style: {fill: 'palette:Accent:7'}
  - name: define text:heading
    style: {size: 10, color: 'palette:Accent:4'}
  - name: text:heading — letter / ledger paper
    style: {size: 18}
  - name: define text:body
    style: {color: 'palette:Accent:7'}
  - name: define text:body_secondary
    style: {color: 'palette:Accent:6'}
  - name: define text:label
    style: {color: 'palette:Accent:7'}
  - name: define text:label_bold
    style: {color: 'palette:Accent:7'}
  - name: define text:caption
    style: {color: 'palette:Accent:7'}
  - name: define text:day_number
    style: {color: 'palette:Accent:4'}
  - name: define text:month_title
    style: {font: Roboto-Bold, color: 'palette:Accent:4'}
  - name: define box:cell
    style:
      fill: palette:Accent:0
      fill_opacity: 0.15
      stroke: palette:Accent:7
      stroke_width: 2
      stroke_opacity: 0.2
  - name: define box:timeband
    style:
      fill_palette: Accent
      fill_colors:
        - palette:Accent:4
        - palette:Accent:0
        - palette:Accent:5
        - palette:Accent:2
        - palette:Accent:1
  - name: define box:highlight
    style: {fill: 'palette:Accent:0', fill_opacity: 0.15}
  - name: define box:callout
    style: {fill: white, stroke: 'palette:Accent:7'}
  - name: define line:grid
    style: {color: 'palette:Accent:7'}
  - name: define line:axis
    style: {color: 'palette:Accent:3'}
  - name: define line:separator
    style: {color: 'palette:Accent:7'}
  - name: define line:today
    style: {color: 'palette:Accent:5'}
  - name: define line:connector
    style: {color: 'palette:Accent:7'}
  - name: define icon:event
    style: {color: 'palette:Accent:4'}
  - name: define icon:duration
    style: {color: 'palette:Accent:4'}
  - name: define icon:overflow
    style: {icon: send-backward, color: orange}
  - name: define line:tick
    style: {color: 'palette:Accent:1'}
  - name: today label color
    style: {color: 'palette:Accent:3'}
  - name: box:band — blockplan (from blockplan)
    style: {stroke_opacity: 0.4}
  - name: blockplan_vline_0
    style:
      fill: ['palette:Accent:0', none]
      fill_opacity: 0.1
  - {name: 'define text:week_number'}
  - name: route everything to Other
    apply_to: lane
    select: {}
    style: {swimlane: Other}
  - {name: band fiscal_quarter — segment, remove: true}
  - {name: band pi — segment, remove: true}
  - {name: band sprint — segment, remove: true}
  - {name: band month — segment, remove: true}
  - {name: band week_number — segment, remove: true}
  - {name: band date — segment, remove: true}
  - {name: band dow — segment, remove: true}
  - {name: weekly_hash_0, remove: true}
  - {name: weekly_hash_1, remove: true}
  - {name: weekly_hash_2, remove: true}
  - {name: weekly_hash_3, remove: true}
  - {name: weekly_hash_4, remove: true}
  - {name: weekly_hash_5, remove: true}
  - {name: weekly_hash_6, remove: true}
  - {name: weekly_hash_7, remove: true}
  - {name: weekly_hash_8, remove: true}
  - {name: Route Engineering, remove: true}
  - {name: Route Operations, remove: true}
  - {name: Route Quality, remove: true}
element_overrides:
  ec-today-label: {color: 'palette:Accent:3'}
