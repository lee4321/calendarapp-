[project]
name = "CalendarApp"
version = "0.1.0"
description = "Create a variety of calendars with your events and duration data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow>=1.3.0",
    "drawsvg>=2.4.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0.post0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "fonttools>=4.50.0",
    "holidays>=0.92",
    "intervaltree>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.7",
]

[tool.uv]
# PyPI's Pillow wheels ship without libraqm, which silently drops text
# measurement to the BASIC layout engine (whole-pixel advances, no kerning)
# and shifts every rendered label.  Build from source against the system
# libraqm instead (macOS: `brew install libraqm`); guarded by
# tests/test_text_layout_engine.py.
no-binary-package = ["pillow"]

[tool.ty.src]
# Vendored third-party code and agent worktrees aren't ours to type-check.
exclude = ["vendor", ".claude"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor", ".claude"]

[tool.ruff.lint]
# Explicit rule set so results don't shift with ruff's defaults.
# E501 (line length) is left to a formatter; DTZ is off because calendar
# dates are intentionally naive.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# En dashes (date ranges), multiplication signs (dimensions) and minus signs
# (CLI help arithmetic) are intentional.
allowed-confusables = ["–", "×", "−"]
ignore = [
    # Nested `if key in rule:` / `if mismatch: return False` blocks read as a
    # criterion checklist (rule_engine, icon_band); collapsing them doesn't.
    "SIM102",
    # `base + [...]` multi-line option lists read better than unpacking with
    # no formatter to wrap the result.
    "RUF005",
]
# Checks ruff doesn't run; their noqa codes stay as documentation.
external = ["BLE001", "D401"]

[tool.ruff.lint.per-file-ignores]
# Glyph sample tables: math-italic letters, Roman numerals, a true minus sign.
"config/config.py" = ["RUF001", "RUF003"]
