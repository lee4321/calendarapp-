[project]
name = "CalendarApp"
version = "0.1.0"
description = "Create a variety of calendars with your events and duration data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow>=1.3.0",
    "drawsvg>=2.4.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0.post0",
    "pillow>=11.0.0",
    "pyyaml>=6.0",
    "fonttools>=4.50.0",
    "holidays>=0.92",
    "intervaltree>=3.1.0",
    "textual>=8.2.7",
    "slint>=1.17.0b2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.7",
]

[tool.ty.src]
# Vendored third-party code and agent worktrees aren't ours to type-check.
exclude = ["vendor", ".claude"]

[tool.ruff]
extend-exclude = ["vendor", ".claude"]

[tool.ruff.lint]
# Explicit rule set so results don't shift with ruff's defaults.
# E501 (line length) is left to a formatter; DTZ is off because calendar
# dates are intentionally naive.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# En dashes (date ranges) and multiplication signs (dimensions) are intentional.
allowed-confusables = ["–", "×"]
